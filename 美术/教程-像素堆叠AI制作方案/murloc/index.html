/*
===============================================================================

===============================================================================
核心升级（v3 两栖蛙跳骨骼型 + actorBuf 整体外轮廓）：
1. 【13 个轻量模块化部件（总建模 < 22ms）+ 严格锁枢轴】：
   - legL / legR（屈膝粗腿+宽大三趾扇形蹼足，120fps 交替碎步与蓄力蛙跳蹬伸）、

     head / headPuff（扁圆蛙鱼头 + 3 道分层呼吸鳃裂 + 阔嘴白尖牙 + 外凸大圆鱼眼 +Y/0.6 0 遮挡）、
     armL / armR（健壮双臂）、shield（绑海草扇形贝壳小盾，锁在左前臂）、
     tridentHold / tridentThrust / tridentSlam（粗实海兽骨叉+自亮水珠饰坠，握柄枢轴锁右手）、
     thrownTrident（独立脱手投掷骨叉，零重建模共享色表）。
2. 【真实两栖双生态】：
   - 滩涂鼓腮警戒：低重心微蹲、呼吸鳃裂节奏起伏、左右警觉扫视、短尾轻摆、骨叉与贝壳盾戒备；
   - 滩涂蛙跳巡滩 (S)：4 阶段真实蛙跳巡游（深蹲蓄力 → 蹼足猛蹬腾空 → 空中前扑 → 踩水落滩），
     每次落地在前景激起破水白沫弧与浅水涟漪，彻底告别浮空平移！
3. 【actorBuf(260×240) 整体 1px 外轮廓】：内部浑然一体零拼装黑线，完整保留 4 色系与 4 技能。
===============================================================================
*/

const PAL_KEYS = Object.keys(PAL);
const KEY_TO_ID = Object.create(null);
const ID_TO_KEY = [null];
const ID_TO_RGBA = [null];
const GLOW_KEY_SET = new Set(['emissiveMid', 'emissiveCore']);
const GLOW_ID_SET = new Set();

for (let i = 0; i < PAL_KEYS.length; i++) {

  ID_TO_KEY[id] = k;

  ID_TO_RGBA[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];

}

// ---------------------------------------------------------------------------

function buildRgbaTable(skin) {
  const tbl = ID_TO_RGBA.slice();
  if (skin && skin.pal) {
    for (const k in skin.pal) {
      const id = KEY_TO_ID[k];
      if (!id) continue;
      const n = parseInt(skin.pal[k].slice(1), 16);
      tbl[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
    }
  }
  return tbl;
}

function recolorAsset(asset, rgbaTable) {
  const { w, d, h, grid, activeLayers, glowLayers, glowSlot, strip, glowStrip, sim, eim } = asset;
  const stripW = w * h, glowW = w * glowLayers.length;
  const sData = sim.data, eData = eim ? eim.data : null;
  for (let li = 0; li < activeLayers.length; li++) {
    const z = activeLayers[li], gxOff = z * w, gSlot = glowSlot[z], zBase = z * d * w;
    for (let y = 0; y < d; y++) {
      const row = zBase + y * w, sRow = y * stripW + gxOff;
      const eRow = gSlot >= 0 ? (y * glowW + gSlot * w) : -1;
      for (let x = 0; x < w; x++) {
        const id = grid[row + x];
        if (!id) continue;
        const rgba = rgbaTable[id];
        const si = (sRow + x) * 4;
        sData[si] = rgba[0]; sData[si + 1] = rgba[1]; sData[si + 2] = rgba[2]; sData[si + 3] = 255;
        if (eData && eRow >= 0 && GLOW_ID_SET.has(id)) {
          const ei = (eRow + x) * 4;
          eData[ei] = rgba[0]; eData[ei + 1] = rgba[1]; eData[ei + 2] = rgba[2]; eData[ei + 3] = 255;
        }
      }
    }
  }
  strip.getContext('2d').putImageData(sim, 0, 0);
  if (glowStrip && eim) glowStrip.getContext('2d').putImageData(eim, 0, 0);
}

const PART_NAMES = [
  'none',
  'torso', 'belly', 'tail', 'head', 'jaw', 'teeth', 'gill', 'eye',
  'dorsalFin', 'leg', 'foot', 'arm', 'shield', 'seaweed', 'trident', 'charm',

];
const PART_ID = Object.create(null);
for (let i = 0; i < PART_NAMES.length; i++) PART_ID[PART_NAMES[i]] = i;

const NUM_PARTS = PART_NAMES.length;
const NO_CREASE_LUT = new Uint8Array(NUM_PARTS * NUM_PARTS);
for (const [a, b] of [
  ['eye', 'head'], ['head', 'torso'], ['torso', 'tail'], ['torso', 'leg'], ['leg', 'foot'],
  ['torso', 'arm'], ['teeth', 'jaw'], ['teeth', 'head'],

]) {

  NO_CREASE_LUT[ia * NUM_PARTS + ib] = 1;
  NO_CREASE_LUT[ib * NUM_PARTS + ia] = 1;
}

const MATERIAL_KEYS = [null, 'skin', 'spot', 'belly', 'fin', 'finEdge', 'gill', 'bone', 'shell', 'weed', 'reef', 'wood'];

for (let i = 1; i < MATERIAL_KEYS.length; i++) MAT_ID[MATERIAL_KEYS[i]] = i;

// ---------------------------------------------------------------------------
// 2. 数学原语与周期噪声
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const smin = (a, b, k) => {
  const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
  return lerp(b, a, h) - k * h * (1 - h);
};
function localToWorldXY(rx, ry, yaw, lx, ly) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  return [rx + cy * lx - sy * ly, ry + sy * lx + cy * ly];
}
function hash2i(ix, iy, seed) {
  let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function periodicNoise2(x, y, periodX, periodY, cell, seed) {
  const gx = x / cell, gy = y / cell;
  const px = Math.max(1, Math.round(periodX / cell));
  const py = Math.max(1, Math.round(periodY / cell));
  const ix = Math.floor(gx), iy = Math.floor(gy);
  const fx = gx - ix, fy = gy - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const wMod = (v, m) => ((v % m) + m) % m;
  const x0 = wMod(ix, px), x1 = wMod(ix + 1, px);
  const y0 = wMod(iy, py), y1 = wMod(iy + 1, py);
  return lerp(
    lerp(hash2i(x0, y0, seed), hash2i(x1, y0, seed), ux),
    lerp(hash2i(x0, y1, seed), hash2i(x1, y1, seed), ux),
    uy
  );
}

// ---------------------------------------------------------------------------
// 3. 高性能体素网格
// ---------------------------------------------------------------------------
class VoxelModel {
  constructor(w, d, h) {
    this.w = w; this.d = d; this.h = h;
    const len = w * d * h;
    this.grid = new Uint8Array(len);
    this.parts = new Uint8Array(len);
  }
  idx(x, y, z) { return (z * this.d + y) * this.w + x; }
  inB(x, y, z) { return x >= 0 && y >= 0 && z >= 0 && x < this.w && y < this.d && z < this.h; }
  getId(x, y, z) { return this.inB(x, y, z) ? this.grid[this.idx(x, y, z)] : 0; }
  getPartId(x, y, z) { return this.inB(x, y, z) ? this.parts[this.idx(x, y, z)] : 0; }
  setRaw(x, y, z, val, partId) {
    if (!this.inB(x, y, z)) return;
    const i = this.idx(x, y, z);
    this.grid[i] = val; this.parts[i] = partId;
  }
  fillAABB(X0, X1, Y0, Y1, Z0, Z1, fn) {
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(X0 + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(X1 + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Y0 + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Y1 + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Z0),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Z1),       0, this.h - 1);
    for (let z = z0; z <= z1; z++) {
      for (let y = y0; y <= y1; y++) {
        const Y = y - hd;
        for (let x = x0; x <= x1; x++) fn(x, y, z, x - hw, Y);
      }
    }
  }
  paintCapsule(ax, ay, az, bx, by, bz, r0, r1, val, partId, overwrite = true) {
    const pad = Math.max(r0, r1) + 0.6;
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(Math.min(ax, bx) - pad + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(Math.max(ax, bx) + pad + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Math.min(ay, by) - pad + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Math.max(ay, by) + pad + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Math.min(az, bz) - pad),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Math.max(az, bz) + pad),       0, this.h - 1);
    const abx = bx - ax, aby = by - ay, abz = bz - az;
    const invDen = 1 / (abx * abx + aby * aby + abz * abz || 1);
    const dr = r1 - r0;
    const { w, d, grid, parts } = this;
    for (let z = z0; z <= z1; z++) {
      const apz = z - az, zOff = z * d * w;
      for (let y = y0; y <= y1; y++) {
        const apy = (y - hd) - ay, row = zOff + y * w, dotYZ = apy * aby + apz * abz;
        for (let x = x0; x <= x1; x++) {
          const i = row + x;
          if (!overwrite && grid[i]) continue;
          const apx = (x - hw) - ax;
          let t = (apx * abx + dotYZ) * invDen;
          if (t < 0) t = 0; else if (t > 1) t = 1;
          const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
          const r = r0 + dr * t;
          if (dx * dx + dy * dy + dz * dz <= r * r) { grid[i] = val; parts[i] = partId; }
        }
      }
    }
  }
  paintEllipsoid(cx, cy, cz, rx, ry, rz, val, partId, overwrite = true) {
    this.fillAABB(cx - rx - 0.5, cx + rx + 0.5, cy - ry - 0.5, cy + ry + 0.5, cz - rz - 0.5, cz + rz + 0.5, (x, y, z, X, Y) => {
      const i = this.idx(x, y, z);
      if (!overwrite && this.grid[i]) return;
      const dx = (X - cx) / rx, dy = (Y - cy) / ry, dz = (z - cz) / rz;
      if (dx * dx + dy * dy + dz * dz <= 1.0) { this.grid[i] = val; this.parts[i] = partId; }
    });
  }
  despeckle() {
    const src = this.grid.slice(), prt = this.parts;
    const { w, d, h } = this, wd = w * d;
    const pEye = PART_ID.eye, pTeeth = PART_ID.teeth, pCharm = PART_ID.charm;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          if (!src[i]) continue;
          const p = prt[i];
          if (p === pEye || p === pTeeth || p === pCharm) continue;
          if ((x + 1 < w && src[i + 1]) || (x > 0 && src[i - 1]) ||
              (y + 1 < d && src[i + w]) || (y > 0 && src[i - w]) ||
              (z + 1 < h && src[i + wd]) || (z > 0 && src[i - wd])) continue;
          this.grid[i] = 0; this.parts[i] = 0;
        }
      }
    }
  }
  applyArtShading(keepSoftBottom = false) {
    const { w, d, h } = this, wd = w * d;
    const src = this.grid.slice(), prt = this.parts;
    const pMinZ = new Int16Array(NUM_PARTS).fill(999);
    const pMaxZ = new Int16Array(NUM_PARTS).fill(-1);
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let i = zOff, end = zOff + wd; i < end; i++) {
        const p = prt[i];
        if (p) { if (z < pMinZ[p]) pMinZ[p] = z; if (z > pMaxZ[p]) pMaxZ[p] = z; }
      }
    }
    const headId = PART_ID.head;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd, hasUp = z + 1 < h, hasDn = z > 0;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x, v = src[i];
          if (v < MAT_BASE) continue;
          const ramp = RAMPS_BY_MAT[v - MAT_BASE];
          if (!ramp) continue;
          const myP = prt[i], lutOff = myP * NUM_PARTS;
          const topEmpty = !hasUp || !src[i + wd];
          const botEmpty = hasDn && !src[i - wd];
          let crease = false, np;
          if (x + 1 < w && (np = prt[i + 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (x > 0 && (np = prt[i - 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y + 1 < d && (np = prt[i + w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y > 0 && (np = prt[i - w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (hasDn && (np = prt[i - wd]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;

          let upperOcc = 0;
          if (hasUp && !topEmpty) {
            const up = i + wd;
            for (let oy = -1; oy <= 1; oy++) {
              const yy = y + oy;
              if (yy < 0 || yy >= d) continue;
              const uRow = up + oy * w;
              for (let ox = -1; ox <= 1; ox++) {
                const xx = x + ox;
                if (xx >= 0 && xx < w && src[uRow + ox]) upperOcc++;
              }
            }
          }
          const span = Math.max(1, pMaxZ[myP] - pMinZ[myP]);
          const localZ = (z - pMinZ[myP]) / span;
          let idx = 1;
          if (ramp.length === 2) {
            idx = (topEmpty && !crease && upperOcc < 7) ? 1 : 0;
          } else {
            if (botEmpty || (!keepSoftBottom && z <= 1)) idx = 0;
            else if (crease && !topEmpty) idx = 0;
            else if (upperOcc >= 8 && localZ < 0.45) idx = 0;
            else if (topEmpty) idx = (crease || upperOcc >= 8) ? 1 : 2;
            else if (span >= 14 && localZ < 0.14) idx = 0;
            else idx = 1;
          }
          if (myP === headId && idx === 2 && z < pMaxZ[myP] - 1) {
            const edge2d = (x + 1 >= w || !src[i + 1]) || (x === 0 || !src[i - 1]) ||
                           (y + 1 >= d || !src[i + w]) || (y === 0 || !src[i - w]);
            if (!edge2d) idx = 1;
          }
          this.grid[i] = ramp[clamp(idx, 0, ramp.length - 1)];
        }
      }
    }
  }
  toStripAsset(makeCanvas, meta = {}) {
    const { w, d, h } = this;
    const activeLayers = [], glowLayers = [];
    for (let z = 0; z < h; z++) {
      let hasPx = false, hasGlow = false;
      const zBase = z * d * w;
      for (let i = 0; i < d * w; i++) {
        const id = this.grid[zBase + i];
        if (!id) continue;
        hasPx = true;
        if (GLOW_ID_SET.has(id)) hasGlow = true;
      }
      if (hasPx) activeLayers.push(z);
      if (hasGlow) glowLayers.push(z);
    }
    const strip = makeCanvas(w * h, d);
    const sim = strip.getContext('2d').createImageData(w * h, d);
    const hasGlow = glowLayers.length > 0;
    const glowStrip = hasGlow ? makeCanvas(w * glowLayers.length, d) : null;
    const eim = glowStrip ? glowStrip.getContext('2d').createImageData(w * glowLayers.length, d) : null;
    const glowSlot = new Int16Array(h).fill(-1);
    for (let i = 0; i < glowLayers.length; i++) glowSlot[glowLayers[i]] = i;

    const foot = makeCanvas(w, d);
    const fg = foot.getContext('2d');
    const fim = fg.createImageData(w, d);
    for (let y = 0; y < d; y++) for (let x = 0; x < w; x++) {
      for (let z = 0; z < h; z++) {
        if (this.grid[(z * d + y) * w + x]) {
          const fi = (y * w + x) * 4;
          fim.data[fi] = 10; fim.data[fi + 1] = 16; fim.data[fi + 2] = 20; fim.data[fi + 3] = 255;
          break;
        }
      }
    }
    fg.putImageData(fim, 0, 0);

    const asset = {
      w, d, h, grid: this.grid,
      strip, glowStrip, sim, eim,
      glowSlot, activeLayers, glowLayers,
      footShadow: foot,
      meta: {
        footRadius: meta.footRadius || 10.0,
        headZ: meta.headZ || (activeLayers.length ? activeLayers[activeLayers.length - 1] + 2 : h),
        centerZ: meta.centerZ || Math.round(h * 0.5)
      }
    };
    recolorAsset(asset, ID_TO_RGBA);
    return asset;
  }
}

// 4. 滩涂鱼人战士 13 个模块化体素部件（极速建模 + 锁枢轴）
// ---------------------------------------------------------------------------
function buildMurlocLegPart(side) {
  const m = new VoxelModel(10, 12, 12);
  const s = side;
  m.paintCapsule(0, -1.6, 9.6, s * 1.4, 0.8, 5.4, 2.15, 1.80, mat('skin'), PART_ID.leg, true);
  m.paintCapsule(s * 1.4, 0.8, 5.4, s * 0.4, 0.2, 1.4, 1.75, 1.42, mat('skin'), PART_ID.leg, true);
  // 宽大三趾扇形蹼足（z=0 贴地）
  const heelY = -1.4;
  m.fillAABB(-3.2, 3.2, heelY - 0.4, 5.6, 0, 2, (x, y, z, X, Y) => {
    if (z > 1) return;
    const dy = Y - heelY;
    if (dy < 0 || dy > 6.4) return;
    const u = dy / 6.4, cx = s * 0.4 * u, halfW = lerp(1.5, 2.75, u);
    if (Math.abs(X - cx) <= halfW && dy <= 5.4 + Math.cos(((X - cx) / halfW) * Math.PI * 1.5) * 0.72) {
      m.setRaw(x, y, z, z === 0 ? mat('skin') : mat('spot'), PART_ID.foot);
    }
  });
  for (const [tx, ty] of [[s * 2.4, 4.4], [s * 0.4, 5.2], [-s * 1.6, 4.4]]) {
    m.paintCapsule(s * 0.4, -0.2, 1.0, tx, ty, 0.8, 1.12, 0.95, mat('skin'), PART_ID.foot, true);
  }
  m.despeckle();
  m.applyArtShading(false);
  return m;
}

function buildMurlocTorsoPart() {
  const m = new VoxelModel(16, 18, 22);
  m.fillAABB(-6.8, 6.8, -8.5, 5.5, 0, 16, (x, y, z, X, Y) => {
    const dTorso = (Math.hypot(X / 6.2, (Y + 1.0) / 5.7, (z - 6.4) / 5.8) - 1) * 5.8;
    const dHunch = (Math.hypot(X / 5.5, (Y + 2.2) / 5.0, (z - 10.6) / 4.2) - 1) * 4.2;
    if (smin(dTorso, dHunch, 1.8) <= 0) {
      const isBelly = Y > 0.2 && z >= 1.2 && z <= 10.2 && Math.abs(X) < 4.5;
      const spotA = Math.hypot((X - 3.2) / 3.6, (Y + 0.2) / 4.0, (z - 9.4) / 3.4) <= 1.0;
      const spotC = Math.hypot((X + 3.4) / 3.0, (Y + 3.4) / 3.4, (z - 5.4) / 2.8) <= 1.0;
      const val = isBelly ? mat('belly') : ((spotA || spotC) ? mat('spot') : mat('skin'));
      m.setRaw(x, y, z, val, isBelly ? PART_ID.belly : PART_ID.torso);
    }
  });
  // 背部锯齿大背鳍（3 枚脊背鳍，|X|≤1.35）
  const finSpine = [
    [-2.4, 14.8, -4.6, 20.4, 1.38, 1.06],
    [-5.2, 12.0, -7.8, 17.6, 1.32, 1.05],
    [-7.4,  8.6, -9.8, 13.4, 1.25, 1.04]
  ];
  for (const sp of finSpine) {
    const my = lerp(sp[0], sp[2], 0.62), mz = lerp(sp[1], sp[3], 0.62);
    m.paintCapsule(0, sp[0], sp[1], 0, my, mz, sp[4], 1.12, mat('fin'), PART_ID.dorsalFin, true);
    m.paintCapsule(0, my, mz, 0, sp[2], sp[3], 1.12, sp[5], mat('finEdge'), PART_ID.dorsalFin, true);
  }
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

// 粗短两栖尾（尾根枢轴在局部 (0, TAIL_PIVOT_Y)，摆放时锁在躯干后臀！）
const MURLOC_TAIL_PIVOT_Y = 4.2;
function buildMurlocTailPart() {
  const m = new VoxelModel(8, 12, 10);
  const ry = MURLOC_TAIL_PIVOT_Y;
  m.paintCapsule(0, ry, 4.0, 0, ry - 3.6, 3.0, 2.75, 2.05, mat('skin'), PART_ID.tail, true);
  m.paintCapsule(0, ry - 3.6, 3.0, 0, ry - 6.8, 2.2, 2.05, 1.35, mat('skin'), PART_ID.tail, true);
  // 尾背鳍棘
  m.paintCapsule(0, ry - 3.4, 4.6, 0, ry - 6.0, 8.2, 1.18, 1.02, mat('fin'), PART_ID.dorsalFin, true);
  m.paintCapsule(0, ry - 5.2, 7.0, 0, ry - 6.4, 8.8, 1.05, 0.95, mat('finEdge'), PART_ID.dorsalFin, true);
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

function buildMurlocHeadPart(puff = false) {
  const W = 18, D = 18, H = 18;
  const m = new VoxelModel(W, D, H);
  const puffX = puff ? 1.85 : 0, puffY = puff ? 1.15 : 0;
  const hz = 5.4, hy = 0.2;
  m.fillAABB(-8.4, 8.4, -5.8, 8.2, 0.5, 10.8, (x, y, z, X, Y) => {
    let dHead = (Math.hypot(X / (6.3 + puffX * 0.45), (Y - hy) / (5.5 + puffY * 0.35), (z - hz) / 4.2) - 1) * 4.2;
    if (puff) {
      const dCL = (Math.hypot((X + 5.2) / 3.1, (Y - (hy + 2.0)) / 3.0, (z - (hz - 0.8)) / 2.6) - 1) * 2.6;
      const dCR = (Math.hypot((X - 5.2) / 3.1, (Y - (hy + 2.0)) / 3.0, (z - (hz - 0.8)) / 2.6) - 1) * 2.6;
      dHead = smin(dHead, Math.min(dCL, dCR), 1.4);
    }
    if (dHead <= 0) {
      const spotB = Math.hypot((X + 2.6) / 3.4, (Y - (hy + 1.2)) / 3.6, (z - (hz + 1.2)) / 2.7) <= 1.0;
      m.setRaw(x, y, z, spotB ? mat('spot') : mat('skin'), PART_ID.head);
    }
  });
  // 阔嘴与尖齿 / 鼓腮蓄水弹（上吻止于 Z≤hz+1.2，绝不遮挡上方大鱼眼）
  if (!puff) {
    m.paintEllipsoid(0, hy + 4.0, hz - 0.3, 5.2, 2.8, 1.35, mat('skin'), PART_ID.head, true);
    m.paintEllipsoid(0, hy + 3.6, hz - 3.2, 4.7, 2.6, 1.25, mat('belly'), PART_ID.jaw, true);
    m.fillAABB(-3.8, 3.8, hy + 3.4, hy + 6.0, hz - 2.4, hz - 1.0, (x, y, z, X, Y) => {
      if (Math.abs(X) <= 3.6 && Y >= hy + 3.6 && Y <= hy + 5.8 && z >= Math.round(hz - 2.2) && z <= Math.round(hz - 1.3)) {
        m.setRaw(x, y, z, KEY_TO_ID.gillDark, PART_ID.jaw);
      }
    });
    const hw = W * 0.5 - 0.5, hd = D * 0.5 - 0.5, tz = Math.round(hz - 1.8);
    for (const tx of [-3.2, -1.2, 1.2, 3.2]) {
      const ix = Math.round(hw + tx), iy = Math.round(hd + hy + 5.9 - Math.abs(tx) * 0.25);
      m.setRaw(ix, iy, tz, KEY_TO_ID.boneHi, PART_ID.teeth);
      m.setRaw(ix, iy, tz + 1, KEY_TO_ID.boneHi, PART_ID.teeth);
    }
  } else {
    m.paintEllipsoid(0, hy + 5.2, hz - 1.4, 2.6, 2.2, 1.8, mat('skin'), PART_ID.jaw, true);
    m.fillAABB(-1.2, 1.2, hy + 6.4, hy + 7.8, hz - 2.2, hz - 0.6, (x, y, z, X, Y) => {
      if (Math.hypot(X, z - (hz - 1.4)) <= 1.15 && Y >= hy + 6.6 && Y <= hy + 7.5) {
        m.setRaw(x, y, z, KEY_TO_ID.emissiveCore, PART_ID.charm);
      }
    });
  }
  // 两侧分层鳃裂
  for (const s of [-1, 1]) {
    const gx = s * (5.9 + puffX * 0.55);
    for (let gi = 0; gi < 3; gi++) {
      m.paintCapsule(gx, hy - 0.4 - gi * 1.4, hz - 2.8 + gi * 0.35, gx + s * 0.5, hy - 0.7 - gi * 1.4, hz - 0.4 + gi * 0.35, 0.85, 0.75, mat('gill'), PART_ID.gill, true);
    }
  }
  // 头顶两枚锯齿背鳍（|X|≤1.35，与大圆鱼眼 X=±4.6 完全分离）
  for (const sp of [[hy - 0.6, hz + 3.6, hy - 1.2, hz + 8.4, 1.35, 1.05], [hy - 3.6, hz + 3.0, hy - 5.0, hz + 9.8, 1.40, 1.08]]) {
    const my = lerp(sp[0], sp[2], 0.62), mz = lerp(sp[1], sp[3], 0.62);
    m.paintCapsule(0, sp[0], sp[1], 0, my, mz, sp[4], 1.12, mat('fin'), PART_ID.dorsalFin, true);
    m.paintCapsule(0, my, mz, 0, sp[2], sp[3], 1.12, sp[5], mat('finEdge'), PART_ID.dorsalFin, true);
  }
  m.despeckle();
  m.applyArtShading(true);

  // 后置两颗外凸大圆鱼眼（Z∈[hz+2.0, hz+5.5]，+Y 与 0.6 俯视严格 0 遮挡）
  const eyeZ = hz + 3.6, eyeY = hy + 3.9 + puffY * 0.35;
  for (const s of [-1, 1]) {
    const ex = s * (4.6 + puffX * 0.25);
    m.fillAABB(ex - 2.4, ex + 2.4, eyeY - 2.3, eyeY + 2.3, eyeZ - 2.2, eyeZ + 2.3, (x, y, z, X, Y) => {
      const dx = (X - ex) / 2.05, dy = (Y - eyeY) / 2.05, dz = (z - eyeZ) / 1.95;
      if (dx * dx + dy * dy + dz * dz <= 1.0) {
        let col = KEY_TO_ID.eyeIris;
        if (Y >= eyeY + 0.65 && Math.hypot(X - (ex + s * 0.35), z - eyeZ) <= 1.18) col = KEY_TO_ID.eyeDark;
        if (Y >= eyeY + 0.85 && z >= eyeZ + 0.65 && Math.abs(X - (ex + s * 0.55)) <= 0.75) col = KEY_TO_ID.eyeGlint;
        m.setRaw(x, y, z, col, PART_ID.eye);
      }
    });
  }
  return m;
}

function buildMurlocArmPart(side) {
  const m = new VoxelModel(10, 10, 8);
  const s = side;
  m.paintCapsule(0, 0, 5.0, s * 3.0, 1.6, 3.0, 1.75, 1.5, mat('skin'), PART_ID.arm, true);
  m.paintCapsule(s * 3.0, 1.6, 3.0, s * 4.4, 4.2, 3.8, 1.5, 1.35, mat('skin'), PART_ID.arm, true);
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

function buildMurlocShieldPart() {
  const m = new VoxelModel(11, 10, 13);
  m.fillAABB(-4.8, 4.4, -4.2, 4.2, 0.5, 12.2, (x, y, z, X, Y) => {
    const lz = z - 6.0;
    const distPlane = X * (-0.52) + Y * 0.85;
    const u = X * 0.85 + Y * 0.52, v = lz;
    const ang = Math.atan2(u, v + 4.6), rad = Math.hypot(u, v + 4.6);
    if (Math.abs(ang) <= 0.82 && rad >= 1.2 && rad <= 9.8) {
      if (rad <= 9.0 + Math.cos(ang * 9) * 0.72) {
        const ridge = Math.cos(ang * 9) * 0.38, thick = 1.20 + (rad < 3.0 ? 0.3 : 0);
        if (Math.abs(distPlane - ridge) <= thick) {
          const isStrap = Math.abs(v + u * 0.42 - 0.6) <= 0.95;

function buildTrainingDummy() {
  const m = new VoxelModel(16, 16, 30);
  const hw = 7.5, hd = 7.5;
  for (let z = 0; z < 30; z++) for (let y = 0; y < 16; y++) {
    const Y = y - hd;
    for (let x = 0; x < 16; x++) {
      const X = x - hw, r = Math.hypot(X, Y);
      if (z < 5 && r <= (z < 2 ? 5.2 : 3.8)) { m.setRaw(x, y, z, mat('reef'), PART_ID.dummyBase); continue; }
      if ((z === 8 || z === 22) && r <= 2.45) { m.setRaw(x, y, z, mat('weed'), PART_ID.dummyBand); continue; }
      if (z >= 5 && z <= 27 && r <= 2.05) { m.setRaw(x, y, z, mat('wood'), PART_ID.dummyPost); continue; }
      if (z === 28 && r <= 1.6) { m.setRaw(x, y, z, mat('reef'), PART_ID.dummyBand); continue; }
    }
  }
  m.fillAABB(-5.6, 5.6, -4.4, -1.6, 13, 25, (x, y, z, X, Y) => {
    const rd = Math.hypot(X, z - 19);
    if (rd <= 5.2 && Y >= -4.0 && Y <= -1.8) {
      if (Y <= -3.0) {
        const col = rd <= 1.6 ? KEY_TO_ID.targetRed : (rd <= 3.3 ? KEY_TO_ID.targetCream : KEY_TO_ID.targetRed);
        m.setRaw(x, y, z, col, PART_ID.dummyBoard);
      } else m.setRaw(x, y, z, mat('wood'), PART_ID.dummyBoard);
    }
  });
  m.despeckle(); m.applyArtShading(false);
  return m;
}

function buildTidalPlatform(makeCanvas, size = 200) {
  const base = makeCanvas(size, size);
  const bg = base.getContext('2d');
  const bim = bg.createImageData(size, size);
  const half = size * 0.5, rOuter = size * 0.478, rInner = size * 0.425;
  const shells = [[-34,-22],[38,-16],[-44,18],[46,26],[-22,56],[28,52],[14,-46],[-52,-4],[54,-2]];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = x - half, dy = y - half, dist = Math.hypot(dx, dy);
    if (dist > rOuter) continue;
    const i = (y * size + x) * 4;
    let key;
    if (dist > rInner) {
      const ang = Math.atan2(dy, dx), segF = ((ang + Math.PI) / (Math.PI * 2)) * 26;
      const seam = Math.abs(segF - Math.round(segF)) < 0.09;
      key = (seam || dist > rOuter - 2.2 || dist < rInner + 1.8) ? 'reefDark' : ((Math.floor(segF) & 1) ? 'reefMid' : 'reefHi');
    } else {
      const n1 = periodicNoise2(x, y, 64, 64, 16, 31), n2 = periodicNoise2(x + 11, y + 7, 32, 32, 8, 73);
      const v = n1 * 0.68 + n2 * 0.32;
      const pDist = Math.min(
        Math.hypot((dx + 28) / 26, (dy - 14) / 18),
        Math.hypot((dx - 30) / 24, (dy + 20) / 16),
        Math.hypot((dx - 6) / 20,  (dy - 26) / 12)
      ) + (n2 - 0.5) * 0.24;
      key = pDist < 0.88 ? (pDist < 0.45 ? 'puddleDark' : (pDist > 0.76 ? 'puddleHi' : 'puddleMid'))
        : (pDist < 1.04 ? 'sandDark' : (v > 0.64 ? 'sandHi' : (v < 0.36 ? 'sandDark' : 'sandMid')));
    }
    const rgba = ID_TO_RGBA[KEY_TO_ID[key]];
    bim.data[i] = rgba[0]; bim.data[i + 1] = rgba[1]; bim.data[i + 2] = rgba[2]; bim.data[i + 3] = 255;
  }
  for (const [sx, sy] of shells) {
    const cx = Math.round(half + sx), cy = Math.round(half + sy);
    for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
      if (Math.abs(ox) + Math.abs(oy) > 2) continue;
      const px = cx + ox, py = cy + oy;
      if (px < 0 || py < 0 || px >= size || py >= size) continue;
      const rgba = ID_TO_RGBA[KEY_TO_ID[(ox === 0 && oy === -1) ? 'shellHi' : (oy > 0 ? 'shellDark' : 'shellMid')]];
      const idx = (py * size + px) * 4;
      bim.data[idx] = rgba[0]; bim.data[idx + 1] = rgba[1]; bim.data[idx + 2] = rgba[2]; bim.data[idx + 3] = 255;
    }
  }
  bg.putImageData(bim, 0, 0);
  return { size, base, rInner, rOuter };
}

    spriteCache.set(key, entry);

  function fit() {

    SCALE = Math.max(2, Math.round(logicalScale * DPR));

    const mode = MODES[modeIdx];
    if (mode === 'retro') { CW = Math.ceil(cv.width / SCALE); CH = Math.ceil(cv.height / SCALE); }
    else { CW = cv.width; CH = cv.height; }
    if (mode === 'cached') { mc.width = oc.width = 1; mc.height = oc.height = 1; }

        // =========================================================================

          tgtY = lerp(hopFrom.y, hopTo.y, smoothstep(0, 1, p));

        } else if (t < 0.68) {

  function buildMurlocPartList() {
    const list = [];
    const yw = rig.yaw, hYaw = yw + rig.headYaw, cz = rig.crouchZ;

    // 1. 双腿 + 宽大蹼足
    const sSin = Math.sin(rig.stepPhase);
    const lY = sSin * rig.stepAmp, rY = -sSin * rig.stepAmp;
    const lZ = Math.max(0, sSin) * (0.6 + rig.stepAmp * 0.45), rZ = Math.max(0, -sSin) * (0.6 + rig.stepAmp * 0.45);
    const [lx, ly] = localToWorldXY(rig.x, rig.y, yw, -4.8, lY);
    const [rx, ry] = localToWorldXY(rig.x, rig.y, yw,  4.8, rY);
    list.push({ id: 'legL', m: parts.legL, x: lx, y: ly, lift: lZ, ro: yw, bias: -0.25 });
    list.push({ id: 'legR', m: parts.legR, x: rx, y: ry, lift: rZ, ro: yw, bias: -0.25 });

    // 2. 壮实躯干 + 锯齿脊背鳍
    list.push({ id: 'torso', m: parts.torso, x: rig.x, y: rig.y, lift: 7.4 + cz, ro: yw, bias: 0.1 });

    // 3. 粗短两栖尾（尾根枢轴严格锁死躯干后臀 (0, -6.2)！）
    const [tRootX, tRootY] = localToWorldXY(rig.x, rig.y, yw, 0, -6.2);
    const tYaw = yw + rig.tailWag;
    const [tWx, tWy] = localToWorldXY(tRootX, tRootY, tYaw, 0, -MURLOC_TAIL_PIVOT_Y);
    list.push({ id: 'tail', m: parts.tail, x: tWx, y: tWy, lift: 6.4 + cz, ro: tYaw, bias: -0.35 });

    // 4. 扁圆蛙鱼头（常规 / 鼓腮双态）
    const [hx, hy] = localToWorldXY(rig.x, rig.y, yw, 0, 2.2);
    const hId = rig.puffHead ? 'headPuff' : 'head';
    list.push({ id: hId, m: parts[hId], x: hx, y: hy, lift: 16.0 + cz, ro: hYaw, bias: 0.4 });

    // 5. 左臂 + 扇形贝壳小盾
    const [lShX, lShY] = localToWorldXY(rig.x, rig.y, yw, -5.6, -0.4);
    const lArmY = yw + rig.armLYaw;
    list.push({ id: 'armL', m: parts.armL, x: lShX, y: lShY, lift: 11.4 + cz + rig.armLZ, ro: lArmY, bias: 0.2 });
    const [sHdX, sHdY] = localToWorldXY(lShX, lShY, lArmY, -5.0, 5.4);
    list.push({ id: 'shield', m: parts.shield, x: sHdX, y: sHdY, lift: 8.6 + cz + rig.armLZ, ro: lArmY, bias: 0.35 });

    // 6. 右臂 + 锁枢轴海兽骨叉（投掷脱手态隐藏）
    const [rShX, rShY] = localToWorldXY(rig.x, rig.y, yw, 5.6, -0.4);
    const rArmY = yw + rig.armRYaw;
    list.push({ id: 'armR', m: parts.armR, x: rShX, y: rShY, lift: 11.4 + cz + rig.armRZ, ro: rArmY, bias: 0.2 });

    if (rig.tridentMode !== 'empty') {
      const [rHdX, rHdY] = localToWorldXY(rShX, rShY, rArmY, 5.0, 3.6);
      const trId = rig.tridentMode === 'thrust' ? 'tridentThrust' : (rig.tridentMode === 'slam' ? 'tridentSlam' : 'tridentHold');
      const trYaw = rArmY + rig.tridentYaw;
      const [trWx, trWy] = localToWorldXY(rHdX, rHdY, trYaw, 0, MURLOC_TRIDENT_PIVOT_Y);
      const trLift = rig.tridentMode === 'thrust' ? (10.5 + cz + rig.armRZ) : (1.5 + cz + rig.armRZ);
      list.push({ id: trId, m: parts[trId], x: trWx, y: trWy, lift: trLift, ro: trYaw, bias: 0.38 });
    }
    return list;
  }

  function composeMurlocActor(partList, c, s, outlineHex) {
    arCtx.setTransform(1, 0, 0, 1, 0, 0); arCtx.globalCompositeOperation = 'source-over';
    arCtx.globalAlpha = 1; arCtx.imageSmoothingEnabled = false; arCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    agCtx.setTransform(1, 0, 0, 1, 0, 0); agCtx.globalCompositeOperation = 'source-over';
    agCtx.globalAlpha = 1; agCtx.imageSmoothingEnabled = false; agCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

    let calls = 0, hasAnyGlow = false;
    for (let i = 0; i < partList.length; i++) {
      const p = partList[i], dxW = p.x - rig.x, dyW = p.y - rig.y;
      const rx = c * dxW - s * dyW, ry = s * dxW + c * dyW;
      p._lx = ACTOR_AX + rx * BAKE_SCALE;
      p._ly = ACTOR_AY + ry * TILT * BAKE_SCALE - p.lift * BAKE_STEP;

    for (let i = 0; i < partList.length; i++) {
      const p = partList[i];

      const dx = Math.round(p._lx - sp.anchorX), dy = Math.round(p._ly - sp.anchorY);
      arCtx.drawImage(sp.main, dx, dy); calls++;
      if (hasAnyGlow) { agCtx.globalCompositeOperation = 'destination-out'; agCtx.drawImage(sp.main, dx, dy); }
      if (sp.glow) { hasAnyGlow = true; agCtx.globalCompositeOperation = 'source-over'; agCtx.drawImage(sp.glow, dx, dy); calls++; }
    }
    agCtx.globalCompositeOperation = 'source-over';
    if (!useOutline) return { main: actorRaw, glow: hasAnyGlow ? actorGlow : null, calls };

    asCtx.setTransform(1, 0, 0, 1, 0, 0); asCtx.globalCompositeOperation = 'source-over'; asCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    asCtx.drawImage(actorRaw, 0, 0);
    asCtx.globalCompositeOperation = 'source-in'; asCtx.fillStyle = outlineHex; asCtx.fillRect(0, 0, ACTOR_W, ACTOR_H);

    aoCtx.setTransform(1, 0, 0, 1, 0, 0); aoCtx.globalCompositeOperation = 'source-over'; aoCtx.imageSmoothingEnabled = false;
    aoCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    aoCtx.drawImage(actorSil, -1, 0); aoCtx.drawImage(actorSil, 1, 0); aoCtx.drawImage(actorSil, 0, -1); aoCtx.drawImage(actorSil, 0, 1);
    aoCtx.drawImage(actorRaw, 0, 0);
    return { main: actorOut, glow: hasAnyGlow ? actorGlow : null, calls: calls + 5 };
  }

  function updateVFX(dt) {
    const fx = curSkin.fx;
    if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) document.getElementById('banner').classList.remove('show'); }
    shakeMag = Math.max(0, shakeMag - dt * 18);
    shakeX = shakeMag ? (Math.random() - 0.5) * shakeMag * SCALE * 0.62 : 0;
    shakeY = shakeMag ? (Math.random() - 0.5) * shakeMag * SCALE * 0.62 : 0;
    dummyHit = Math.max(0, dummyHit - dt * 3.0);
    dummyRecoilY = Math.max(0, dummyRecoilY - dt * 14.0);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.vz -= p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.z < 0.6) { p.z = 0.6; p.vz = Math.abs(p.vz) * p.bounce; p.vx *= 0.74; p.vy *= 0.74; }
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i]; pr.t += dt;
      const u = clamp(pr.t / pr.dur, 0, 1);
      pr.x = lerp(pr.sx, pr.tx, u); pr.y = lerp(pr.sy, pr.ty, u); pr.z = lerp(pr.sz, pr.tz, u) + Math.sin(u * Math.PI) * 3.2;
      if (Math.random() < 0.85) spawnParticle(pr.x, pr.y, pr.z, (Math.random() - 0.5) * 6, -6, 2, 0.20, 1.7, fx.hot, true, 16);
      if (u >= 1) {
        projectiles.splice(i, 1); shakeMag = Math.max(shakeMag, 2.4); hitDummy(0.75, false);
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * TAU;
          spawnParticle(pr.tx, pr.ty, pr.tz, Math.cos(a) * 18, Math.sin(a) * 10 - 8, 10 + Math.random() * 10, 0.34, 1.9, k & 1 ? fx.core : fx.mid, true, 52);
        }
      }
    }
    for (let i = slashStreaks.length - 1; i >= 0; i--) { slashStreaks[i].t += dt; if (slashStreaks[i].t >= slashStreaks[i].life) slashStreaks.splice(i, 1); }
    for (let i = waveFans.length - 1; i >= 0; i--) { waveFans[i].t += dt; if (waveFans[i].t >= waveFans[i].life) waveFans.splice(i, 1); }
    for (let i = groundDecals.length - 1; i >= 0; i--) { groundDecals[i].t += dt; if (groundDecals[i].t >= groundDecals[i].life) groundDecals.splice(i, 1); }
    for (let i = splashArcs.length - 1; i >= 0; i--) { splashArcs[i].t += dt; if (splashArcs[i].t >= splashArcs[i].life) splashArcs.splice(i, 1); }
  }

  function drawStackRealtime(asset, x, y, zLift, ro, sc) {
    const [X, Y] = proj(x, y, zLift, sc);
    const a = ro + th, c = Math.cos(a), s = Math.sin(a), X0 = Math.round(X), Y0 = Math.round(Y);
    const isRetro = MODES[modeIdx] === 'retro', step = isRetro ? HS : Math.max(1, Math.round(HS * sc));
    const halfStep = (!isRetro && step > Math.floor(TILT * sc)) ? Math.max(1, Math.round(step * 0.5)) : 0;
    const { w, d, activeLayers, glowLayers, glowSlot, glowStrip, strip } = asset;
    const hasGlow = !!glowStrip && glowLayers.length > 0, minGlowZ = hasGlow ? glowLayers[0] : 9999;
    const eScaleX = EW / CW, eScaleY = EH / CH;
    let calls = 0;
    for (let li = 0; li < activeLayers.length; li++) {
      const z = activeLayers[li], yy = isRetro ? (Y0 - z * HS) : (Y0 - z * step), sx = z * w;
      if (halfStep) { mctx.setTransform(c * sc, TILT * s * sc, -s * sc, TILT * c * sc, X0, yy + halfStep); mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d); calls++; }
      mctx.setTransform(c * sc, TILT * s * sc, -s * sc, TILT * c * sc, X0, yy); mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d); calls++;
      if (!hasGlow || z >= minGlowZ) {
        ectx.globalCompositeOperation = 'destination-out';
        ectx.setTransform(c * sc * eScaleX, TILT * s * sc * eScaleY, -s * sc * eScaleX, TILT * c * sc * eScaleY, X0 * eScaleX, yy * eScaleY);
        ectx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      }
      if (hasGlow && glowSlot[z] >= 0) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(glowStrip, glowSlot[z] * w, 0, w, d, -w / 2, -d / 2, w, d); calls++; }
    }
    ectx.globalCompositeOperation = 'source-over';
    return calls;
  }

  let last = 0, fpsAcc = 0, fpsFrames = 0, fpsVal = 60, statTimer = 0, cpuMsSmooth = 1.0;

  function tick(ms) {
    const tCpu0 = performance.now();
    const t = ms / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
    animTime += dt; fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.4) { fpsVal = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
    if (autoSpin && !drag) thTarget += dt * 0.55;
    if (!drag) th += (thTarget - th) * Math.min(1, dt * 8);

    updateMurlocRig(dt);
    updateVFX(dt);

    const mode = MODES[modeIdx], sc = mode === 'retro' ? 1 : SCALE;
    const c = Math.cos(th), s = Math.sin(th), eScale = EW / cv.width, fx = curSkin.fx;
    let drawCalls = 0;

    const murlocParts = buildMurlocPartList();
    const dummyShakeX = dummyHit > 0 ? Math.sin(animTime * 58) * dummyHit * 2.1 : 0;
    const dummyObj = { id: 'dummy', m: dummyAsset, x: DUMMY_POS.x + dummyShakeX, y: DUMMY_POS.y + dummyRecoilY, lift: 0, ro: 0 };

    const bSize = platform.size, halfB = bSize * 0.5;
    gbctx.setTransform(GROUND_SUPERSAMPLE, 0, 0, GROUND_SUPERSAMPLE, 0, 0);
    gbctx.globalCompositeOperation = 'source-over'; gbctx.imageSmoothingEnabled = false;
    gbctx.clearRect(0, 0, bSize, bSize); gbctx.drawImage(platform.base, 0, 0);

    gbctx.save(); gbctx.translate(halfB, halfB);
    gbctx.beginPath(); gbctx.arc(0, 0, platform.rInner, 0, TAU); gbctx.clip();

    gbctx.strokeStyle = 'rgba(200, 245, 255, 0.22)'; gbctx.lineWidth = 1;
    gbctx.beginPath(); gbctx.arc(-28, 14, 4 + ((animTime * 5.5) % 10), 0, TAU); gbctx.stroke();
    gbctx.beginPath(); gbctx.arc(30, -20, 3 + ((animTime * 4.5 + 4) % 9), 0, TAU); gbctx.stroke();

    for (const dc of groundDecals) {
      const fade = clamp(1 - dc.t / dc.life, 0, 1);
      gbctx.save(); gbctx.translate(dc.x, dc.y);
      if (dc.type === 'wetSpot') {
        gbctx.globalAlpha = fade * 0.58; gbctx.fillStyle = fx.puddle;
        gbctx.beginPath(); gbctx.ellipse(0, 0, dc.r, dc.r * 0.72, 0, 0, TAU); gbctx.fill();
        gbctx.globalAlpha = fade * 0.35; gbctx.strokeStyle = fx.foam; gbctx.lineWidth = 1.2;
        gbctx.beginPath(); gbctx.ellipse(0, 0, dc.r * 0.75, dc.r * 0.52, 0, 0, TAU); gbctx.stroke();
      } else if (dc.type === 'waveFan') {
        gbctx.globalAlpha = fade * 0.48; gbctx.fillStyle = fx.puddle;
        gbctx.beginPath(); gbctx.moveTo(0, 0); gbctx.arc(0, 0, dc.r, Math.PI * 0.24, Math.PI * 0.76); gbctx.closePath(); gbctx.fill();
        gbctx.globalAlpha = fade * 0.45; gbctx.strokeStyle = fx.foam; gbctx.lineWidth = 2;
        gbctx.beginPath(); gbctx.arc(0, 0, dc.r * 0.92, Math.PI * 0.26, Math.PI * 0.74); gbctx.stroke();
      }
      gbctx.restore();
    }

    const lf = clamp(1 - rig.lift / 48, 0.28, 1.0);
    gbctx.fillStyle = `rgba(6, 12, 16, ${0.48 * lf})`;
    gbctx.beginPath(); gbctx.arc(rig.x + rig.lift * 0.14, rig.y - rig.lift * 0.14, 10.5 * (0.68 + 0.32 * lf), 0, TAU); gbctx.fill();

    gbctx.save(); gbctx.translate(dummyObj.x, dummyObj.y);
    gbctx.save(); gbctx.globalAlpha = 0.34; gbctx.translate(2.5, -2.5);
    gbctx.drawImage(dummyAsset.footShadow, -dummyAsset.w / 2, -dummyAsset.d / 2); gbctx.restore();
    gbctx.fillStyle = 'rgba(6, 12, 16, 0.48)';
    gbctx.beginPath(); gbctx.arc(0, 0, dummyAsset.meta.footRadius, 0, TAU); gbctx.fill();
    gbctx.restore(); gbctx.restore();

    ectx.setTransform(1, 0, 0, 1, 0, 0); ectx.globalCompositeOperation = 'source-over';
    ectx.imageSmoothingEnabled = false; ectx.clearRect(0, 0, EW, EH);
    dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = 'source-over';
    dctx.imageSmoothingEnabled = false; dctx.drawImage(bgc, 0, 0); drawCalls++;

    dctx.setTransform(c * SCALE, TILT * s * SCALE, -s * SCALE, TILT * c * SCALE, cv.width / 2 + shakeX, cv.height / 2 + 18 * SCALE + shakeY);
    dctx.drawImage(gbuf, -halfB, -halfB, bSize, bSize);
    dctx.setTransform(1, 0, 0, 1, 0, 0); drawCalls++;

    if (mode === 'cached') {
      const dispRatio = SCALE / BAKE_SCALE;
      const composed = composeMurlocActor(murlocParts, c, s, curSkin.outline);
      drawCalls += composed.calls;
      const [sx, sy, sry] = proj(rig.x, rig.y, rig.lift, SCALE);
      const [dxP, dyP, dry] = proj(dummyObj.x, dummyObj.y, 0, SCALE);
      const dummySp = getBakedSprite(dummyAsset, 'dummy', th, curSkin.outline, useOutline, 360);

      const drawOrder = [
        { kind: 'murloc', ry: sry },
        { kind: 'dummy', ry: dry }
      ];
      if (rig.thrownTrident) {
        const tr = rig.thrownTrident;
        const [txP, tyP, tryP] = proj(tr.x + dummyShakeX * 0.5, tr.y + dummyRecoilY * 0.6, tr.z - 5.5, SCALE);
        drawOrder.push({ kind: 'trident', ry: tryP, x: txP, y: tyP, ro: tr.ro });
      }
      drawOrder.sort((a, b) => a.ry - b.ry);
      ectx.setTransform(1, 0, 0, 1, 0, 0);

      for (const item of drawOrder) {
        if (item.kind === 'murloc') {
          const dw = Math.round(ACTOR_W * dispRatio), dh = Math.round(ACTOR_H * dispRatio);
          const dx = Math.round(sx - ACTOR_AX * dispRatio), dy = Math.round(sy - ACTOR_AY * dispRatio);
          dctx.drawImage(composed.main, dx, dy, dw, dh); drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(composed.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
          if (composed.glow) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(composed.glow, dx * eScale, dy * eScale, dw * eScale, dh * eScale); drawCalls++; }
        } else if (item.kind === 'dummy') {
          const dw = Math.round(dummySp.bw * dispRatio), dh = Math.round(dummySp.bh * dispRatio);
          const dx = Math.round(dxP - dummySp.anchorX * dispRatio), dy = Math.round(dyP - dummySp.anchorY * dispRatio);
          dctx.drawImage(dummySp.main, dx, dy, dw, dh); drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(dummySp.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
        } else {
          const trSp = getBakedSprite(parts.tridentThrust, 'tridentThrust', item.ro + th, curSkin.outline, useOutline, 360);
          const dw = Math.round(trSp.bw * dispRatio), dh = Math.round(trSp.bh * dispRatio);
          const dx = Math.round(item.x - trSp.anchorX * dispRatio), dy = Math.round(item.y - trSp.anchorY * dispRatio);
          dctx.drawImage(trSp.main, dx, dy, dw, dh); drawCalls++;
          if (trSp.glow) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(trSp.glow, dx * eScale, dy * eScale, dw * eScale, dh * eScale); drawCalls++; }
        }
      }
      ectx.globalCompositeOperation = 'source-over';
    } else {
      mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'source-over';
      mctx.imageSmoothingEnabled = false; mctx.clearRect(0, 0, CW, CH);
      const allObjs = [...murlocParts.map(p => ({ ...p, lift: rig.lift + p.lift })), dummyObj];
      if (rig.thrownTrident) allObjs.push({ id: 'tridentThrust', m: parts.tridentThrust, x: rig.thrownTrident.x, y: rig.thrownTrident.y, lift: rig.thrownTrident.z - 5.5, ro: rig.thrownTrident.ro });
      for (const o of allObjs) o._depth = proj(o.x, o.y, o.lift, sc)[2] + o.lift * 0.08 + (o.bias || 0);
      allObjs.sort((a, b) => a._depth - b._depth);
      for (const o of allObjs) drawCalls += drawStackRealtime(o.m, o.x, o.y, o.lift, o.ro, sc);
      const drawW = mode === 'retro' ? CW * SCALE : CW, drawH = mode === 'retro' ? CH * SCALE : CH;
      if (useOutline) {
        octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.clearRect(0, 0, CW, CH);
        octx.drawImage(mc, 0, 0); octx.globalCompositeOperation = 'source-in'; octx.fillStyle = curSkin.outline; octx.fillRect(0, 0, CW, CH);
        octx.globalCompositeOperation = 'source-over';
        const op = mode === 'retro' ? SCALE : Math.max(1, Math.round(SCALE * 0.30));
        for (const [ox, oy] of [[-op, 0], [op, 0], [0, -op], [0, op]]) dctx.drawImage(oc, ox, oy, drawW, drawH);
      }
      dctx.drawImage(mc, 0, 0, drawW, drawH);
    }

    // 前景破水白沫弧（绘制在角色前方，落地踩水层次立体感拉满！）
    for (const sa of splashArcs) {
      const u = clamp(sa.t / sa.life, 0, 1);
      const [px, py] = proj(sa.x, sa.y, 0.5, mode === 'retro' ? 1 : SCALE);
      const cx = Math.round(px * (mode === 'retro' ? SCALE : 1)), cy = Math.round(py * (mode === 'retro' ? SCALE : 1));
      const rx = lerp(4, sa.rMax, smoothstep(0, 1, u)) * SCALE, ry = rx * TILT;
      dctx.save(); dctx.globalAlpha = (1 - u) * 0.85; dctx.strokeStyle = fx.foam; dctx.lineWidth = Math.max(2, Math.round(SCALE * 0.55));
      dctx.beginPath(); dctx.ellipse(cx, cy, rx, ry, 0, 0.15, Math.PI - 0.15); dctx.stroke();
      dctx.restore(); drawCalls++;
    }

    const pSc = mode === 'retro' ? 1 : SCALE, toMain = mode === 'retro' ? SCALE : 1, toE = toMain * eScale;
    function drawVoxelBlock(wx, wy, wz, szVox, color, isGlow) {
      const [px, py] = proj(wx, wy, wz, pSc);
      const sx = Math.round(px * toMain), sy = Math.round(py * toMain), sPx = Math.max(2, Math.round(szVox * SCALE));
      dctx.fillStyle = color; dctx.fillRect(sx - (sPx >> 1), sy - (sPx >> 1), sPx, sPx);
      if (isGlow) {
        const es = Math.max(1, Math.round(sPx * eScale));
        ectx.fillStyle = color; ectx.fillRect(Math.round(px * toE) - (es >> 1), Math.round(py * toE) - (es >> 1), es, es);
      }
    }

    for (const sl of slashStreaks) {
      const u = sl.t / sl.life, fade = 1 - u;
      for (let i = 0; i < 12; i++) {
        const f = i / 11, dist = f * sl.len * (0.45 + 0.55 * Math.min(1, u * 3));
        drawVoxelBlock(sl.x + Math.sin(sl.yaw) * dist, sl.y + Math.cos(sl.yaw) * dist, sl.z + (f - 0.5) * 2.0, (1.1 + (1 - Math.abs(f - 0.65)) * 1.9) * fade, f > 0.7 ? fx.core : (f > 0.35 ? fx.hot : fx.mid), true);
      }
    }
    if (rig.recallRibbon) {
      const rb = rig.recallRibbon;
      for (let i = 0; i < 16; i++) {
        const f = clamp(rb.p - i * 0.045, 0, 1);
        drawVoxelBlock(lerp(rb.x0, rb.x1, f) + Math.sin(f * Math.PI * 3 + animTime * 20) * 1.6, lerp(rb.y0, rb.y1, f), lerp(rb.z0, rb.z1, f) + Math.sin(f * Math.PI) * 5.2, Math.max(1.1, 2.8 - i * 0.14), i < 4 ? fx.core : (i < 10 ? fx.hot : fx.mid), true);
      }
    }
    for (const wf of waveFans) {
      const u = clamp(wf.t / wf.life, 0, 1), rad = lerp(wf.r0, wf.r1, smoothstep(0, 1, u)), crestH = Math.sin(u * Math.PI) * 11.5 + 3.0;
      for (let i = 0; i <= 16; i++) {
        const a = lerp(-Math.PI * 0.25, Math.PI * 0.25, i / 16), wx = wf.x + Math.sin(a) * rad, wy = wf.y + Math.cos(a) * rad;
        const h = crestH * (1 - Math.abs((i / 16) - 0.5) * 0.55);
        drawVoxelBlock(wx, wy, h * 0.35, 3.4 * (1 - u * 0.3), fx.outer, false);
        drawVoxelBlock(wx, wy, h * 0.72, 2.9 * (1 - u * 0.25), fx.mid, true);
        drawVoxelBlock(wx, wy + 1.0, h, 2.3 * (1 - u * 0.2), fx.core, true);
      }
    }
    for (const pr of projectiles) {
      drawVoxelBlock(pr.x, pr.y, pr.z, 3.6, fx.outer, false);
      drawVoxelBlock(pr.x, pr.y + 0.5, pr.z + 0.4, 2.7, fx.mid, true);
      drawVoxelBlock(pr.x, pr.y + 0.8, pr.z + 0.9, 1.6, fx.core, true);
    }
    for (const p of particles) drawVoxelBlock(p.x, p.y, p.z, p.sz * (1 - (p.t / p.life) * 0.55), p.color, p.glow);
    for (const ab of ambientBubbles) drawVoxelBlock(ab.x + Math.sin(animTime * 1.4 + ab.ph) * 4, ab.y + Math.cos(animTime * 1.2 + ab.ph) * 4, ((ab.z + animTime * ab.sp) % 34) + 2, 1.0, fx.hot, true);

    ebctx.setTransform(1, 0, 0, 1, 0, 0); ebctx.clearRect(0, 0, EW, EH);
    ebctx.filter = `blur(${Math.max(1, Math.round(SCALE * 0.14))}px)`; ebctx.drawImage(ec, 0, 0); ebctx.filter = 'none';
    dctx.globalCompositeOperation = 'screen';
    dctx.imageSmoothingEnabled = true; dctx.globalAlpha = 0.68; dctx.drawImage(eb, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = 0.52; dctx.imageSmoothingEnabled = false; dctx.drawImage(ec, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = 1; dctx.globalCompositeOperation = 'source-over'; drawCalls += 2;

    const cpuMs = performance.now() - tCpu0;
    cpuMsSmooth = cpuMsSmooth * 0.88 + cpuMs * 0.12;
    statTimer += dt;
    if (statTimer >= 0.25) {
      statTimer = 0;
      const hitRate = (cacheHits + cacheMisses) ? Math.round(cacheHits * 100 / (cacheHits + cacheMisses)) : 100;
      $('stats').innerHTML =
        `<span>建模 <b>${buildMs}ms</b></span>` +
        (skinMs > 0 ? `<span>换色 <b>${skinMs}ms</b></span>` : '') +
        `<span>帧率 <b>${fpsVal}fps</b></span>` +
        `<span>单帧 <b>${cpuMsSmooth.toFixed(1)}ms</b></span>` +
        `<span>绘制 <b>${drawCalls}次</b></span>` +
        `<span>色表 <b>${PAL_KEYS.length}色</b></span>` +
        (mode === 'cached' ? `<span>缓存 <b>${spriteCache.size}</b> (${hitRate}%)</span>` : '');
    }
    requestAnimationFrame(tick);
  }

  const $ = id => document.getElementById(id);
  function buildBars() {
    const sb = $('skinBar'); sb.innerHTML = '';
    SKINS.forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="swatch" style="background:${sk.dot}"></span>${sk.name}`;
      btn.onclick = () => applySkin(idx, true); sb.appendChild(btn);
    });
    const kb = $('skillBar'); kb.innerHTML = '';
    SKILLS.forEach((sk, idx) => {
      const btn = document.createElement('button'); btn.className = 'skill-btn';
      btn.textContent = `${idx + 1}. ${sk.name}`; btn.onclick = () => startSkill(idx); kb.appendChild(btn);
    });
  }
  function syncUI() {
    $('skinBadge').textContent = curSkin.name;
    $('skinBar').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === skinIdx));
    $('skillBar').querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', !!(activeAction && activeAction.id === SKILLS[i].id)));
    $('btnCrouch').classList.toggle('on', !activeAction && baseMode === 'crouch');
    $('btnHop').classList.toggle('on', !activeAction && baseMode === 'hop');
    $('btnSpin').classList.toggle('on', autoSpin);
    $('btnOutline').classList.toggle('on', useOutline);
    $('btnMode').textContent = '模式：' + MODE_LABEL[MODES[modeIdx]];
    $('btnMode').classList.toggle('on', MODES[modeIdx] === 'cached');
  }

  $('btnCrouch').onclick = () => { activeAction = null; baseMode = 'crouch'; syncUI(); showBanner('滩涂生态 · 鼓腮警戒', 1.1); };
  $('btnHop').onclick    = () => { activeAction = null; baseMode = 'hop'; hopTimer = 0; hopFrom = { x: rig.x, y: rig.y }; hopTo = HOP_RING[hopIdx]; hopLanded = false; syncUI(); showBanner('滩涂生态 · 蛙跳巡滩', 1.2); };
  $('btnSpin').onclick = () => { autoSpin = !autoSpin; syncUI(); };
  $('btnOutline').onclick = () => { useOutline = !useOutline; syncUI(); };
  $('btnMode').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; fit(); syncUI(); };
  $('btnReset').onclick = () => {
    thTarget = 0.62;
    th = thTarget + (((th - thTarget + Math.PI) % TAU + TAU) % TAU - Math.PI);
    zoom = 0; autoSpin = false; baseMode = 'crouch'; activeAction = null; fit(); syncUI();
  };
  $('btnExport').onclick = () => {
    const asset = parts.head;
    const a = document.createElement('a');
    a.download = `murloc_${curSkin.id}_head_${asset.w}x${asset.d}x${asset.h}.png`;
    a.href = asset.strip.toDataURL('image/png'); a.click();
  };

  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, th }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (drag) { th = thTarget = drag.th + (e.clientX - drag.x) * 0.01; } });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => { zoom = clamp(zoom + (e.deltaY > 0 ? -1 : 1), -2, 5); fit(); e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'q' || e.key === 'Q') thTarget -= Math.PI / 4;
    if (e.key === 'e' || e.key === 'E') thTarget += Math.PI / 4;
    if (e.key === 'c' || e.key === 'C') applySkin(skinIdx + 1, true);
    if (e.key === 's' || e.key === 'S') {
      activeAction = null; baseMode = baseMode === 'hop' ? 'crouch' : 'hop';
      if (baseMode === 'hop') { hopTimer = 0; hopFrom = { x: rig.x, y: rig.y }; hopTo = HOP_RING[hopIdx]; hopLanded = false; }
      syncUI(); showBanner(baseMode === 'hop' ? '滩涂生态 · 蛙跳巡滩' : '滩涂生态 · 鼓腮警戒', 1.2);
    }
    if (e.key >= '1' && e.key <= '4') startSkill(Number(e.key) - 1);
  });
  window.addEventListener('resize', fit);

  window.__MURLOC_DEBUG__ = {
    getStats: () => ({
      buildMs: Number(buildMs), skinMs, skin: curSkin.id, baseMode,
      fps: fpsVal, cpuMs: Number(cpuMsSmooth.toFixed(2)),
      cacheSize: spriteCache.size, cacheHits, cacheMisses,
      th, zoom, mode: MODES[modeIdx], paletteCount: PAL_KEYS.length,
      activeAction: activeAction ? activeAction.id : null
    }),
    setAngle: a => { th = thTarget = a; },
    setSkin: idOrIdx => { const idx = typeof idOrIdx === 'number' ? idOrIdx : SKINS.findIndex(s => s.id === idOrIdx); if (idx >= 0) applySkin(idx, false); },
    setBaseMode: m => { activeAction = null; baseMode = m; syncUI(); },
    cycleSkin: () => applySkin(skinIdx + 1, true),
    triggerSkill: i => startSkill(i),
    setAutoSpin: v => { autoSpin = v; syncUI(); },
    setZoom: z => { zoom = clamp(z, -2, 5); fit(); }
  };

  buildBars(); fit(); syncUI(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
