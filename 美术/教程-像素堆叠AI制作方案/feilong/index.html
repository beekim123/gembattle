2. 【真实飞龙双生态 + 完整四段式变身演出 (T)】：

}

function buildRgbaTable(skin) {
  const tbl = ID_TO_RGBA.slice();
  if (skin && skin.pal) {
    for (const k in skin.pal) {
      const id = KEY_TO_ID[k];
      if (!id) continue;
      const n = parseInt(skin.pal[k].slice(1), 16);
      tbl[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
    }
  }
  return tbl;
}

function recolorAsset(asset, rgbaTable) {
  const { w, d, h, grid, activeLayers, glowLayers, glowSlot, strip, glowStrip, sim, eim } = asset;
  const stripW = w * h, glowW = w * glowLayers.length;
  const sData = sim.data, eData = eim ? eim.data : null;
  for (let li = 0; li < activeLayers.length; li++) {
    const z = activeLayers[li], gxOff = z * w, gSlot = glowSlot[z], zBase = z * d * w;
    for (let y = 0; y < d; y++) {
      const row = zBase + y * w, sRow = y * stripW + gxOff;
      const eRow = gSlot >= 0 ? (y * glowW + gSlot * w) : -1;
      for (let x = 0; x < w; x++) {
        const id = grid[row + x];
        if (!id) continue;
        const rgba = rgbaTable[id];
        const si = (sRow + x) * 4;
        sData[si] = rgba[0]; sData[si + 1] = rgba[1]; sData[si + 2] = rgba[2]; sData[si + 3] = 255;
        if (eData && eRow >= 0 && GLOW_ID_SET.has(id)) {
          const ei = (eRow + x) * 4;
          eData[ei] = rgba[0]; eData[ei + 1] = rgba[1]; eData[ei + 2] = rgba[2]; eData[ei + 3] = 255;
        }
      }
    }
  }
  strip.getContext('2d').putImageData(sim, 0, 0);
  if (glowStrip && eim) glowStrip.getContext('2d').putImageData(eim, 0, 0);
}

const PART_NAMES = [
  'none',
  'body', 'belly', 'neck', 'head', 'snout', 'jaw',

];
const PART_ID = Object.create(null);
for (let i = 0; i < PART_NAMES.length; i++) PART_ID[PART_NAMES[i]] = i;

const NUM_PARTS = PART_NAMES.length;
const NO_CREASE_LUT = new Uint8Array(NUM_PARTS * NUM_PARTS);
for (const [a, b] of [
  ['eye', 'head'], ['eye', 'snout'],
  ['mouthCore', 'jaw'], ['mouthCore', 'snout'],
  ['chestCore', 'body'], ['chestCore', 'belly'], ['chestCore', 'neck'],
  ['head', 'neck'], ['body', 'neck'], ['body', 'tail'], ['dummyPost', 'dummyIron']
]) {
  const ia = PART_ID[a], ib = PART_ID[b];
  NO_CREASE_LUT[ia * NUM_PARTS + ib] = 1;
  NO_CREASE_LUT[ib * NUM_PARTS + ia] = 1;
}

  [MAT_ID.horn]:  [KEY_TO_ID.hornDark,  KEY_TO_ID.hornMid,  KEY_TO_ID.hornHi],
  [MAT_ID.stone]: [KEY_TO_ID.stoneDark, KEY_TO_ID.stoneMid, KEY_TO_ID.stoneHi],
  [MAT_ID.wood]:  [KEY_TO_ID.woodDark,  KEY_TO_ID.woodMid,  KEY_TO_ID.woodHi],
  [MAT_ID.iron]:  [KEY_TO_ID.ironDark,  KEY_TO_ID.ironMid,  KEY_TO_ID.ironHi]
};

// ---------------------------------------------------------------------------
// 2. 数学原语与周期噪声
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const smin = (a, b, k) => {
  const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
  return lerp(b, a, h) - k * h * (1 - h);
};
function localToWorldXY(rx, ry, yaw, lx, ly) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  return [rx + cy * lx - sy * ly, ry + sy * lx + cy * ly];
}
function hash2i(ix, iy, seed) {
  let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function periodicNoise2(x, y, periodX, periodY, cell, seed) {
  const gx = x / cell, gy = y / cell;
  const px = Math.max(1, Math.round(periodX / cell));
  const py = Math.max(1, Math.round(periodY / cell));
  const ix = Math.floor(gx), iy = Math.floor(gy);
  const fx = gx - ix, fy = gy - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const wMod = (v, m) => ((v % m) + m) % m;
  const x0 = wMod(ix, px), x1 = wMod(ix + 1, px);
  const y0 = wMod(iy, py), y1 = wMod(iy + 1, py);
  return lerp(
    lerp(hash2i(x0, y0, seed), hash2i(x1, y0, seed), ux),
    lerp(hash2i(x0, y1, seed), hash2i(x1, y1, seed), ux),
    uy
  );
}

// ---------------------------------------------------------------------------
// 3. 高性能体素网格
// ---------------------------------------------------------------------------
class VoxelModel {
  constructor(w, d, h) {
    this.w = w; this.d = d; this.h = h;
    const len = w * d * h;
    this.grid = new Uint8Array(len);
    this.parts = new Uint8Array(len);
  }
  idx(x, y, z) { return (z * this.d + y) * this.w + x; }
  inB(x, y, z) { return x >= 0 && y >= 0 && z >= 0 && x < this.w && y < this.d && z < this.h; }
  getId(x, y, z) { return this.inB(x, y, z) ? this.grid[this.idx(x, y, z)] : 0; }
  getPartId(x, y, z) { return this.inB(x, y, z) ? this.parts[this.idx(x, y, z)] : 0; }
  setRaw(x, y, z, val, partId) {
    if (!this.inB(x, y, z)) return;
    const i = this.idx(x, y, z);
    this.grid[i] = val; this.parts[i] = partId;
  }
  fillAABB(X0, X1, Y0, Y1, Z0, Z1, fn) {
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(X0 + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(X1 + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Y0 + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Y1 + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Z0),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Z1),       0, this.h - 1);
    for (let z = z0; z <= z1; z++) {
      for (let y = y0; y <= y1; y++) {
        const Y = y - hd;
        for (let x = x0; x <= x1; x++) fn(x, y, z, x - hw, Y);
      }
    }
  }
  paintCapsule(ax, ay, az, bx, by, bz, r0, r1, val, partId, overwrite = true) {
    const pad = Math.max(r0, r1) + 0.6;
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(Math.min(ax, bx) - pad + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(Math.max(ax, bx) + pad + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Math.min(ay, by) - pad + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Math.max(ay, by) + pad + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Math.min(az, bz) - pad),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Math.max(az, bz) + pad),       0, this.h - 1);
    const abx = bx - ax, aby = by - ay, abz = bz - az;
    const invDen = 1 / (abx * abx + aby * aby + abz * abz || 1);
    const dr = r1 - r0;
    const { w, d, grid, parts } = this;
    for (let z = z0; z <= z1; z++) {
      const apz = z - az, zOff = z * d * w;
      for (let y = y0; y <= y1; y++) {
        const apy = (y - hd) - ay, row = zOff + y * w, dotYZ = apy * aby + apz * abz;
        for (let x = x0; x <= x1; x++) {
          const i = row + x;
          if (!overwrite && grid[i]) continue;
          const apx = (x - hw) - ax;
          let t = (apx * abx + dotYZ) * invDen;
          if (t < 0) t = 0; else if (t > 1) t = 1;
          const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
          const r = r0 + dr * t;
          if (dx * dx + dy * dy + dz * dz <= r * r) { grid[i] = val; parts[i] = partId; }
        }
      }
    }
  }
  paintEllipsoid(cx, cy, cz, rx, ry, rz, val, partId, overwrite = true) {
    this.fillAABB(cx - rx - 0.5, cx + rx + 0.5, cy - ry - 0.5, cy + ry + 0.5, cz - rz - 0.5, cz + rz + 0.5, (x, y, z, X, Y) => {
      const i = this.idx(x, y, z);
      if (!overwrite && this.grid[i]) return;
      const dx = (X - cx) / rx, dy = (Y - cy) / ry, dz = (z - cz) / rz;
      if (dx * dx + dy * dy + dz * dz <= 1.0) { this.grid[i] = val; this.parts[i] = partId; }
    });
  }
  paintWingQuad(p00, p10, p11, p01, halfThick, val, partId, scallop = 0, overwrite = false) {
    const pts = [p00, p10, p11, p01];
    let x0 = 999, x1 = -999, y0 = 999, y1 = -999, z0 = 999, z1 = -999;
    for (const p of pts) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
      if (p[2] < z0) z0 = p[2]; if (p[2] > z1) z1 = p[2];
    }
    const pad = halfThick + 1.0, ux = p10[0] - p00[0], uSign = ux >= 0 ? 1 : -1;
    const spanX = Math.max(0.5, Math.abs(ux));
    this.fillAABB(x0 - 0.6, x1 + 0.6, y0 - 0.8, y1 + 0.8, z0 - pad, z1 + pad, (x, y, z, X, Y) => {
      const i = this.idx(x, y, z);
      if (!overwrite && this.grid[i]) return;
      const u = clamp(uSign > 0 ? (X - p00[0]) / spanX : (p00[0] - X) / spanX, 0, 1);
      const ly = lerp(p00[1], p10[1], u), lz = lerp(p00[2], p10[2], u);
      const ty = lerp(p01[1], p11[1], u) + scallop * Math.sin(u * Math.PI), tz = lerp(p01[2], p11[2], u);
      if (Y < Math.min(ly, ty) - 0.35 || Y > Math.max(ly, ty) + 0.35) return;
      const v = clamp((ly - Y) / Math.max(0.5, ly - ty), 0, 1);
      if (Math.abs(z - lerp(lz, tz, v)) <= halfThick) { this.grid[i] = val; this.parts[i] = partId; }
    });
  }
  despeckle() {
    const src = this.grid.slice(), prt = this.parts;
    const { w, d, h } = this, wd = w * d;
    const pEye = PART_ID.eye, pMC = PART_ID.mouthCore, pCC = PART_ID.chestCore;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          if (!src[i]) continue;
          const p = prt[i];
          if (p === pEye || p === pMC || p === pCC) continue;
          if ((x + 1 < w && src[i + 1]) || (x > 0 && src[i - 1]) ||
              (y + 1 < d && src[i + w]) || (y > 0 && src[i - w]) ||
              (z + 1 < h && src[i + wd]) || (z > 0 && src[i - wd])) continue;
          this.grid[i] = 0; this.parts[i] = 0;
        }
      }
    }
  }
  applyArtShading(keepSoftBottom = false) {
    const { w, d, h } = this, wd = w * d;
    const src = this.grid.slice(), prt = this.parts;
    const pMinZ = new Int16Array(NUM_PARTS).fill(999);
    const pMaxZ = new Int16Array(NUM_PARTS).fill(-1);
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let i = zOff, end = zOff + wd; i < end; i++) {
        const p = prt[i];
        if (p) { if (z < pMinZ[p]) pMinZ[p] = z; if (z > pMaxZ[p]) pMaxZ[p] = z; }
      }
    }
    const headId = PART_ID.head;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd, hasUp = z + 1 < h, hasDn = z > 0;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x, v = src[i];
          if (v < MAT_BASE) continue;
          const ramp = RAMPS_BY_MAT[v - MAT_BASE];
          if (!ramp) continue;
          const myP = prt[i], lutOff = myP * NUM_PARTS;
          const topEmpty = !hasUp || !src[i + wd];
          const botEmpty = hasDn && !src[i - wd];
          let crease = false, np;
          if (x + 1 < w && (np = prt[i + 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (x > 0 && (np = prt[i - 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y + 1 < d && (np = prt[i + w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y > 0 && (np = prt[i - w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (hasDn && (np = prt[i - wd]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;

          let upperOcc = 0;
          if (hasUp && !topEmpty) {
            const up = i + wd;
            for (let oy = -1; oy <= 1; oy++) {
              const yy = y + oy;
              if (yy < 0 || yy >= d) continue;
              const uRow = up + oy * w;
              for (let ox = -1; ox <= 1; ox++) {
                const xx = x + ox;
                if (xx >= 0 && xx < w && src[uRow + ox]) upperOcc++;
              }
            }
          }
          const span = Math.max(1, pMaxZ[myP] - pMinZ[myP]);
          const localZ = (z - pMinZ[myP]) / span;
          let idx = 1;
          if (botEmpty || (!keepSoftBottom && z <= 1)) idx = 0;
          else if (crease && !topEmpty) idx = 0;
          else if (upperOcc >= 8 && localZ < 0.45) idx = 0;
          else if (topEmpty) idx = (crease || upperOcc >= 8) ? 1 : 2;
          else if (span >= 14 && localZ < 0.14) idx = 0;
          else idx = 1;
          if (myP === headId && idx === 2 && z < pMaxZ[myP] - 1) {
            const edge2d = (x + 1 >= w || !src[i + 1]) || (x === 0 || !src[i - 1]) ||
                           (y + 1 >= d || !src[i + w]) || (y === 0 || !src[i - w]);
            if (!edge2d) idx = 1;
          }
          this.grid[i] = ramp[clamp(idx, 0, ramp.length - 1)];
        }
      }
    }
  }
  toStripAsset(makeCanvas, meta = {}) {
    const { w, d, h } = this;
    const activeLayers = [], glowLayers = [];
    for (let z = 0; z < h; z++) {
      let hasPx = false, hasGlow = false;
      const zBase = z * d * w;
      for (let i = 0; i < d * w; i++) {
        const id = this.grid[zBase + i];
        if (!id) continue;
        hasPx = true;
        if (GLOW_ID_SET.has(id)) hasGlow = true;
      }
      if (hasPx) activeLayers.push(z);
      if (hasGlow) glowLayers.push(z);
    }
    const strip = makeCanvas(w * h, d);
    const sim = strip.getContext('2d').createImageData(w * h, d);
    const hasGlow = glowLayers.length > 0;
    const glowStrip = hasGlow ? makeCanvas(w * glowLayers.length, d) : null;
    const eim = glowStrip ? glowStrip.getContext('2d').createImageData(w * glowLayers.length, d) : null;
    const glowSlot = new Int16Array(h).fill(-1);
    for (let i = 0; i < glowLayers.length; i++) glowSlot[glowLayers[i]] = i;

    const foot = makeCanvas(w, d);
    const fg = foot.getContext('2d');
    const fim = fg.createImageData(w, d);
    for (let y = 0; y < d; y++) for (let x = 0; x < w; x++) {
      for (let z = 0; z < h; z++) {
        if (this.grid[(z * d + y) * w + x]) {
          const fi = (y * w + x) * 4;
          fim.data[fi] = 14; fim.data[fi + 1] = 10; fim.data[fi + 2] = 16; fim.data[fi + 3] = 255;
          break;
        }
      }
    }
    fg.putImageData(fim, 0, 0);

    const asset = {
      w, d, h, grid: this.grid,
      strip, glowStrip, sim, eim,
      glowSlot, activeLayers, glowLayers,
      footShadow: foot,
      meta: {
        footRadius: meta.footRadius || 10.0,
        headZ: meta.headZ || (activeLayers.length ? activeLayers[activeLayers.length - 1] + 2 : h),
        centerZ: meta.centerZ || Math.round(h * 0.5)
      }
    };
    recolorAsset(asset, ID_TO_RGBA);
    return asset;
  }
}

// 4. 幼年飞龙模块化部件（圆滚短躯、大头炽口、粗短尾、锁枢轴肉翼）

function buildYoungTorsoPart() {
  const m = new VoxelModel(14, 16, 17);
  m.fillAABB(-5.6, 5.6, -6.8, 6.2, 1.5, 16.0, (x, y, z, X, Y) => {
    const dBody = (Math.hypot(X / 5.1, (Y + 1.0) / 5.5, (z - 8.2) / 4.8) - 1) * 4.8;
    const dNeck = (Math.hypot(X / 3.1, (Y - 4.2) / 3.0, (z - 13.0) / 2.8) - 1) * 2.8;
    if (smin(dBody, dNeck, 1.5) <= 0) {
      const isBelly = z < 7.0 && Math.abs(X) < 3.6 && Y > -4.2;
      m.setRaw(x, y, z, isBelly ? mat('belly') : mat('scale'), isBelly ? PART_ID.belly : PART_ID.body);
    }
  });
  for (const sp of [[0,1.8,13.2,1.25],[0,-1.0,13.4,1.3],[0,-3.8,12.6,1.2],[0,-6.0,11.2,1.1]]) {
    m.paintEllipsoid(sp[0], sp[1], sp[2], sp[3]*0.85, sp[3], sp[3]*1.05, mat('horn'), PART_ID.spine, true);
  }
  for (const s of [-1, 1]) {
    m.paintCapsule(s * 3.6, -2.5, 5.2, s * 4.4, -2.2, 1.8, 1.65, 1.3, mat('scale'), PART_ID.leg, true);
    m.paintEllipsoid(s * 4.4, -1.0, 1.2, 1.35, 1.6, 1.05, mat('horn'), PART_ID.claw, true);
  }
  m.despeckle(); m.applyArtShading(true);
  return m;
}

function buildYoungHeadPart() {
  const W = 13, D = 18, H = 16;
  const m = new VoxelModel(W, D, H);
  const hz = 5.6, hy = -1.2;
  m.paintEllipsoid(0, hy, hz, 4.8, 4.9, 4.2, mat('scale'), PART_ID.head, true);
  m.paintEllipsoid(0, hy + 3.4, hz + 0.1, 2.9, 2.5, 1.55, mat('scale'), PART_ID.snout, true);
  m.paintEllipsoid(0, hy + 4.0, hz - 2.6, 2.5, 2.9, 1.15, mat('belly'), PART_ID.jaw, true);
  // 口部炽核（+Y 与 0.6 俯视严格 0 遮挡）
  const mcZ = Math.round(hz - 1.3);
  m.fillAABB(-1.6, 1.6, hy + 6.0, hy + 7.2, mcZ - 0.5, mcZ + 0.8, (x, y, z, X, Y) => {
    if (Math.abs(X) <= 1.2 && Y >= hy + 6.1 && Y <= hy + 7.0 && z >= mcZ && z <= mcZ + 1) {
      m.setRaw(x, y, z, Math.abs(X) <= 0.6 ? KEY_TO_ID.emissiveCore : KEY_TO_ID.emissiveHot, PART_ID.mouthCore);
    }
  });
  for (const s of [-1, 1]) {
    m.paintCapsule(s * 2.5, hy - 2.0, hz + 3.2, s * 3.7, hy - 4.6, hz + 6.4, 1.35, 0.9, mat('horn'), PART_ID.horn, true);
  }
  m.despeckle(); m.applyArtShading(true);

  const eyeZ = Math.round(hz + 1.3), eyeY = Math.round(D * 0.5 - 0.5 + hy + 3.6);
  for (const s of [-1, 1]) {
    let sx = -1;
    for (let step = 0; step < 6; step++) {
      const x = Math.round(W * 0.5 - 0.5 + s * (5.2 - step));
      if (m.getPartId(x, eyeY, eyeZ) === PART_ID.head) { sx = x; break; }
    }
    if (sx < 0) sx = Math.round(W * 0.5 - 0.5 + s * 3.8);
    for (const dy of [0, 1]) for (const dz of [0, 1]) {
      const kId = (dz === 1 && dy === 1) ? KEY_TO_ID.eyeGlint : (dy === 1 ? KEY_TO_ID.eyeDark : KEY_TO_ID.eyeIris);
      m.setRaw(sx, eyeY + dy - 1, eyeZ + dz, kId, PART_ID.eye);
    }
  }
  return m;
}

const Y_TAIL_PIVOT_Y = 5.4;
function buildYoungTailPart() {
  const m = new VoxelModel(8, 14, 9);
  const ry = Y_TAIL_PIVOT_Y;
  m.paintCapsule(0, ry, 3.2, 0, ry - 4.0, 2.6, 2.8, 2.2, mat('scale'), PART_ID.tail, true);
  m.paintCapsule(0, ry - 4.0, 2.6, 0, ry - 7.8, 3.2, 2.2, 1.6, mat('scale'), PART_ID.tail, true);
  m.paintCapsule(0, ry - 7.8, 3.2, 0, ry - 11.0, 4.6, 1.6, 1.15, mat('scale'), PART_ID.tail, true);
  m.despeckle(); m.applyArtShading(true);
  return m;
}

const Y_WING_PIVOT = { x: 6.4, y: 2.6 };
function buildYoungWingPart(side, pose) {
  const m = new VoxelModel(18, 16, 18);
  const s = side, rx = -s * Y_WING_PIVOT.x, ry = Y_WING_PIVOT.y, rz = 7.4;
  const flap = pose === 'up' ? 0.90 : (pose === 'down' ? -0.82 : (pose === 'mid' ? 0.08 : -0.68));
  const spread = pose === 'tuck' ? 0.58 : 1.0;
  const pRoot = [rx, ry, rz];
  const pElbow = [rx + s * 5.4 * spread, ry + 1.8, rz + 2.0 + flap * 2.8];
  const pTip   = [rx + s * 11.4 * spread, ry - 0.4, rz + 1.0 + flap * 5.0];
  const pTRoot = [rx, ry - 5.2, rz - 1.4];
  const pTMid  = [rx + s * 5.4 * spread, ry - 5.8, pElbow[2] - 1.6];
  const pTTip  = [rx + s * 10.8 * spread, ry - 2.2, pTip[2] - 0.8];
  m.paintWingQuad(pRoot, pElbow, pTMid, pTRoot, 1.15, mat('wing'), PART_ID.wingMem, 0.8, false);
  m.paintWingQuad(pElbow, pTip, pTTip, pTMid,  1.12, mat('wing'), PART_ID.wingMem, 1.0, false);
  m.paintEllipsoid(rx, ry - 0.4, rz, 1.7, 1.7, 1.5, mat('scale'), PART_ID.wingBone, true);
  m.paintCapsule(pRoot[0], pRoot[1], pRoot[2], pElbow[0], pElbow[1], pElbow[2], 1.45, 1.25, mat('scale'), PART_ID.wingBone, true);
  m.paintCapsule(pElbow[0], pElbow[1], pElbow[2], pTip[0], pTip[1], pTip[2], 1.25, 0.95, mat('scale'), PART_ID.wingBone, true);
  m.paintCapsule(pElbow[0], pElbow[1], pElbow[2], pTMid[0], pTMid[1], pTMid[2], 1.02, 0.82, mat('scale'), PART_ID.wingBone, true);
  m.despeckle(); m.applyArtShading(true);
  return m;
}

// 5. 成年飞龙模块化部件（壮硕胸甲+炽核、S形长颈、棱角龙头、3节鞭尾链、58格分段骨感宽翼）

function buildAdultTorsoPart() {
  const m = new VoxelModel(18, 22, 26);
  m.fillAABB(-7.6, 7.6, -9.2, 10.8, 7.5, 22.5, (x, y, z, X, Y) => {
    const dTorso = (Math.hypot(X / 6.9, (Y - 0.4) / 9.0, (z - 14.8) / 6.0) - 1) * 6.0;
    const dChest = (Math.hypot(X / 5.8, (Y - 6.0) / 5.2, (z - 16.0) / 5.4) - 1) * 5.2;
    if (smin(dTorso, dChest, 2.2) <= 0) {

function buildTrainingDummy() {

function buildVolcanicPlatform(makeCanvas, size = 200) {
  const base = makeCanvas(size, size);
  const bg = base.getContext('2d');
  const bim = bg.createImageData(size, size);
  const half = size * 0.5, rOuter = size * 0.478, rInner = size * 0.425;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = x - half, dy = y - half, dist = Math.hypot(dx, dy);
    if (dist > rOuter) continue;
    const i = (y * size + x) * 4;
    let key;
    if (dist > rInner) {
      const ang = Math.atan2(dy, dx), segF = ((ang + Math.PI) / (Math.PI * 2)) * 24;
      const seam = Math.abs(segF - Math.round(segF)) < 0.08;
      key = (seam || dist > rOuter - 2.2 || dist < rInner + 1.8) ? 'stoneDeep' : ((Math.floor(segF) & 1) ? 'stoneMid' : 'stoneDark');
    } else {
      const v = periodicNoise2(x, y, 64, 64, 16, 17) * 0.65 + periodicNoise2(x + 9, y + 5, 32, 32, 8, 53) * 0.35;
      const tileSeam = (x % 16 === 0) || (y % 16 === 0);
      const runeRing = Math.abs(dist - 32) < 1.2 || Math.abs(dist - 62) < 1.2;
      key = runeRing ? (((x + y) & 2) ? 'rustMid' : 'rustDark') : (tileSeam ? 'stoneDeep' : (v > 0.64 ? 'stoneHi' : (v < 0.34 ? 'stoneDark' : 'stoneMid')));
    }
    const rgba = ID_TO_RGBA[KEY_TO_ID[key]];
    bim.data[i] = rgba[0]; bim.data[i + 1] = rgba[1]; bim.data[i + 2] = rgba[2]; bim.data[i + 3] = 255;
  }
  bg.putImageData(bim, 0, 0);
  return { size, base, rInner, rOuter };
}

(function initApp() {
  const TILT = 0.6, HS = 0.8, TAU = Math.PI * 2;

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };

  const eb = mk(1, 1), ebctx = eb.getContext('2d');

  const actorOut = mk(ACTOR_W, ACTOR_H), aoCtx = actorOut.getContext('2d');

  const scratchRaw = mk(240, 240), srCtx = scratchRaw.getContext('2d');
  const scratchSil = mk(240, 240), ssCtx = scratchSil.getContext('2d');

  const canvasPool = [];
  function acquireCanvas(w, h) {
    const c = canvasPool.pop() || document.createElement('canvas');
    if (c.width !== w) c.width = w;
    if (c.height !== h) c.height = h;
    return c;
  }
  function releaseCanvas(c) {
    if (!c) return;
    if (canvasPool.length < 360) canvasPool.push(c);
  }

  // 1. 极速构建双形态 25 个模块化部件（含 up/mid/down 平滑振翅中间帧）
  const tBuild0 = performance.now();
  const parts = {
    yTorso:      buildYoungTorsoPart().toStripAsset(mk,      { footRadius: 7.5 }),
    yHead:       buildYoungHeadPart().toStripAsset(mk,       { footRadius: 5.5 }),

    yWingL_up:   buildYoungWingPart(-1, 'up').toStripAsset(mk,   { footRadius: 6.0 }),
    yWingR_up:   buildYoungWingPart( 1, 'up').toStripAsset(mk,   { footRadius: 6.0 }),
    yWingL_mid:  buildYoungWingPart(-1, 'mid').toStripAsset(mk,  { footRadius: 6.0 }),
    yWingR_mid:  buildYoungWingPart( 1, 'mid').toStripAsset(mk,  { footRadius: 6.0 }),
    yWingL_dn:   buildYoungWingPart(-1, 'down').toStripAsset(mk, { footRadius: 6.0 }),
    yWingR_dn:   buildYoungWingPart( 1, 'down').toStripAsset(mk, { footRadius: 6.0 }),
    yWingL_tuck: buildYoungWingPart(-1, 'tuck').toStripAsset(mk, { footRadius: 4.5 }),
    yWingR_tuck: buildYoungWingPart( 1, 'tuck').toStripAsset(mk, { footRadius: 4.5 }),

    aTorso:       buildAdultTorsoPart().toStripAsset(mk,     { footRadius: 11.0 }),
    aNeck:        buildAdultNeckPart().toStripAsset(mk,      { footRadius: 5.0 }),
    aHead:        buildAdultHeadPart().toStripAsset(mk,      { footRadius: 6.5 }),
    aTail1:       buildAdultTailSegPart(3.5, 2.5, false).toStripAsset(mk, { footRadius: 4.0 }),
    aTail2:       buildAdultTailSegPart(2.4, 1.7, false).toStripAsset(mk, { footRadius: 3.0 }),
    aTailTip:     buildAdultTailSegPart(1.6, 1.1, true).toStripAsset(mk,  { footRadius: 3.0 }),
    aWingL_up:    buildAdultWingPart(-1, 'up').toStripAsset(mk,    { footRadius: 11.0 }),
    aWingR_up:    buildAdultWingPart( 1, 'up').toStripAsset(mk,    { footRadius: 11.0 }),
    aWingL_mid:   buildAdultWingPart(-1, 'mid').toStripAsset(mk,   { footRadius: 11.0 }),
    aWingR_mid:   buildAdultWingPart( 1, 'mid').toStripAsset(mk,   { footRadius: 11.0 }),
    aWingL_dn:    buildAdultWingPart(-1, 'down').toStripAsset(mk,  { footRadius: 11.0 }),
    aWingR_dn:    buildAdultWingPart( 1, 'down').toStripAsset(mk,  { footRadius: 11.0 }),
    aWingL_glide: buildAdultWingPart(-1, 'glide').toStripAsset(mk, { footRadius: 11.0 }),
    aWingR_glide: buildAdultWingPart( 1, 'glide').toStripAsset(mk, { footRadius: 11.0 })
  };
  const dragonAssets = Object.values(parts);
  const dummyAsset = buildTrainingDummy().toStripAsset(mk, { footRadius: 5.5, headZ: 29, centerZ: 15 });
  const platform = buildVolcanicPlatform(mk, 200);
  const buildMs = (performance.now() - tBuild0).toFixed(1);

  let skinIdx = 0, curSkin = SKINS[0], skinMs = 0;
  let form = 'young'; // 'young' | 'adult'
  let baseMode = 'hover'; // 'hover' | 'soar'

  const spriteCache = new Map();
  const MAX_CACHE = 1024;
  let cacheHits = 0, cacheMisses = 0;

  function flushDragonCache() {
    for (const [k, entry] of spriteCache.entries()) {
      if (k.startsWith('dummy|')) continue;
      releaseCanvas(entry.main); releaseCanvas(entry.glow);
      spriteCache.delete(k);
    }
  }

  function getBakedSprite(asset, assetId, angle, outlineHex, wantOutline, symDeg = 360) {
    const rawDeg = (((angle * 180 / Math.PI) % symDeg) + symDeg) % symDeg;
    const slots = Math.max(1, Math.round(symDeg / ANGLE_QUANT_DEG));
    const degSlot = Math.round(rawDeg / ANGLE_QUANT_DEG) % slots;
    const qAng = (degSlot * ANGLE_QUANT_DEG) * Math.PI / 180;
    const key = `${assetId}|${degSlot}|${wantOutline ? outlineHex : 'raw'}`;
    const hit = spriteCache.get(key);
    if (hit) { cacheHits++; spriteCache.delete(key); spriteCache.set(key, hit); return hit; }
    cacheMisses++;

    const { w, d, activeLayers, glowLayers, glowSlot, glowStrip, strip } = asset;
    const c = Math.cos(qAng), s = Math.sin(qAng), sc = BAKE_SCALE;
    const maxZ = activeLayers.length ? activeLayers[activeLayers.length - 1] : 0;
    const op = wantOutline ? 1 : 0, pad = op + 2;
    const rxSpan = Math.ceil((Math.abs(c) * w * 0.5 + Math.abs(s) * d * 0.5) * sc);
    const rySpan = Math.ceil((Math.abs(s) * w * 0.5 + Math.abs(c) * d * 0.5) * TILT * sc);
    const bw = rxSpan * 2 + pad * 2, bh = rySpan * 2 + maxZ * BAKE_STEP + pad * 2 + BAKE_STEP;
    const anchorX = Math.floor(bw / 2), anchorY = bh - rySpan - pad;

    if (scratchRaw.width < bw) scratchRaw.width = bw;
    if (scratchRaw.height < bh) scratchRaw.height = bh;
    srCtx.setTransform(1, 0, 0, 1, 0, 0); srCtx.globalCompositeOperation = 'source-over';
    srCtx.imageSmoothingEnabled = false; srCtx.clearRect(0, 0, bw, bh);

    const hasGlow = !!glowStrip && glowLayers.length > 0;
    const minGlowZ = hasGlow ? glowLayers[0] : 9999;
    const glowC = hasGlow ? acquireCanvas(bw, bh) : null;
    const glctx = hasGlow ? glowC.getContext('2d') : null;
    if (glctx) {
      glctx.setTransform(1, 0, 0, 1, 0, 0); glctx.globalCompositeOperation = 'source-over';
      glctx.imageSmoothingEnabled = false; glctx.clearRect(0, 0, bw, bh);
    }
    const cs = c * sc, ss = s * sc, tss = TILT * ss, tcs = TILT * cs, hw = -w * 0.5, hd = -d * 0.5;
    for (let li = 0; li < activeLayers.length; li++) {
      const z = activeLayers[li], yy = anchorY - z * BAKE_STEP, sx = z * w;
      srCtx.setTransform(cs, tss, -ss, tcs, anchorX, yy + BAKE_HALF); srCtx.drawImage(strip, sx, 0, w, d, hw, hd, w, d);
      srCtx.setTransform(cs, tss, -ss, tcs, anchorX, yy); srCtx.drawImage(strip, sx, 0, w, d, hw, hd, w, d);
      if (hasGlow && z >= minGlowZ) {
        if (z > minGlowZ) {

  function buildDragonPartList() {
    const list = [];
    const yw = rig.yaw, hYaw = yw + rig.headYaw;

      const [tRootX, tRootY] = localToWorldXY(rig.x, rig.y, yw, 0, -5.6);

      const [tWx, tWy] = localToWorldXY(tRootX, tRootY, tYaw, 0, -Y_TAIL_PIVOT_Y);

      const wp = rig.wingPose === 'tuck' ? 'tuck' : (rig.wingPose === 'down' ? 'dn' : (rig.wingPose === 'mid' ? 'mid' : 'up'));
      for (const s of [-1, 1]) {

        const wYaw = yw - s * rig.wingSweep;

        list.push({ id, m: parts[id], x: wx, y: wy, lift: 3.2, ro: wYaw, bias: -0.1 });

      list.push({ id: 'aTorso', m: parts.aTorso, x: rig.x, y: rig.y, lift: 0, ro: yw, bias: 0.1 });
      const [nx, ny] = localToWorldXY(rig.x, rig.y, yw, 0, 10.2);

      // 3 节实时鞭尾链（逐节锁枢轴，S 形行波摆动 0 脱节！）

      const segZ = [11.2, 10.8, 10.4];
      for (let i = 0; i < 3; i++) {
        const sYaw = yw + Math.sin(rig.tailPhase - i * 0.85) * (0.22 + i * 0.12);

      const wp = rig.wingPose === 'glide' ? 'glide' : (rig.wingPose === 'down' ? 'dn' : (rig.wingPose === 'mid' ? 'mid' : 'up'));
      for (const s of [-1, 1]) {

    }

    asCtx.setTransform(1, 0, 0, 1, 0, 0); asCtx.globalCompositeOperation = 'source-over'; asCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

      if (!hasGlow || z >= minGlowZ) {
        ectx.globalCompositeOperation = 'destination-out';
        ectx.setTransform(c * effSc * eScaleX, TILT * s * effSc * eScaleY, -s * effSc * eScaleX, TILT * c * effSc * eScaleY, X0 * eScaleX, yy * eScaleY);
        ectx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      }
      if (hasGlow && glowSlot[z] >= 0) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(glowStrip, glowSlot[z] * w, 0, w, d, -w / 2, -d / 2, w, d); calls++; }
    }
    ectx.globalCompositeOperation = 'source-over';
    return calls;
  }

  let last = 0, fpsAcc = 0, fpsFrames = 0, fpsVal = 60, statTimer = 0, cpuMsSmooth = 1.0;

  function tick(ms) {
    const tCpu0 = performance.now();
    const t = ms / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
    animTime += dt; fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.4) { fpsVal = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
    if (autoSpin && !drag) thTarget += dt * 0.55;
    if (!drag) th += (thTarget - th) * Math.min(1, dt * 8);

    updateDragonRig(dt);
    updateVFX(dt);

    const mode = MODES[modeIdx], sc = mode === 'retro' ? 1 : SCALE;
    const c = Math.cos(th), s = Math.sin(th), eScale = EW / cv.width, fx = curSkin.fx;
    let drawCalls = 0;

    const dragonParts = buildDragonPartList();
    const dummyShakeX = dummyHit > 0 ? Math.sin(animTime * 55) * dummyHit * 2.0 : 0;
    const dummyShakeY = dummyHit > 0 ? Math.cos(animTime * 48) * dummyHit * 1.4 : 0;
    const dummyObj = { id: 'dummy', m: dummyAsset, x: DUMMY_POS.x + dummyShakeX, y: DUMMY_POS.y + dummyShakeY, lift: 0, ro: 0 };

    const bSize = platform.size, halfB = bSize * 0.5;
    gbctx.setTransform(GROUND_SUPERSAMPLE, 0, 0, GROUND_SUPERSAMPLE, 0, 0);
    gbctx.globalCompositeOperation = 'source-over'; gbctx.imageSmoothingEnabled = false;
    gbctx.clearRect(0, 0, bSize, bSize); gbctx.drawImage(platform.base, 0, 0);

    gbctx.save(); gbctx.translate(halfB, halfB);
    gbctx.beginPath(); gbctx.arc(0, 0, platform.rInner, 0, TAU); gbctx.clip();

    for (const dc of groundDecals) {
      const fade = clamp(1 - dc.t / dc.life, 0, 1);
      gbctx.save(); gbctx.translate(dc.x, dc.y);
      if (dc.type === 'scorch') {
        gbctx.globalAlpha = fade * 0.65; gbctx.fillStyle = fx.scorchBase; gbctx.fillRect(-dc.r, -dc.r * 0.7, dc.r * 2, dc.r * 1.4);
        gbctx.globalAlpha = fade * 0.45; gbctx.fillStyle = fx.scorchGlow; gbctx.fillRect(-dc.r * 0.55, -dc.r * 0.35, dc.r * 1.1, dc.r * 0.7);
      } else if (dc.type === 'burnRing') {
        gbctx.strokeStyle = `rgba(${fx.ringRGB}, ${fade * 0.8})`; gbctx.lineWidth = 3; gbctx.beginPath(); gbctx.arc(0, 0, dc.r, 0, TAU); gbctx.stroke();
        gbctx.strokeStyle = `rgba(20, 10, 12, ${fade * 0.7})`; gbctx.lineWidth = 5; gbctx.beginPath(); gbctx.arc(0, 0, dc.r + 3, 0, TAU); gbctx.stroke();
      } else if (dc.type === 'crackRing') {
        gbctx.strokeStyle = `rgba(18, 10, 12, ${fade * 0.85})`; gbctx.lineWidth = 2.2; gbctx.beginPath(); gbctx.arc(0, 0, dc.r * 0.7, 0, TAU); gbctx.stroke();
        for (let k = 0; k < 10; k++) { const a = (k / 10) * TAU + 0.2; gbctx.beginPath(); gbctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4); gbctx.lineTo(Math.cos(a) * dc.r, Math.sin(a) * dc.r); gbctx.stroke(); }
        gbctx.strokeStyle = `rgba(${fx.crackRGB}, ${fade * 0.75})`; gbctx.lineWidth = 1.4; gbctx.beginPath(); gbctx.arc(0, 0, dc.r * 0.45, 0, TAU); gbctx.stroke();
      } else if (dc.type === 'firePile') {
        gbctx.globalAlpha = fade * 0.75; gbctx.fillStyle = fx.scorchBase; gbctx.fillRect(-dc.r * 0.8, -dc.r * 0.8, dc.r * 1.6, dc.r * 1.6);
        gbctx.globalAlpha = 1; gbctx.fillStyle = `rgba(${fx.pileRGB}, ${fade * 0.85})`; gbctx.fillRect(-dc.r * 0.45, -dc.r * 0.45, dc.r * 0.9, dc.r * 0.9);
      }
      gbctx.restore();
    }
    for (const w of warnings) {
      const p = clamp(w.t / w.dur, 0, 1);
      gbctx.save(); gbctx.translate(w.x, w.y);
      gbctx.strokeStyle = fx.warnStroke; gbctx.lineWidth = 2; gbctx.beginPath(); gbctx.arc(0, 0, w.r, 0, TAU); gbctx.stroke();
      gbctx.fillStyle = `rgba(${fx.warnFillRGB}, ${0.14 + p * 0.28})`; gbctx.beginPath(); gbctx.arc(0, 0, w.r * p, 0, TAU); gbctx.fill();
      gbctx.restore();
    }
    if (rig.runePower > 0.01) {
      const rp = rig.runePower, rr = 22 + rp * 24;
      gbctx.save(); gbctx.rotate(animTime * 2.4);
      gbctx.strokeStyle = `rgba(${fx.runeRGB}, ${rp * 0.95})`; gbctx.lineWidth = 2.4;
      gbctx.beginPath(); gbctx.arc(0, 0, rr, 0, TAU); gbctx.stroke();
      gbctx.beginPath(); gbctx.arc(0, 0, rr * 0.65, 0, TAU); gbctx.stroke();
      for (let k = 0; k < 8; k++) { const a = (k / 8) * TAU; gbctx.fillStyle = `rgba(${fx.runeDotRGB}, ${rp * 0.9})`; gbctx.fillRect(Math.cos(a) * rr - 2, Math.sin(a) * rr - 2, 4, 4); }
      gbctx.restore();
    }

    const lf = clamp(1 - rig.lift / 68, 0.25, 1.0);
    const shR = (form === 'adult' ? 18.0 : 10.5) * (0.62 + 0.38 * lf);
    gbctx.fillStyle = `rgba(8, 5, 10, ${0.50 * lf})`;
    gbctx.beginPath(); gbctx.ellipse(rig.x + rig.lift * 0.14, rig.y - rig.lift * 0.14, shR * 1.15, shR * 0.88, rig.yaw, 0, TAU); gbctx.fill();

    gbctx.save(); gbctx.translate(dummyObj.x, dummyObj.y);
    gbctx.save(); gbctx.globalAlpha = 0.34; gbctx.translate(2.5, -2.5);
    gbctx.drawImage(dummyAsset.footShadow, -dummyAsset.w / 2, -dummyAsset.d / 2); gbctx.restore();
    gbctx.fillStyle = 'rgba(8, 5, 10, 0.52)';
    gbctx.beginPath(); gbctx.arc(0, 0, dummyAsset.meta.footRadius, 0, TAU); gbctx.fill();
    gbctx.restore(); gbctx.restore();

    ectx.setTransform(1, 0, 0, 1, 0, 0); ectx.globalCompositeOperation = 'source-over';
    ectx.imageSmoothingEnabled = false; ectx.clearRect(0, 0, EW, EH);
    dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = 'source-over';
    dctx.imageSmoothingEnabled = false; dctx.drawImage(bgc, 0, 0); drawCalls++;

    dctx.setTransform(c * SCALE, TILT * s * SCALE, -s * SCALE, TILT * c * SCALE, cv.width / 2 + shakeX, cv.height / 2 + 18 * SCALE + shakeY);
    dctx.drawImage(gbuf, -halfB, -halfB, bSize, bSize);
    dctx.setTransform(1, 0, 0, 1, 0, 0); drawCalls++;

    if (mode === 'cached') {
      const dispRatio = SCALE / BAKE_SCALE;
      const composed = composeDragonActor(dragonParts, c, s, curSkin.outline);
      drawCalls += composed.calls;
      const [sx, sy, sry] = proj(rig.x, rig.y, rig.lift, SCALE);
      const [dxP, dyP, dry] = proj(dummyObj.x, dummyObj.y, 0, SCALE);
      const dummySp = getBakedSprite(dummyAsset, 'dummy', th, curSkin.outline, useOutline, 360);
      ectx.setTransform(1, 0, 0, 1, 0, 0);

      for (const who of (sry < dry ? ['dragon', 'dummy'] : ['dummy', 'dragon'])) {
        if (who === 'dragon') {
          const rMul = dispRatio * rig.scaleMul;
          const dw = Math.round(ACTOR_W * rMul), dh = Math.round(ACTOR_H * rMul);
          const dx = Math.round(sx - ACTOR_AX * rMul), dy = Math.round(sy - ACTOR_AY * rMul);
          dctx.drawImage(composed.main, dx, dy, dw, dh); drawCalls++;
          if (rig.pulseAlpha > 0.01 && rig.pulseColor) {
            asCtx.setTransform(1, 0, 0, 1, 0, 0); asCtx.globalCompositeOperation = 'source-over'; asCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
            asCtx.drawImage(composed.main, 0, 0);
            asCtx.globalCompositeOperation = 'source-in'; asCtx.fillStyle = rig.pulseColor; asCtx.fillRect(0, 0, ACTOR_W, ACTOR_H);
            dctx.save(); dctx.globalAlpha = rig.pulseAlpha; dctx.drawImage(actorSil, dx, dy, dw, dh); dctx.restore();
            ectx.globalCompositeOperation = 'source-over'; ectx.globalAlpha = rig.pulseAlpha;
            ectx.drawImage(actorSil, dx * eScale, dy * eScale, dw * eScale, dh * eScale); ectx.globalAlpha = 1; drawCalls++;
          }
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(composed.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
          if (composed.glow) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(composed.glow, dx * eScale, dy * eScale, dw * eScale, dh * eScale); drawCalls++; }
        } else {
          const dw = Math.round(dummySp.bw * dispRatio), dh = Math.round(dummySp.bh * dispRatio);
          const dx = Math.round(dxP - dummySp.anchorX * dispRatio), dy = Math.round(dyP - dummySp.anchorY * dispRatio);
          dctx.drawImage(dummySp.main, dx, dy, dw, dh); drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(dummySp.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
        }
      }
      ectx.globalCompositeOperation = 'source-over';
    } else {
      mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'source-over';
      mctx.imageSmoothingEnabled = false; mctx.clearRect(0, 0, CW, CH);
      const allObjs = [...dragonParts.map(p => ({ ...p, lift: rig.lift + p.lift, scaleMul: rig.scaleMul })), { ...dummyObj, scaleMul: 1.0 }];
      for (const o of allObjs) o._depth = proj(o.x, o.y, o.lift, sc)[2] + o.lift * 0.08 + (o.bias || 0);
      allObjs.sort((a, b) => a._depth - b._depth);
      for (const o of allObjs) drawCalls += drawStackRealtime(o.m, o.x, o.y, o.lift, o.ro, sc, o.scaleMul);
      const drawW = mode === 'retro' ? CW * SCALE : CW, drawH = mode === 'retro' ? CH * SCALE : CH;
      if (useOutline) {
        octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.clearRect(0, 0, CW, CH);
        octx.drawImage(mc, 0, 0); octx.globalCompositeOperation = 'source-in'; octx.fillStyle = curSkin.outline; octx.fillRect(0, 0, CW, CH);
        octx.globalCompositeOperation = 'source-over';
        const op = mode === 'retro' ? SCALE : Math.max(1, Math.round(SCALE * 0.30));
        for (const [ox, oy] of [[-op, 0], [op, 0], [0, -op], [0, op]]) dctx.drawImage(oc, ox, oy, drawW, drawH);
      }
      dctx.drawImage(mc, 0, 0, drawW, drawH);
    }

    const pSc = mode === 'retro' ? 1 : SCALE, toMain = mode === 'retro' ? SCALE : 1, toE = toMain * eScale;
    function drawVoxelBlock(wx, wy, wz, szVox, color, isGlow) {
      const [px, py] = proj(wx, wy, wz, pSc);
      const sx = Math.round(px * toMain), sy = Math.round(py * toMain), sPx = Math.max(2, Math.round(szVox * SCALE));
      dctx.fillStyle = color; dctx.fillRect(sx - (sPx >> 1), sy - (sPx >> 1), sPx, sPx);
      if (isGlow) {
        const es = Math.max(1, Math.round(sPx * eScale));
        ectx.fillStyle = color; ectx.fillRect(Math.round(px * toE) - (es >> 1), Math.round(py * toE) - (es >> 1), es, es);
      }
    }

    if (rig.cocoonPhase > 0.01) {
      const cp = rig.cocoonPhase;
      for (let col = 0; col < 5; col++) for (let k = 0; k < 14; k++) {
        const u = k / 13, ang = (col / 5) * TAU + animTime * 9.5 + u * 4.2, rad = (13 - u * 4.5) * (0.85 + cp * 0.35);
        drawVoxelBlock(rig.x + Math.cos(ang) * rad, rig.y + Math.sin(ang) * rad, 2 + u * 34, 2.4 + (1 - u) * 1.4, u > 0.72 ? fx.core : (u > 0.32 ? fx.hot : fx.mid), true);
      }
    }
    if (rig.flameBeam && rig.flameBeam.power > 0.05) {
      const fb = rig.flameBeam, mp = getMouthWorldPos();
      const dirX = -Math.sin(mp.yaw), dirY = Math.cos(mp.yaw);
      const perpX = Math.cos(mp.yaw), perpY = Math.sin(mp.yaw);
      drawVoxelBlock(mp.x, mp.y, mp.z, 2.8, fx.core, true);
      for (let i = 0; i < 26; i++) {
        const u = i / 25, dist = u * fb.len * fb.power;
        const bx = mp.x + dirX * dist, by = mp.y + dirY * dist;
        const bz = lerp(mp.z, 4.5, Math.pow(u, 0.95)) + Math.sin(animTime * 28 - i * 0.7) * (0.4 + u * 2.4);
        const wSpan = 0.65 + u * 6.2;
        const ox = perpX * wSpan, oy = perpY * wSpan;
        if (u > 0.06) {
          drawVoxelBlock(bx + ox, by + oy, bz, 2.0 + u * 2.4, fx.outer, true);
          drawVoxelBlock(bx - ox, by - oy, bz, 2.0 + u * 2.4, fx.outer, true);
        }
        drawVoxelBlock(bx + ox * 0.42, by + oy * 0.42, bz + 0.4, 2.1 + u * 1.9, fx.mid, true);
        drawVoxelBlock(bx - ox * 0.42, by - oy * 0.42, bz + 0.4, 2.1 + u * 1.9, fx.hot, true);
        if (u < 0.76) drawVoxelBlock(bx, by, bz + 0.6, 2.0 + u * 1.1, fx.core, true);
      }
    }
    if (rig.orbitOrbs) for (const ob of rig.orbitOrbs) { drawVoxelBlock(ob.x, ob.y, ob.z, 3.4, fx.mid, true); drawVoxelBlock(ob.x, ob.y, ob.z + 0.5, 2.0, fx.core, true); }
    for (const pr of projectiles) {
      const sz = pr.type === 'magmaMeteor' ? 4.8 : 3.4;
      drawVoxelBlock(pr.x, pr.y, pr.z, sz, pr.type === 'magmaMeteor' ? fx.meteorBody : fx.mid, false);
      drawVoxelBlock(pr.x, pr.y, pr.z + 0.5, sz * 0.75, fx.hot, true);
      drawVoxelBlock(pr.x, pr.y, pr.z + 1.0, sz * 0.45, fx.core, true);
    }
    for (const rg of shockRings) {
      const u = clamp(rg.t / rg.life, 0, 1), rad = lerp(rg.r0, rg.r1, smoothstep(0, 1, u));
      const a0 = rg.arc ? rg.arc.start : 0, a1 = rg.arc ? rg.arc.end : TAU, segs = rg.arc ? 14 : 26, bSz = Math.max(1.2, (1 - u * 0.55) * 2.5);
      for (let i = 0; i <= segs; i++) { const a = lerp(a0, a1, i / segs); drawVoxelBlock(rg.x + Math.cos(a) * rad, rg.y + Math.sin(a) * rad, rg.z, bSz, rg.color, rg.glow); }
    }
    for (const p of particles) drawVoxelBlock(p.x, p.y, p.z, p.sz * (1 - (p.t / p.life) * 0.65), p.color, p.glow);
    for (const em of ambientEmbers) drawVoxelBlock(em.x + Math.sin(animTime * 1.6 + em.ph) * 5, em.y + Math.cos(animTime * 1.4 + em.ph) * 5, ((em.z + animTime * em.sp) % 44) + 2, 1.1, fx.hot, true);

    ebctx.setTransform(1, 0, 0, 1, 0, 0); ebctx.clearRect(0, 0, EW, EH);
    ebctx.filter = `blur(${Math.max(1, Math.round(SCALE * 0.16))}px)`; ebctx.drawImage(ec, 0, 0); ebctx.filter = 'none';
    dctx.globalCompositeOperation = 'screen';
    dctx.imageSmoothingEnabled = true; dctx.globalAlpha = clamp(0.75 * rig.glowBoost, 0, 1); dctx.drawImage(eb, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = clamp(0.55 * rig.glowBoost, 0, 1); dctx.imageSmoothingEnabled = false; dctx.drawImage(ec, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = 1; dctx.globalCompositeOperation = 'source-over'; drawCalls += 2;
    if (flashAlpha > 0.01) { dctx.fillStyle = `rgba(${fx.flashRGB}, ${flashAlpha})`; dctx.fillRect(0, 0, cv.width, cv.height); }

    const cpuMs = performance.now() - tCpu0;
    cpuMsSmooth = cpuMsSmooth * 0.88 + cpuMs * 0.12;
    statTimer += dt;
    if (statTimer >= 0.25) {
      statTimer = 0;
      const hitRate = (cacheHits + cacheMisses) ? Math.round(cacheHits * 100 / (cacheHits + cacheMisses)) : 100;
      $('stats').innerHTML =
        `<span>建模 <b>${buildMs}ms</b></span>` +
        (skinMs > 0 ? `<span>换色 <b>${skinMs}ms</b></span>` : '') +
        `<span>帧率 <b>${fpsVal}fps</b></span>` +
        `<span>单帧 <b>${cpuMsSmooth.toFixed(1)}ms</b></span>` +
        `<span>绘制 <b>${drawCalls}次</b></span>` +
        `<span>色表 <b>${PAL_KEYS.length}色</b></span>` +
        (mode === 'cached' ? `<span>缓存 <b>${spriteCache.size}</b> (${hitRate}%)</span>` : '');
    }
    requestAnimationFrame(tick);
  }

  const $ = id => document.getElementById(id);
  function syncUI() {
    $('formBadge').textContent = form === 'young' ? '幼年形态' : '成年形态';
    $('btnYoung').classList.toggle('on', form === 'young');
    $('btnAdult').classList.toggle('on', form === 'adult');
    $('skillLabel').textContent = form === 'young' ? '幼年技能（快捷键 1~4）' : '成年技能（快捷键 1~5）';
    const sb = $('skinBar'); sb.innerHTML = '';
    SKINS.forEach((sk, idx) => {
      const btn = document.createElement('button'); btn.className = idx === skinIdx ? 'on' : '';
      btn.innerHTML = `<span class="swatch" style="background:${sk.dot}"></span>${sk.name}`;
      btn.onclick = () => applySkin(idx, true); sb.appendChild(btn);
    });
    const kb = $('skillBar'); kb.innerHTML = '';
    SKILLS[form].forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.className = 'skill-btn' + (activeAction && activeAction.id === sk.id ? ' active' : '');
      btn.textContent = `${idx + 1}. ${sk.name}`; btn.onclick = () => startSkill(idx); kb.appendChild(btn);
    });
    $('btnHover').classList.toggle('on', !activeAction && baseMode === 'hover');
    $('btnSoar').classList.toggle('on', !activeAction && baseMode === 'soar');
    $('btnSpin').classList.toggle('on', autoSpin);
    $('btnOutline').classList.toggle('on', useOutline);
    $('btnMode').textContent = '模式：' + MODE_LABEL[MODES[modeIdx]];
    $('btnMode').classList.toggle('on', MODES[modeIdx] === 'cached');
  }

  $('btnYoung').onclick = () => { activeAction = null; form = 'young'; syncUI(); showBanner('切换至幼年飞龙', 1.1); };
  $('btnAdult').onclick = () => { activeAction = null; form = 'adult'; syncUI(); showBanner('切换至成年飞龙', 1.1); };
  $('btnTransform').onclick = () => startTransform();
  $('btnHover').onclick = () => { activeAction = null; baseMode = 'hover'; syncUI(); showBanner('高空生态 · 空中悬停吐息', 1.1); };
  $('btnSoar').onclick  = () => { activeAction = null; baseMode = 'soar';  syncUI(); showBanner('高空生态 · 盘旋翱翔巡航', 1.2); };
  $('btnSpin').onclick = () => { autoSpin = !autoSpin; syncUI(); };
  $('btnOutline').onclick = () => { useOutline = !useOutline; syncUI(); };
  $('btnMode').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; fit(); syncUI(); };
  $('btnReset').onclick = () => {
    thTarget = 0.62;
    th = thTarget + (((th - thTarget + Math.PI) % TAU + TAU) % TAU - Math.PI);
    zoom = 0; autoSpin = false; baseMode = 'hover'; activeAction = null; fit(); syncUI();
  };
  $('btnExport').onclick = () => {
    const asset = form === 'young' ? parts.yHead : parts.aHead;
    const a = document.createElement('a');
    a.download = `feilong_${form}_${curSkin.id}_head_${asset.w}x${asset.d}x${asset.h}.png`;
    a.href = asset.strip.toDataURL('image/png'); a.click();
  };

  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, th }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (drag) { th = thTarget = drag.th + (e.clientX - drag.x) * 0.01; } });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => { zoom = clamp(zoom + (e.deltaY > 0 ? -1 : 1), -2, 5); fit(); e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'q' || e.key === 'Q') thTarget -= Math.PI / 4;
    if (e.key === 'e' || e.key === 'E') thTarget += Math.PI / 4;
    if (e.key === 'c' || e.key === 'C') applySkin(skinIdx + 1, true);
    if (e.key === 't' || e.key === 'T') startTransform();
    if (e.key === 's' || e.key === 'S') {
      activeAction = null; baseMode = baseMode === 'soar' ? 'hover' : 'soar'; syncUI();
      showBanner(baseMode === 'soar' ? '高空生态 · 盘旋翱翔巡航' : '高空生态 · 空中悬停吐息', 1.2);
    }
    if (e.key >= '1' && e.key <= '5') startSkill(Number(e.key) - 1);
  });
  window.addEventListener('resize', fit);

  window.__FEILONG_DEBUG__ = {
    getStats: () => ({
      buildMs: Number(buildMs), skinMs, skin: curSkin.id, form, baseMode,
      fps: fpsVal, cpuMs: Number(cpuMsSmooth.toFixed(2)),
      cacheSize: spriteCache.size, cacheHits, cacheMisses,
      th, zoom, mode: MODES[modeIdx], paletteCount: PAL_KEYS.length,
      activeAction: activeAction ? activeAction.id : null
    }),
    setAngle: a => { th = thTarget = a; },
    setForm: f => { activeAction = null; form = f; syncUI(); },
    setBaseMode: m => { activeAction = null; baseMode = m; syncUI(); },
    setSkin: idOrIdx => { const idx = typeof idOrIdx === 'number' ? idOrIdx : SKINS.findIndex(s => s.id === idOrIdx); if (idx >= 0) applySkin(idx, false); },
    cycleSkin: () => applySkin(skinIdx + 1, true),
    getSkin: () => curSkin.id,
    triggerTransform: () => startTransform(),
    triggerSkill: i => startSkill(i),
    setAutoSpin: v => { autoSpin = v; syncUI(); },
    setZoom: z => { zoom = clamp(z, -2, 5); fit(); }
  };

  fit(); syncUI(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
