// === FAIRY_VOXEL_CORE_START ===

/*
===============================================================================
第 0 步：林间妖精轻盈振翅骨骼架构 & 模块化部件空间坐标预算表（正面 +Y）
===============================================================================
核心升级（v3 轻盈振翅飞行型 + actorBuf 整体外轮廓）：
1. 【14 个轻量模块化部件（总建模 < 20ms）+ 四片蝶翼严格锁枢轴】：
   - legs（悬空微曲双腿与精灵小鞋）、skirt（6 瓣立体分层花瓣裙）、

     hairNodeL / hairNodeS（飘荡发丝链）、armL / armR（独立舒展双臂）、
     staffHold / staffCast（弯头花枝法杖 + 自亮花苞核 0 遮挡）、
     wingUL / wingUR / wingLL / wingLR（上对大蝶翅 + 下对小蝶翅，各自枢轴锁死后背 ±2.0,-2.0，
     高频 8 字微振 + 上下翅相位滞后，360° 0 脱节 0 挤捏缝！）。
2. 【真实蜂鸟/蝶翼穿梭双生态】：
   - 花丛悬停轻舞：四翼高频微振 + 纤细身躯与双腿轻盈垂摆 + 长发链随风起伏 + 偶发挥杖洒花粉；
   - 花间穿梭巡飞 (S)：前倾轻盈穿梭姿态 + 8 字形高低穿飞轨道 + 「急停悬停赏花 → 灵巧加速穿飞」
     的真实昆虫/蜂鸟节奏 + 身后拉出柔和花粉飘带！
3. 【actorBuf(240×240) 整体 1px 外轮廓】：内部浑然一体零拼装黑线，120fps 满帧。
===============================================================================
*/

// ---------------------------------------------------------------------------
// 1. 统一调色板（45 色，严格 ≤ 48 色，零重色，自亮 3 色物理隔离）

const PAL_KEYS = Object.keys(PAL);
const KEY_TO_ID = Object.create(null);

const GLOW_KEY_SET = new Set(['emissiveMid', 'emissiveHot', 'emissiveCore']);
const GLOW_ID_SET = new Set();

for (let i = 0; i < PAL_KEYS.length; i++) {
  const k = PAL_KEYS[i];
  const id = i + 1;
  KEY_TO_ID[k] = id;
  ID_TO_KEY[id] = k;
  const n = parseInt(PAL[k].slice(1), 16);
  ID_TO_RGBA[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
  if (GLOW_KEY_SET.has(k)) GLOW_ID_SET.add(id);
}

// ---------------------------------------------------------------------------
// 1b. 4 套四季色系（完整保留原版 4 色系 + 全技能特效联动）
// ---------------------------------------------------------------------------

    pal: {
      hairDark:     '#788ea3', hairMid:     '#b5cce0', hairHi:     '#e6f2fc',
      dressDark:    '#2b6b94', dressMid:    '#62b3db', dressHi:    '#bce8fc',
      petalDark:    '#488cb5', petalMid:    '#8ad4f2', petalHi:    '#def7ff',
      wingDark:     '#429cb8', wingMid:     '#8ce0f5', wingHi:     '#d9fbff',
      wingTrimDark: '#1c5a82', wingTrimMid: '#48b8e8', wingTrimHi: '#a6edff',
      eyeIris:      '#2ba8e6',
      emissiveMid:  '#2cc4ff', emissiveHot: '#8ff0ff', emissiveCore: '#f0feff'
    },

      dressDark:    '#9c3b16', dressMid:    '#e07628', dressHi:    '#f7ba52',
      petalDark:    '#b52d1c', petalMid:    '#e85c2c', petalHi:    '#ffaa4c',
      wingDark:     '#b06c24', wingMid:     '#ebb04c', wingHi:     '#ffdf8c',

function buildRgbaTable(skin) {
  const tbl = ID_TO_RGBA.slice();
  if (skin && skin.pal) {
    for (const k in skin.pal) {
      const id = KEY_TO_ID[k];
      if (!id) continue;
      const n = parseInt(skin.pal[k].slice(1), 16);
      tbl[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
    }
  }
  return tbl;
}

function recolorAsset(asset, rgbaTable) {
  const { w, d, h, grid, activeLayers, glowLayers, glowSlot, strip, glowStrip, sim, eim } = asset;
  const stripW = w * h, glowW = w * glowLayers.length;
  const sData = sim.data, eData = eim ? eim.data : null;
  for (let li = 0; li < activeLayers.length; li++) {
    const z = activeLayers[li], gxOff = z * w, gSlot = glowSlot[z], zBase = z * d * w;
    for (let y = 0; y < d; y++) {
      const row = zBase + y * w, sRow = y * stripW + gxOff;
      const eRow = gSlot >= 0 ? (y * glowW + gSlot * w) : -1;
      for (let x = 0; x < w; x++) {
        const id = grid[row + x];
        if (!id) continue;
        const rgba = rgbaTable[id];
        const si = (sRow + x) * 4;
        sData[si] = rgba[0]; sData[si + 1] = rgba[1]; sData[si + 2] = rgba[2]; sData[si + 3] = 255;
        if (eData && eRow >= 0 && GLOW_ID_SET.has(id)) {
          const ei = (eRow + x) * 4;
          eData[ei] = rgba[0]; eData[ei + 1] = rgba[1]; eData[ei + 2] = rgba[2]; eData[ei + 3] = 255;
        }
      }
    }
  }
  strip.getContext('2d').putImageData(sim, 0, 0);
  if (glowStrip && eim) glowStrip.getContext('2d').putImageData(eim, 0, 0);
}

const PART_NAMES = [
  'none',
  'leg', 'shoe', 'skirtInner', 'skirtPetal', 'sash', 'torso', 'arm',
  'head', 'ear', 'hair', 'flowerCrown', 'eye',
  'wingUpper', 'wingLower', 'wingTrim',
  'staff', 'staffLeaf', 'staffCore',
  'dummyBase', 'dummyPost', 'dummyIron', 'dummyBoard'
];
const PART_ID = Object.create(null);
for (let i = 0; i < PART_NAMES.length; i++) PART_ID[PART_NAMES[i]] = i;

const NUM_PARTS = PART_NAMES.length;
const NO_CREASE_LUT = new Uint8Array(NUM_PARTS * NUM_PARTS);
for (const [a, b] of [
  ['eye', 'head'], ['ear', 'head'], ['head', 'torso'],
  ['leg', 'shoe'], ['skirtInner', 'skirtPetal'], ['skirtPetal', 'sash'],
  ['wingUpper', 'wingTrim'], ['wingLower', 'wingTrim'],
  ['staff', 'staffLeaf'], ['staff', 'staffCore'], ['staffLeaf', 'staffCore'],
  ['hair', 'flowerCrown'], ['dummyPost', 'dummyIron']
]) {
  const ia = PART_ID[a], ib = PART_ID[b];
  NO_CREASE_LUT[ia * NUM_PARTS + ib] = 1;
  NO_CREASE_LUT[ib * NUM_PARTS + ia] = 1;
}

const MATERIAL_KEYS = [null, 'skin', 'hair', 'dress', 'petal', 'wing', 'wingTrim', 'staff', 'stone', 'wood', 'iron'];
const MAT_ID = Object.create(null);
for (let i = 1; i < MATERIAL_KEYS.length; i++) MAT_ID[MATERIAL_KEYS[i]] = i;
const MAT_BASE = 128;
const mat = name => MAT_BASE + MAT_ID[name];

const RAMPS_BY_MAT = {
  [MAT_ID.skin]:     [KEY_TO_ID.skinDark,     KEY_TO_ID.skinMid,     KEY_TO_ID.skinHi],
  [MAT_ID.hair]:     [KEY_TO_ID.hairDark,     KEY_TO_ID.hairMid,     KEY_TO_ID.hairHi],
  [MAT_ID.dress]:    [KEY_TO_ID.dressDark,    KEY_TO_ID.dressMid,    KEY_TO_ID.dressHi],
  [MAT_ID.petal]:    [KEY_TO_ID.petalDark,    KEY_TO_ID.petalMid,    KEY_TO_ID.petalHi],
  [MAT_ID.wing]:     [KEY_TO_ID.wingDark,     KEY_TO_ID.wingMid,     KEY_TO_ID.wingHi],
  [MAT_ID.wingTrim]: [KEY_TO_ID.wingTrimDark, KEY_TO_ID.wingTrimMid, KEY_TO_ID.wingTrimHi],
  [MAT_ID.staff]:    [KEY_TO_ID.staffDark,    KEY_TO_ID.staffMid,    KEY_TO_ID.staffHi],
  [MAT_ID.stone]:    [KEY_TO_ID.stoneDark,    KEY_TO_ID.stoneMid,    KEY_TO_ID.stoneHi],
  [MAT_ID.wood]:     [KEY_TO_ID.woodDark,     KEY_TO_ID.woodMid,     KEY_TO_ID.woodHi],
  [MAT_ID.iron]:     [KEY_TO_ID.ironDark,     KEY_TO_ID.ironMid,     KEY_TO_ID.ironHi]
};

// ---------------------------------------------------------------------------
// 2. 数学原语与周期噪声
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const smin = (a, b, k) => {
  const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
  return lerp(b, a, h) - k * h * (1 - h);
};
function localToWorldXY(rx, ry, yaw, lx, ly) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  return [rx + cy * lx - sy * ly, ry + sy * lx + cy * ly];
}
function relaxChain(chain, segLen) {
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 1; i < chain.length; i++) {
      const a = chain[i - 1], b = chain[i];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const d = Math.hypot(dx, dy, dz) || 0.001;
      const diff = (d - segLen) / d;
      b.x -= dx * diff; b.y -= dy * diff; b.z -= dz * diff;
    }
  }
}
function hash2i(ix, iy, seed) {
  let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function periodicNoise2(x, y, periodX, periodY, cell, seed) {
  const gx = x / cell, gy = y / cell;
  const px = Math.max(1, Math.round(periodX / cell));
  const py = Math.max(1, Math.round(periodY / cell));
  const ix = Math.floor(gx), iy = Math.floor(gy);
  const fx = gx - ix, fy = gy - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const wMod = (v, m) => ((v % m) + m) % m;
  const x0 = wMod(ix, px), x1 = wMod(ix + 1, px);
  const y0 = wMod(iy, py), y1 = wMod(iy + 1, py);
  return lerp(
    lerp(hash2i(x0, y0, seed), hash2i(x1, y0, seed), ux),
    lerp(hash2i(x0, y1, seed), hash2i(x1, y1, seed), ux),
    uy
  );
}

// 3. 高性能体素网格
// ---------------------------------------------------------------------------
class VoxelModel {
  constructor(w, d, h) {
    this.w = w; this.d = d; this.h = h;
    const len = w * d * h;
    this.grid = new Uint8Array(len);
    this.parts = new Uint8Array(len);
  }
  idx(x, y, z) { return (z * this.d + y) * this.w + x; }
  inB(x, y, z) { return x >= 0 && y >= 0 && z >= 0 && x < this.w && y < this.d && z < this.h; }
  getId(x, y, z) { return this.inB(x, y, z) ? this.grid[this.idx(x, y, z)] : 0; }
  getPartId(x, y, z) { return this.inB(x, y, z) ? this.parts[this.idx(x, y, z)] : 0; }
  setRaw(x, y, z, val, partId) {
    if (!this.inB(x, y, z)) return;
    const i = this.idx(x, y, z);
    this.grid[i] = val; this.parts[i] = partId;
  }
  fillAABB(X0, X1, Y0, Y1, Z0, Z1, fn) {
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(X0 + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(X1 + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Y0 + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Y1 + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Z0),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Z1),       0, this.h - 1);
    for (let z = z0; z <= z1; z++) {
      for (let y = y0; y <= y1; y++) {
        const Y = y - hd;
        for (let x = x0; x <= x1; x++) fn(x, y, z, x - hw, Y);
      }
    }
  }
  paintCapsule(ax, ay, az, bx, by, bz, r0, r1, val, partId, overwrite = true) {
    const pad = Math.max(r0, r1) + 0.6;
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(Math.min(ax, bx) - pad + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(Math.max(ax, bx) + pad + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Math.min(ay, by) - pad + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Math.max(ay, by) + pad + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Math.min(az, bz) - pad),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Math.max(az, bz) + pad),       0, this.h - 1);
    const abx = bx - ax, aby = by - ay, abz = bz - az;
    const invDen = 1 / (abx * abx + aby * aby + abz * abz || 1);
    const dr = r1 - r0;
    const { w, d, grid, parts } = this;
    for (let z = z0; z <= z1; z++) {
      const apz = z - az, zOff = z * d * w;
      for (let y = y0; y <= y1; y++) {
        const apy = (y - hd) - ay, row = zOff + y * w, dotYZ = apy * aby + apz * abz;
        for (let x = x0; x <= x1; x++) {
          const i = row + x;
          if (!overwrite && grid[i]) continue;
          const apx = (x - hw) - ax;
          let t = (apx * abx + dotYZ) * invDen;
          if (t < 0) t = 0; else if (t > 1) t = 1;
          const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
          const r = r0 + dr * t;
          if (dx * dx + dy * dy + dz * dz <= r * r) { grid[i] = val; parts[i] = partId; }
        }
      }
    }
  }
  paintEllipsoid(cx, cy, cz, rx, ry, rz, val, partId, overwrite = true) {
    this.fillAABB(cx - rx - 0.5, cx + rx + 0.5, cy - ry - 0.5, cy + ry + 0.5, cz - rz - 0.5, cz + rz + 0.5, (x, y, z, X, Y) => {
      const i = this.idx(x, y, z);
      if (!overwrite && this.grid[i]) return;
      const dx = (X - cx) / rx, dy = (Y - cy) / ry, dz = (z - cz) / rz;
      if (dx * dx + dy * dy + dz * dz <= 1.0) { this.grid[i] = val; this.parts[i] = partId; }
    });
  }
  paintButterflyWing(opts) {
    const { side, rootX, rootY, rootZ, lenX, sweepY, liftZ, heightTop, heightBot, halfThick, partId, trimPartId } = opts;
    const ux = side * Math.cos(sweepY) * Math.cos(liftZ);
    const uy = -Math.sin(sweepY) * Math.cos(liftZ);
    const uz = Math.sin(liftZ);
    const vx = 0, vy = -Math.sin(liftZ) * 0.35, vz = Math.cos(liftZ);
    const vLen = Math.hypot(vx, vy, vz) || 1;
    const bx = vx / vLen, by = vy / vLen, bz = vz / vLen;
    const nx = uy * bz - uz * by, ny = uz * bx - ux * bz, nz = ux * by - uy * bx;
    const nLen = Math.hypot(nx, ny, nz) || 1;
    const fnx = nx / nLen, fny = ny / nLen, fnz = nz / nLen;
    const invLen = 1 / lenX;
    const matWing = mat('wing'), matTrim = mat('wingTrim');
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const { w, d, h, grid, parts } = this;

    for (let z = 0; z < h; z++) {
      const dz = z - rootZ, zOff = z * d * w;
      const dzu = dz * uz, dzb = dz * bz, dzn = dz * fnz;
      for (let y = 0; y < d; y++) {
        const dy = (y - hd) - rootY, row = zOff + y * w;
        const dyu = dzu + dy * uy, dyb = dzb + dy * by, dyn = dzn + dy * fny;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          if (grid[i]) continue;
          const dx = (x - hw) - rootX;
          if (Math.abs(dyn + dx * fnx) > halfThick) continue;
          const uRaw = dyu + dx * ux;
          if (uRaw < -0.4 || uRaw > lenX) continue;
          const u = uRaw <= 0 ? 0 : uRaw * invLen;
          const env = 4 * u * (1 - u * 0.88);
          const envS = env > 0 ? Math.sqrt(env) : 0;
          const topLim = 1.55 + (heightTop - 1.55) * envS;
          const botLim = 1.45 + (heightBot - 1.45) * envS;
          const vRaw = dyb + dx * bx;
          if (vRaw > topLim || vRaw < -botLim) continue;
          const isTrim = u > 0.18 && ((topLim - vRaw) < 1.05 || (vRaw + botLim) < 0.95 || u > 0.85);
          grid[i] = isTrim ? matTrim : matWing;
          parts[i] = isTrim ? trimPartId : partId;
        }
      }
    }
  }
  despeckle() {
    const src = this.grid.slice(), prt = this.parts;
    const { w, d, h } = this;
    const wd = w * d;
    const pEye = PART_ID.eye, pCore = PART_ID.staffCore;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          if (!src[i]) continue;
          const p = prt[i];
          if (p === pEye || p === pCore) continue;
          if ((x + 1 < w && src[i + 1]) || (x > 0 && src[i - 1]) ||
              (y + 1 < d && src[i + w]) || (y > 0 && src[i - w]) ||
              (z + 1 < h && src[i + wd]) || (z > 0 && src[i - wd])) continue;
          this.grid[i] = 0; this.parts[i] = 0;
        }
      }
    }
  }
  applyArtShading(keepSoftBottom = false) {
    const { w, d, h } = this;
    const wd = w * d;
    const src = this.grid.slice(), prt = this.parts;
    const pMinZ = new Int16Array(NUM_PARTS).fill(999);
    const pMaxZ = new Int16Array(NUM_PARTS).fill(-1);
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let i = zOff, end = zOff + wd; i < end; i++) {
        const p = prt[i];
        if (p) { if (z < pMinZ[p]) pMinZ[p] = z; if (z > pMaxZ[p]) pMaxZ[p] = z; }
      }
    }
    const headId = PART_ID.head, hairId = PART_ID.hair;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd, hasUp = z + 1 < h, hasDn = z > 0;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x, v = src[i];
          if (v < MAT_BASE) continue;
          const ramp = RAMPS_BY_MAT[v - MAT_BASE];
          if (!ramp) continue;
          const myP = prt[i], lutOff = myP * NUM_PARTS;
          const topEmpty = !hasUp || !src[i + wd];
          const botEmpty = hasDn && !src[i - wd];

          let crease = false, np;
          if (x + 1 < w && (np = prt[i + 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (x > 0 && (np = prt[i - 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y + 1 < d && (np = prt[i + w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y > 0 && (np = prt[i - w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (hasDn && (np = prt[i - wd]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;

          let upperOcc = 0;
          if (hasUp && !topEmpty) {
            const up = i + wd;
            for (let oy = -1; oy <= 1; oy++) {
              const yy = y + oy;
              if (yy < 0 || yy >= d) continue;
              const uRow = up + oy * w;
              for (let ox = -1; ox <= 1; ox++) {
                const xx = x + ox;
                if (xx >= 0 && xx < w && src[uRow + ox]) upperOcc++;
              }
            }
          }
          const span = Math.max(1, pMaxZ[myP] - pMinZ[myP]);
          const localZ = (z - pMinZ[myP]) / span;
          let idx = 1;
          if (botEmpty || (!keepSoftBottom && z <= 1)) idx = 0;
          else if (crease && !topEmpty) idx = 0;
          else if (upperOcc >= 8 && localZ < 0.45) idx = 0;
          else if (topEmpty) idx = (crease || upperOcc >= 8) ? 1 : 2;
          else if (span >= 14 && localZ < 0.14) idx = 0;
          else idx = 1;

          if ((myP === headId || myP === hairId) && idx === 2 && z < pMaxZ[myP] - 1) {
            const edge2d = (x + 1 >= w || !src[i + 1]) || (x === 0 || !src[i - 1]) ||
                           (y + 1 >= d || !src[i + w]) || (y === 0 || !src[i - w]);
            if (!edge2d) idx = 1;
          }
          this.grid[i] = ramp[clamp(idx, 0, ramp.length - 1)];
        }
      }
    }
  }
  toStripAsset(makeCanvas, meta = {}) {
    const { w, d, h } = this;
    const activeLayers = [], glowLayers = [];
    for (let z = 0; z < h; z++) {
      let hasPx = false, hasGlow = false;
      const zBase = z * d * w;
      for (let i = 0; i < d * w; i++) {
        const id = this.grid[zBase + i];
        if (!id) continue;
        hasPx = true;
        if (GLOW_ID_SET.has(id)) hasGlow = true;
      }
      if (hasPx) activeLayers.push(z);
      if (hasGlow) glowLayers.push(z);
    }
    const strip = makeCanvas(w * h, d);
    const sim = strip.getContext('2d').createImageData(w * h, d);
    const hasGlow = glowLayers.length > 0;
    const glowStrip = hasGlow ? makeCanvas(w * glowLayers.length, d) : null;
    const eim = glowStrip ? glowStrip.getContext('2d').createImageData(w * glowLayers.length, d) : null;
    const glowSlot = new Int16Array(h).fill(-1);
    for (let i = 0; i < glowLayers.length; i++) glowSlot[glowLayers[i]] = i;

    const foot = makeCanvas(w, d);
    const fg = foot.getContext('2d');
    const fim = fg.createImageData(w, d);
    for (let y = 0; y < d; y++) for (let x = 0; x < w; x++) {
      for (let z = 0; z < h; z++) {
        if (this.grid[(z * d + y) * w + x]) {
          const fi = (y * w + x) * 4;
          fim.data[fi] = 10; fim.data[fi + 1] = 18; fim.data[fi + 2] = 14; fim.data[fi + 3] = 255;
          break;
        }
      }
    }
    fg.putImageData(fim, 0, 0);

    const asset = {
      w, d, h, grid: this.grid,
      strip, glowStrip, sim, eim,
      glowSlot, activeLayers, glowLayers,
      footShadow: foot,
      meta: {
        footRadius: meta.footRadius || 6.5,
        headZ: meta.headZ || (activeLayers.length ? activeLayers[activeLayers.length - 1] + 2 : h),
        centerZ: meta.centerZ || Math.round(h * 0.5)
      }
    };
    recolorAsset(asset, ID_TO_RGBA);
    return asset;
  }
}

function buildFairyLegsPart() {
  const m = new VoxelModel(10, 10, 10);
  m.paintCapsule(-1.6, 0.2, 8.6, -2.0, 2.2, 5.0, 1.3, 1.1, mat('skin'), PART_ID.leg, true);
  m.paintCapsule(-2.0, 2.2, 5.0, -2.1, 0.8, 2.2, 1.1, 1.05, mat('skin'), PART_ID.leg, true);
  m.paintEllipsoid(-2.1, 1.2, 1.6, 1.25, 1.65, 1.05, mat('petal'), PART_ID.shoe, true);

  m.paintCapsule(1.6, 0.2, 8.6, 2.0, 2.5, 4.4, 1.3, 1.1, mat('skin'), PART_ID.leg, true);
  m.paintCapsule(2.0, 2.5, 4.4, 2.1, 1.0, 1.3, 1.1, 1.05, mat('skin'), PART_ID.leg, true);
  m.paintEllipsoid(2.1, 1.4, 0.85, 1.25, 1.65, 0.95, mat('petal'), PART_ID.shoe, true);
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

function buildFairySkirtPart() {
  const m = new VoxelModel(15, 15, 9);
  m.fillAABB(-6.6, 6.6, -6.6, 6.6, 0, 8, (x, y, z, X, Y) => {
    const r = Math.hypot(X, Y);
    const ang = Math.atan2(Y, X);
    const lobe = Math.cos(ang * 6);
    if (z >= 1 && z <= 7.2) {
      const t = clamp((7.2 - z) / 6.2, 0, 1);
      const rInner = lerp(2.4, 5.1, Math.pow(t, 0.85));
      const rOuter = lerp(2.6, 6.1, Math.pow(t, 0.82)) + (0.65 + t * 0.65) * Math.max(0, lobe);
      if (z >= 2.2 && r <= rOuter && r >= rInner - 1.1 && lobe > -0.15) {
        m.setRaw(x, y, z, mat('petal'), PART_ID.skirtPetal);
        return;
      }
      if (r <= rInner) m.setRaw(x, y, z, mat('dress'), PART_ID.skirtInner);
    }
  });
  m.paintEllipsoid(0, 0.1, 7.2, 3.0, 2.7, 1.1, mat('petal'), PART_ID.sash, true);
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

function buildFairyTorsoPart(dartMode = false) {
  const m = new VoxelModel(10, dartMode ? 14 : 10, 10);
  const pitch = dartMode ? 0.56 : 0.0;
  const cp = Math.cos(-pitch), sp = Math.sin(-pitch);
  m.fillAABB(-3.5, 3.5, -3.5, dartMode ? 6.5 : 3.5, 0, 9, (x, y, z, X, Y) => {
    const dy = Y, dz = z - 1.2;
    const ly = dy * cp + dz * sp;
    const lz = 1.2 - dy * sp + dz * cp;
    const dTorso = (Math.hypot(X / 2.75, (ly - 0.1) / 2.35, (lz - 3.9) / 2.9) - 1) * 2.6;
    const dNeck  = (Math.hypot(X / 1.45, (ly - 0.2) / 1.45, (lz - 6.8) / 1.5) - 1) * 1.4;
    if (smin(dTorso, dNeck, 0.9) <= 0) {
      m.setRaw(x, y, z, lz <= 5.2 ? mat('dress') : mat('skin'), PART_ID.torso);
    }
  });
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

function buildFairyHeadPart() {
  const W = 15, D = 14, H = 14;
  const m = new VoxelModel(W, D, H);
  const hz = 4.8, hy = 0.6;
  m.paintEllipsoid(0, hy, hz, 3.9, 3.9, 3.6, mat('skin'), PART_ID.head, true);
  for (const s of [-1, 1]) {
    m.paintCapsule(s * 3.6, hy - 0.5, hz - 0.2, s * 5.9, hy - 1.1, hz + 1.0, 1.12, 0.82, mat('skin'), PART_ID.ear, true);
  }
  // 柔和发髻、后发、侧发与抬高刘海（z ≥ hz + 2.6 且 Y ≤ hy + 2.8，0.6 俯视绝不压眼）
  m.fillAABB(-4.8, 4.8, -5.2, 4.4, 0, 13, (x, y, z, X, Y) => {
    const dBun = Math.hypot(X / 2.6, (Y + 1.8) / 2.5, (z - (hz + 5.0)) / 2.3);
    if (dBun <= 1.0) { m.setRaw(x, y, z, mat('hair'), PART_ID.hair); return; }
    const dCap = Math.hypot(X / 4.35, (Y - 0.3) / 4.35, (z - (hz + 0.3)) / 4.05);
    if (dCap <= 1.0) {
      if (Y <= 0.4 && z >= 1.6) { m.setRaw(x, y, z, mat('hair'), PART_ID.hair); return; }
      if (Math.abs(X) >= 3.15 && Y <= 2.2 && z >= 2.6) { m.setRaw(x, y, z, mat('hair'), PART_ID.hair); return; }
      if (z >= hz + 2.6 && Y <= 3.3) { m.setRaw(x, y, z, mat('hair'), PART_ID.hair); return; }
    }
    if (Math.hypot(X / 3.4, (Y + 2.8) / 1.6, (z - (hz - 3.0)) / 2.2) <= 1.0) m.setRaw(x, y, z, mat('hair'), PART_ID.hair);
  });
  // 头顶小花瓣发饰（Y ≤ 2.2，绝不压眼）
  m.paintEllipsoid(-2.2, 1.1, hz + 5.0, 1.5, 1.35, 1.25, mat('petal'), PART_ID.flowerCrown, true);
  m.paintEllipsoid(-0.4, 0.9, hz + 5.4, 1.25, 1.15, 1.05, mat('wingTrim'), PART_ID.flowerCrown, true);
  m.paintEllipsoid( 1.2, 0.6, hz + 5.0, 1.35, 1.1,  1.05, mat('dress'), PART_ID.flowerCrown, true);
  m.despeckle();
  m.applyArtShading(true);

  // 清晰大眼（0.6 俯视 0 遮挡）
  const eyeZ = Math.round(hz - 0.6);
  const hw = W * 0.5 - 0.5, hd = D * 0.5 - 0.5;
  for (const s of [-1, 1]) {
    const xIn = Math.round(hw + s * 1.5), xOut = Math.round(hw + s * 2.5);
    for (const ex of [xIn, xOut]) {
      let sy = -1;
      for (let y = D - 1; y >= Math.round(hd); y--) {
        if (m.getPartId(ex, y, eyeZ) === PART_ID.head) { sy = y; break; }
      }
      if (sy < 0) continue;
      for (const dz of [0, 1]) {
        const isOut = (ex === xOut);
        const kId = (dz === 1 && !isOut) ? KEY_TO_ID.eyeGlint : (dz === 1 ? KEY_TO_ID.eyeDark : KEY_TO_ID.eyeIris);
        m.setRaw(ex, sy, eyeZ + dz, kId, PART_ID.eye);
      }
    }
  }
  return m;
}

function buildFairyHairNode(radius) {
  const S = Math.ceil(radius * 2 + 3);
  const m = new VoxelModel(S, S, S);
  m.paintEllipsoid(0, 0, S * 0.5 - 0.5, radius, radius, radius, mat('hair'), PART_ID.hair, true);
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

function buildFairyArmPart(side) {
  const m = new VoxelModel(10, 10, 8);
  const s = side;
  m.paintCapsule(0, 0, 4.6, s * 2.1, 1.4, 3.2, 1.15, 1.05, mat('skin'), PART_ID.arm, true);
  m.paintCapsule(s * 2.1, 1.4, 3.2, s * 3.4, 3.5, 4.0, 1.05, 0.98, mat('skin'), PART_ID.arm, true);
  m.despeckle();
  m.applyArtShading(true);
  return m;
}

// 弯头花枝法杖（局部握柄在 (0, 0, 13)，顶端自亮花苞核 +Y/0.6 严格 0 遮挡）
function buildFairyStaffPart(castStyle = false) {
  const W = 12, D = castStyle ? 22 : 14, H = castStyle ? 26 : 30;
  const m = new VoxelModel(W, D, H);
  const tilt = castStyle ? 0.42 : 0.08;
  const mp = (lx, ly, lz) => [lx, ly + (lz - 12) * tilt, lz];
  const p0 = mp(0, 0, 1.5), p1 = mp(0, 0, 13.5), p2 = mp(0.9, 0.8, 21.5), p3 = mp(2.1, 1.6, 24.5), p4 = mp(3.4, 2.4, 25.4);

function buildTrainingDummy() {
  const m = new VoxelModel(16, 16, 30);
  const hw = 7.5, hd = 7.5;
  for (let z = 0; z < 30; z++) for (let y = 0; y < 16; y++) {
    const Y = y - hd;
    for (let x = 0; x < 16; x++) {
      const X = x - hw, r = Math.hypot(X, Y);
      if (z < 5 && r <= (z < 2 ? 5.2 : 3.8)) { m.setRaw(x, y, z, mat('stone'), PART_ID.dummyBase); continue; }
      if ((z === 8 || z === 22) && r <= 2.45) { m.setRaw(x, y, z, mat('iron'), PART_ID.dummyIron); continue; }
      if (z >= 5 && z <= 27 && r <= 2.05) { m.setRaw(x, y, z, mat('wood'), PART_ID.dummyPost); continue; }
      if (z === 28 && r <= 1.6) { m.setRaw(x, y, z, mat('iron'), PART_ID.dummyIron); continue; }
    }
  }
  m.fillAABB(-5.6, 5.6, -4.4, -1.6, 13, 25, (x, y, z, X, Y) => {
    const rd = Math.hypot(X, z - 19);
    if (rd <= 5.2 && Y >= -4.0 && Y <= -1.8) {

        const col = rd <= 1.6 ? KEY_TO_ID.targetRed : (rd <= 3.3 ? KEY_TO_ID.targetCream : KEY_TO_ID.targetRed);
        m.setRaw(x, y, z, col, PART_ID.dummyBoard);

  });
  m.despeckle();
  m.applyArtShading(false);
  return m;
}

function buildForestPlatform(makeCanvas, size = 196) {
  const base = makeCanvas(size, size);
  const bg = base.getContext('2d');
  const bim = bg.createImageData(size, size);
  const half = size * 0.5, rOuter = size * 0.478, rInner = size * 0.426;

  const flowers = [];
  for (let i = 0; i < 34; i++) {
    const ang = i * 2.39996, rad = 18 + (i % 7) * 9.2 + (i % 3) * 2.5;
    const fx = Math.round(half + Math.cos(ang) * rad), fy = Math.round(half + Math.sin(ang) * rad);
    if (Math.hypot(fx - half, fy - (half + 46)) < 11 || Math.hypot(fx - half, fy - half) > rInner - 5) continue;
    flowers.push({ x: fx, y: fy, key: i % 3 === 0 ? 'flowerPink' : (i % 3 === 1 ? 'flowerYellow' : 'flowerBlue') });
  }
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = x - half, dy = y - half, dist = Math.hypot(dx, dy);
    if (dist > rOuter) continue;
    const i = (y * size + x) * 4;
    let key;
    if (dist > rInner) {
      const ang = Math.atan2(dy, dx), segF = ((ang + Math.PI) / (Math.PI * 2)) * 24;
      const seam = Math.abs(segF - Math.round(segF)) < 0.08;
      key = (seam || dist > rOuter - 2.2 || dist < rInner + 1.8) ? 'stoneDeep' : ((Math.floor(segF) & 1) ? 'stoneMid' : 'stoneDark');
    } else {
      const v = periodicNoise2(x, y, 64, 64, 16, 29) * 0.62 + periodicNoise2(x + 11, y + 7, 32, 32, 8, 73) * 0.38;
      const onStone = (Math.abs(dist - 30) < 3.5 || (Math.abs(dx) < 8 && dy > -10 && dy < 44 && ((y + 2) % 12) < 7)) && v > 0.34;
      key = onStone ? (v > 0.64 ? 'stoneHi' : 'stoneMid') : (v > 0.62 ? 'mossHi' : (v < 0.36 ? 'mossDark' : 'mossMid'));
    }
    const rgba = ID_TO_RGBA[KEY_TO_ID[key]];
    bim.data[i] = rgba[0]; bim.data[i + 1] = rgba[1]; bim.data[i + 2] = rgba[2]; bim.data[i + 3] = 255;
  }
  for (const fl of flowers) {
    const rgba = ID_TO_RGBA[KEY_TO_ID[fl.key]], center = ID_TO_RGBA[KEY_TO_ID.targetCream];
    for (const [ox, oy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) {
      const px = fl.x + ox, py = fl.y + oy;
      if (px < 0 || py < 0 || px >= size || py >= size) continue;
      const c = (ox === 0 && oy === 0) ? center : rgba;
      const i = (py * size + px) * 4;
      bim.data[i] = c[0]; bim.data[i + 1] = c[1]; bim.data[i + 2] = c[2]; bim.data[i + 3] = 255;
    }
  }
  bg.putImageData(bim, 0, 0);
  return { size, base, rInner, rOuter };
}

    const halo = bgctx.createRadialGradient(bgc.width * 0.5, bgc.height * 0.44, 10, bgc.width * 0.5, bgc.height * 0.44, bgc.height * 0.52);
    halo.addColorStop(0, fx.skyHalo); halo.addColorStop(1, 'rgba(0,0,0,0)');
    bgctx.fillStyle = halo; bgctx.fillRect(0, 0, bgc.width, bgc.height);
  }

  function fit() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const cssW = window.innerWidth, cssH = window.innerHeight;
    cv.width = Math.floor(cssW * DPR); cv.height = Math.floor(cssH * DPR);
    const logicalScale = Math.max(2, Math.round(cssH / 136) + zoom);
    SCALE = Math.max(2, Math.round(logicalScale * DPR));

    const mode = MODES[modeIdx];
    if (mode === 'retro') { CW = Math.ceil(cv.width / SCALE); CH = Math.ceil(cv.height / SCALE); }
    else { CW = cv.width; CH = cv.height; }
    if (mode === 'cached') { mc.width = oc.width = 1; mc.height = oc.height = 1; }
    else { mc.width = oc.width = CW; mc.height = oc.height = CH; }
    EW = Math.max(1, Math.ceil(cv.width / 4)); EH = Math.max(1, Math.ceil(cv.height / 4));
    ec.width = eb.width = EW; ec.height = eb.height = EH;
    renderSkyCache();
  }

  function proj(x, y, z, sc) {
    const c = Math.cos(th), s = Math.sin(th);
    const rx = c * x - s * y, ry = s * x + c * y;
    const mode = MODES[modeIdx];
    const step = mode === 'retro' ? HS : (mode === 'cached' ? HS * sc : Math.max(1, Math.round(HS * sc)));
    return [CW / 2 + rx * sc, CH / 2 + 18 * sc + ry * TILT * sc - z * step, ry];
  }

  // 4. 120fps 妖精振翅与花间穿梭巡飞运动学
  function updateFairyRig(dt) {
    const fx = curSkin.fx;
    const kSlow = 1 - Math.exp(-dt * 9);
    const kFast = 1 - Math.exp(-dt * 16);

    // 四片蝶翼高频微振（上翅高频主拍，下翅滞后 0.55 rad 跟振）
    let wingFreq = 18.0;
    let tgtX = Math.sin(animTime * 1.9) * 1.3;
    let tgtY = Math.cos(animTime * 1.6) * 0.9;
    let tgtLift = BASE_LIFT + Math.sin(animTime * 4.2) * 1.5;
    let tgtYaw = Math.sin(animTime * 1.5) * 0.14;
    let tgtHeadYaw = Math.sin(animTime * 1.1) * 0.24;
    let tgtDart = false;
    const flour = (animTime % 4.5 > 3.0 && animTime % 4.5 < 4.2) ? Math.sin(((animTime % 4.5 - 3.0) / 1.2) * Math.PI) : 0;
    let tgtArmLYaw = Math.sin(animTime * 3.0) * 0.16 - flour * 0.35;
    let tgtArmLZ = Math.cos(animTime * 3.0) * 0.5 + flour * 1.8;
    let tgtArmRYaw = -Math.sin(animTime * 2.4) * 0.12 + flour * 0.28;
    let tgtArmRZ = Math.sin(animTime * 2.4) * 0.4 + flour * 1.6;
    let tgtStaffCast = false;
    let glowBoost = 1.0;
    rig.staffGlowPos = null;

    if (!activeSkill) {
      vineState = null;
      if (baseMode === 'dart') {
        // =========================================================================
        // 蜂鸟/蝶翼穿梭节奏：8 字形花间穿梭 + 急停赏花悬停 → 灵巧加速穿飞！
        // =========================================================================
        const beat = Math.sin(animTime * 1.55); // > -0.25 穿梭加速，<= -0.25 悬停赏花！
        const dartFactor = smoothstep(-0.25, 0.45, beat);
        dartPhase += dt * (0.14 + dartFactor * 0.92);
        wingFreq = 18.0 + dartFactor * 10.0;
        tgtDart = dartFactor > 0.35;

        // 优雅 8 字形轨道（避开靶桩与 HUD）
        const nextX = Math.sin(dartPhase) * 26.0;
        const nextY = Math.sin(dartPhase * 2.0) * 15.0 - 4.0;
        const vx = Math.cos(dartPhase) * 26.0;
        const vy = Math.cos(dartPhase * 2.0) * 30.0;
        tgtX = nextX; tgtY = nextY;
        tgtLift = 11.5 + Math.sin(dartPhase * 3.0) * 4.8 + dartFactor * 2.0;
        tgtYaw = Math.atan2(-vx, vy);
        tgtHeadYaw = Math.sin(animTime * 2.5) * 0.18;
        tgtArmLYaw = -0.28 * dartFactor; tgtArmLZ = 1.2 * dartFactor;
        tgtArmRYaw =  0.22 * dartFactor; tgtArmRZ = 0.8 * dartFactor;

        trailCd -= dt;
        if (trailCd <= 0) {
          trailCd = dartFactor > 0.3 ? 0.055 : 0.14;
          spawnParticle(rig.x + (Math.random() - 0.5) * 4, rig.y + (Math.random() - 0.5) * 4, rig.lift + 12 + Math.random() * 6,
            (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 4 + Math.random() * 6,
            0.55, 1.45, Math.random() < 0.5 ? fx.pollenA : fx.pollenB, true, 4);
        }
      } else if (flour > 0.4) {
        idleDustCd -= dt;
        if (idleDustCd <= 0) {
          idleDustCd = 0.14;
          const [sx, sy] = localToWorldXY(rig.x, rig.y, rig.yaw, 9.5, 7.5);
          spawnParticle(sx, sy, rig.lift + 27, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, 6 + Math.random() * 6,
            0.55, 1.5, Math.random() < 0.5 ? fx.pollenC : fx.pollenA, true, 8);
        }
      }
    } else {
      const act = activeSkill;
      act.t += dt;
      const t = act.t, st = act.state;
      wingFreq = 24.0;

      if (act.id === 'pollenScatter') {
        tgtDart = true;
        if (t < 0.25) {
          const p = smoothstep(0, 1, t / 0.25);
          tgtX = lerp(0, -14, p); tgtY = lerp(0, 12, p); tgtLift = lerp(BASE_LIFT, 15.5, p); tgtYaw = lerp(0, -0.45, p);
        } else if (t < 1.65) {
          const p = (t - 0.25) / 1.40, ang = lerp(Math.PI * 1.25, Math.PI * 0.15, smoothstep(0, 1, p));
          tgtX = DUMMY_POS.x + Math.cos(ang) * 26; tgtY = DUMMY_POS.y + Math.sin(ang) * 26 - 8;
          tgtLift = 15.5 + Math.sin(p * Math.PI * 3) * 2.2;
          tgtYaw = Math.atan2(DUMMY_POS.x - tgtX, DUMMY_POS.y - tgtY);
          glowBoost = 1.6;
          st.dropCd = (st.dropCd || 0) - dt;
          if (st.dropCd <= 0) {
            st.dropCd = 0.13;
            const col = ((st.dropCount = (st.dropCount || 0) + 1) % 3 === 0) ? fx.pollenC : (st.dropCount % 2 ? fx.pollenA : fx.pollenB);
            pollenOrbs.push({
              x: rig.x + (Math.random() - 0.5) * 4, y: rig.y + (Math.random() - 0.5) * 4, z: rig.lift + 8,
              vx: (DUMMY_POS.x - rig.x) * 0.45 + (Math.random() - 0.5) * 8,
              vy: (DUMMY_POS.y - rig.y) * 0.45 + (Math.random() - 0.5) * 8,
              vz: -6 - Math.random() * 4, color: col, t: 0
            });
          }
        } else {
          const p = smoothstep(0, 1, (t - 1.65) / (act.dur - 1.65));
          tgtX = lerp(DUMMY_POS.x + Math.cos(Math.PI * 0.15) * 26, 0, p);
          tgtY = lerp(DUMMY_POS.y + Math.sin(Math.PI * 0.15) * 26 - 8, 0, p);
          tgtLift = lerp(15.5, BASE_LIFT, p); tgtYaw = lerp(-1.2, 0, p);
        }
      } else if (act.id === 'staffVolley') {
        tgtYaw = 0; tgtHeadYaw = 0; tgtStaffCast = true;
        if (t < 0.55) {
          const p = t / 0.55;
          tgtX = Math.sin(p * TAU) * 2.6; tgtY = -p * 5.2; tgtLift = lerp(BASE_LIFT, 14.5, smoothstep(0, 1, p));
          tgtArmRZ = p * 2.6; tgtArmRYaw = p * 0.35; glowBoost = 1.2 + p * 1.4;
          const ca = p * TAU * 1.2;
          rig.staffGlowPos = { x: rig.x + 10.5 + Math.cos(ca) * 4.2, y: rig.y + 8.6 + Math.sin(ca) * 2.5, z: rig.lift + 27.5 + Math.sin(ca) * 3.8 };
          if (Math.random() < 0.85) spawnParticle(rig.staffGlowPos.x, rig.staffGlowPos.y, rig.staffGlowPos.z, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 4, 0.35, 1.8, Math.random() < 0.5 ? fx.boltCore : fx.boltMid, true, 0);
        } else if (t < 1.55) {
          const p = (t - 0.55) / 1.00;
          tgtY = lerp(-5.2, 1.5, Math.sin(p * Math.PI)); tgtLift = 14.5 + Math.sin(p * Math.PI * 4) * 1.1;
          tgtArmRZ = 2.4; tgtArmRYaw = 0.45; glowBoost = 2.0;
          st.fired = st.fired || 0;
          const fireTimes = [0.58, 0.78, 0.98, 1.18];
          while (st.fired < fireTimes.length && t >= fireTimes[st.fired]) {
            const idx = st.fired++, curveSide = (idx % 2 === 0 ? 1 : -1) * (16 + idx * 3);
            const sx = rig.x + 10.2, sy = rig.y + 10.5, sz = rig.lift + 26.5;
            homingBolts.push({
              sx, sy, sz, cx: (sx + DUMMY_POS.x) * 0.5 + curveSide, cy: (sy + DUMMY_POS.y) * 0.5 - 2, cz: 22 + (idx % 2) * 8,
              tx: DUMMY_POS.x + (idx - 1.5) * 1.8, ty: DUMMY_POS.y - 2.5, tz: 15 + (idx % 3) * 3.5, x: sx, y: sy, z: sz, t: 0, dur: 0.44
            });
          }
        } else {
          const p = smoothstep(0, 1, (t - 1.55) / (act.dur - 1.55));
          tgtLift = lerp(14.5, BASE_LIFT, p); tgtY = 0; tgtStaffCast = false;
        }
      } else if (act.id === 'vineBind') {
        tgtYaw = 0; tgtHeadYaw = 0; tgtStaffCast = t < 2.0;
        if (t < 0.45) {
          const p = smoothstep(0, 1, t / 0.45);
          tgtY = lerp(0, 4.5, p); tgtLift = lerp(BASE_LIFT, 8.2, p); tgtArmRZ = p * 2.2; glowBoost = 1.3 + p * 0.9;
          if (!st.warned) { st.warned = true; addGroundRipple('warn', DUMMY_POS.x, DUMMY_POS.y, 4, 15, 0.72, fx.warnRGB); }
        } else if (t < 1.80) {
          const p = (t - 0.45) / 1.35, grow = clamp(p / 0.35, 0, 1);
          tgtY = 4.5; tgtLift = 8.8 + Math.sin(p * Math.PI * 3) * 1.0; tgtArmRZ = 2.0; glowBoost = 1.7;
          vineState = { grow, phase: t * 5.2 };
          if (grow > 0.35) {
            dummyHit = Math.max(dummyHit, 0.75 + Math.sin(t * 28) * 0.35);
            if (Math.random() < 0.45) {
              const a = Math.random() * TAU;
              spawnParticle(DUMMY_POS.x + Math.cos(a) * 6, DUMMY_POS.y + Math.sin(a) * 6, 8 + Math.random() * 18,
                Math.cos(a) * 12, Math.sin(a) * 12, 8 + Math.random() * 10, 0.55, 1.7, Math.random() < 0.5 ? fx.vineLeaf : fx.vineMid, false, 24);
            }
          }
        } else if (t < 2.30) {
          const p = (t - 1.80) / 0.50;
          vineState = { grow: clamp(1 - p, 0, 1), phase: t * 5.2 };
          tgtY = lerp(4.5, 0, smoothstep(0, 1, p)); tgtLift = lerp(8.8, BASE_LIFT, smoothstep(0, 1, p));
        } else { vineState = null; tgtY = 0; tgtLift = BASE_LIFT; }
      } else if (act.id === 'healBreeze') {
        if (t < 0.30) {
          tgtLift = lerp(BASE_LIFT, 8.2, smoothstep(0, 1, t / 0.30));
        } else if (t < 1.85) {
          const p = (t - 0.30) / 1.55;
          tgtLift = lerp(8.2, 16.0, Math.sin(p * Math.PI));
          tgtYaw = smoothstep(0, 1, p) * TAU;
          tgtArmLZ = 2.8; tgtArmRZ = 2.8; glowBoost = 1.9;
          if (!st.rip1 && p > 0.06) { st.rip1 = true; addGroundRipple('ripple', 0, 0, 8, 72, 1.15, fx.rippleA); }
          if (!st.rip2 && p > 0.36) { st.rip2 = true; addGroundRipple('ripple', 0, 0, 8, 76, 1.25, fx.rippleB); dummyHit = Math.max(dummyHit, 0.35); }
          for (let k = 0; k < 2; k++) {
            const ang = t * 7.5 + k * Math.PI + Math.random() * 0.8, rad = 10 + Math.random() * 20, isCross = Math.random() < 0.55;
            spawnParticle(Math.cos(ang) * rad, Math.sin(ang) * rad, 3 + Math.random() * 8,
              -Math.sin(ang) * 10, Math.cos(ang) * 10, 18 + Math.random() * 14,
              0.95 + Math.random() * 0.45, isCross ? 2.2 : 1.9, isCross ? fx.crossColor : (k ? fx.petalA : fx.petalB), true, -4, isCross ? 'cross' : 'sq');
          }
        } else {
          tgtLift = lerp(10.5, BASE_LIFT, smoothstep(0, 1, (t - 1.85) / (act.dur - 1.85)));
        }
      }
      if (act.t >= act.dur) { activeSkill = null; vineState = null; syncUI(); }
    }

    rig.x = lerp(rig.x, tgtX, activeSkill || baseMode === 'dart' ? kFast : kSlow);
    rig.y = lerp(rig.y, tgtY, activeSkill || baseMode === 'dart' ? kFast : kSlow);
    rig.lift = lerp(rig.lift, tgtLift, kFast);
    if (activeSkill && activeSkill.id === 'healBreeze' && activeSkill.t >= 0.30 && activeSkill.t < 1.85) {
      rig.yaw = tgtYaw;
    } else {
      const dYaw = (((tgtYaw - rig.yaw + Math.PI) % TAU) + TAU) % TAU - Math.PI;
      rig.yaw += dYaw * kFast;
    }
    rig.dartPose = tgtDart;
    rig.headYaw = lerp(rig.headYaw, tgtHeadYaw, kFast);
    rig.armLYaw = lerp(rig.armLYaw, tgtArmLYaw, kFast);
    rig.armLZ   = lerp(rig.armLZ,   tgtArmLZ,   kFast);
    rig.armRYaw = lerp(rig.armRYaw, tgtArmRYaw, kFast);
    rig.armRZ   = lerp(rig.armRZ,   tgtArmRZ,   kFast);
    rig.staffCast = tgtStaffCast;
    rig.wingUpFlap = Math.sin(animTime * wingFreq) * 0.46;
    rig.wingLoFlap = Math.sin(animTime * wingFreq - 0.55) * 0.36;
    rig.glowBoost = glowBoost;

    // 飘动后发链实时求解
    const [hx, hy] = localToWorldXY(rig.x, rig.y, rig.yaw, 0, rig.dartPose ? 3.2 : 0);
    const [a0x, a0y] = localToWorldXY(hx, hy, rig.yaw + rig.headYaw, 0, -2.8);
    hairChain[0].x = a0x; hairChain[0].y = a0y; hairChain[0].z = rig.lift + 21.8;
    for (let j = 1; j < hairChain.length; j++) {
      const wSide = Math.sin(animTime * 4.2 - j * 0.9) * (1.2 + j * 0.8);
      const backPull = (rig.dartPose ? 4.2 : 2.2) * j;
      const [tx, ty] = localToWorldXY(a0x, a0y, rig.yaw + rig.headYaw, wSide, -backPull);
      const tz = rig.lift + 21.8 - j * (rig.dartPose ? 1.8 : 2.8);
      const kh = 1 - Math.exp(-dt * 12);
      hairChain[j].x = lerp(hairChain[j].x, tx, kh);
      hairChain[j].y = lerp(hairChain[j].y, ty, kh);
      hairChain[j].z = lerp(hairChain[j].z, tz, kh);
    }
    relaxChain(hairChain, 2.7);
  }

  function buildFairyPartList() {
    const list = [];
    const yw = rig.yaw, hYaw = yw + rig.headYaw;
    const isDart = rig.dartPose;

    // 1. 悬空双腿 + 花瓣裙
    const [lgX, lgY] = localToWorldXY(rig.x, rig.y, yw, 0, isDart ? -1.4 : 0);
    list.push({ id: 'legs',  m: parts.legs,  x: lgX, y: lgY, lift: 0, ro: yw + Math.sin(animTime * 3.0) * 0.08, bias: -0.3 });
    list.push({ id: 'skirt', m: parts.skirt, x: rig.x, y: rig.y, lift: 5.0, ro: yw + Math.sin(animTime * 3.4) * 0.06, bias: 0.1 });

    // 2. 纤细上身（常规/前倾穿梭双态）
    const tId = isDart ? 'torsoDart' : 'torso';
    list.push({ id: tId, m: parts[tId], x: rig.x, y: rig.y, lift: 11.2, ro: yw, bias: 0.2 });

    // 3. 头部 + 飘动发丝链
    const [hdX, hdY] = localToWorldXY(rig.x, rig.y, yw, 0, isDart ? 3.2 : 0.2);
    list.push({ id: 'head', m: parts.head, x: hdX, y: hdY, lift: isDart ? 16.6 : 17.6, ro: hYaw, bias: 0.45 });
    for (let j = 1; j < hairChain.length; j++) {
      const hn = hairChain[j], hid = j === 1 ? 'hairL' : 'hairS';
      list.push({ id: hid, m: parts[hid], x: hn.x, y: hn.y, lift: hn.z - rig.lift - 2.0, ro: hYaw, symDeg: 90, bias: -0.15 });
    }

    // 4. 左右臂 + 弯头花枝法杖（握柄锁在右手）
    const shY = isDart ? 1.8 : 0.2;
    const [lShX, lShY] = localToWorldXY(rig.x, rig.y, yw, -2.6, shY);
    const [rShX, rShY] = localToWorldXY(rig.x, rig.y, yw,  2.6, shY);
    const lArmY = yw + rig.armLYaw, rArmY = yw + rig.armRYaw;
    list.push({ id: 'armL', m: parts.armL, x: lShX, y: lShY, lift: 11.8 + rig.armLZ, ro: lArmY, bias: 0.2 });
    list.push({ id: 'armR', m: parts.armR, x: rShX, y: rShY, lift: 11.8 + rig.armRZ, ro: rArmY, bias: 0.2 });

    const [rHdX, rHdY] = localToWorldXY(rShX, rShY, rArmY, 3.4, 3.5);
    const stId = rig.staffCast ? 'staffCast' : 'staffHold';
    list.push({ id: stId, m: parts[stId], x: rHdX, y: rHdY, lift: 3.0 + rig.armRZ, ro: rArmY, bias: 0.35 });

    // 5. 四片蝶翅（翅根严格锁死在后背 ±2.0, -2.0 枢轴上！）
    const bkY = isDart ? -1.4 : -2.0;
    for (const s of [-1, 1]) {
      const [uShX, uShY] = localToWorldXY(rig.x, rig.y, yw, s * 2.0, bkY);
      const uYaw = yw - s * rig.wingUpFlap;
      const [uWx, uWy] = localToWorldXY(uShX, uShY, uYaw, s * FAIRY_UP_PIVOT.x, -FAIRY_UP_PIVOT.y);
      list.push({ id: s < 0 ? 'wingUL' : 'wingUR', m: parts[s < 0 ? 'wingUL' : 'wingUR'], x: uWx, y: uWy, lift: 11.2, ro: uYaw, bias: -0.25 });

      const [lShX2, lShY2] = localToWorldXY(rig.x, rig.y, yw, s * 1.8, bkY - 0.2);
      const lYaw = yw - s * rig.wingLoFlap;
      const [lWx, lWy] = localToWorldXY(lShX2, lShY2, lYaw, s * FAIRY_LO_PIVOT.x, -FAIRY_LO_PIVOT.y);
      list.push({ id: s < 0 ? 'wingLL' : 'wingLR', m: parts[s < 0 ? 'wingLL' : 'wingLR'], x: lWx, y: lWy, lift: 7.4, ro: lYaw, bias: -0.35 });
    }
    return list;
  }

  function composeFairyActor(partList, c, s, outlineHex) {
    arCtx.setTransform(1, 0, 0, 1, 0, 0); arCtx.globalCompositeOperation = 'source-over';
    arCtx.globalAlpha = 1; arCtx.imageSmoothingEnabled = false; arCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    agCtx.setTransform(1, 0, 0, 1, 0, 0); agCtx.globalCompositeOperation = 'source-over';
    agCtx.globalAlpha = 1; agCtx.imageSmoothingEnabled = false; agCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

    let calls = 0, hasAnyGlow = false;
    for (let i = 0; i < partList.length; i++) {
      const p = partList[i], dxW = p.x - rig.x, dyW = p.y - rig.y;
      const rx = c * dxW - s * dyW, ry = s * dxW + c * dyW;
      p._lx = ACTOR_AX + rx * BAKE_SCALE;
      p._ly = ACTOR_AY + ry * TILT * BAKE_SCALE - p.lift * BAKE_STEP;
      p._depth = ry + p.lift * 0.08 + (p.bias || 0);
    }
    partList.sort((a, b) => a._depth - b._depth);

    for (let i = 0; i < partList.length; i++) {
      const p = partList[i];
      const sp = getBakedSprite(p.m, p.id, p.ro + th, outlineHex, false, p.symDeg || 360);
      const dx = Math.round(p._lx - sp.anchorX), dy = Math.round(p._ly - sp.anchorY);
      arCtx.drawImage(sp.main, dx, dy); calls++;
      if (hasAnyGlow) { agCtx.globalCompositeOperation = 'destination-out'; agCtx.drawImage(sp.main, dx, dy); }
      if (sp.glow) { hasAnyGlow = true; agCtx.globalCompositeOperation = 'source-over'; agCtx.drawImage(sp.glow, dx, dy); calls++; }
    }
    agCtx.globalCompositeOperation = 'source-over';
    if (!useOutline) return { main: actorRaw, glow: hasAnyGlow ? actorGlow : null, calls };

    asCtx.setTransform(1, 0, 0, 1, 0, 0); asCtx.globalCompositeOperation = 'source-over'; asCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    asCtx.drawImage(actorRaw, 0, 0);
    asCtx.globalCompositeOperation = 'source-in'; asCtx.fillStyle = outlineHex; asCtx.fillRect(0, 0, ACTOR_W, ACTOR_H);

    aoCtx.setTransform(1, 0, 0, 1, 0, 0); aoCtx.globalCompositeOperation = 'source-over'; aoCtx.imageSmoothingEnabled = false;
    aoCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    aoCtx.drawImage(actorSil, -1, 0); aoCtx.drawImage(actorSil, 1, 0); aoCtx.drawImage(actorSil, 0, -1); aoCtx.drawImage(actorSil, 0, 1);
    aoCtx.drawImage(actorRaw, 0, 0);
    return { main: actorOut, glow: hasAnyGlow ? actorGlow : null, calls: calls + 5 };
  }

  function updateVFX(dt) {
    const fx = curSkin.fx;
    if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) document.getElementById('banner').classList.remove('show'); }
    dummyHit = Math.max(0, dummyHit - dt * 2.8);
    if (dummyPollenTimer > 0) {
      dummyPollenTimer -= dt;
      if (Math.random() < 0.38) {
        spawnParticle(DUMMY_POS.x + (Math.random() - 0.5) * 7, DUMMY_POS.y + (Math.random() - 0.5) * 7, 10 + Math.random() * 14,
          (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, -4 + Math.random() * 6, 0.65, 1.5, Math.random() < 0.5 ? fx.pollenA : fx.pollenB, true, 6);
      }
    }
    for (let i = pollenOrbs.length - 1; i >= 0; i--) {
      const po = pollenOrbs[i]; po.t += dt;
      po.x += po.vx * dt + Math.sin(po.t * 9 + i) * 6 * dt; po.y += po.vy * dt; po.z += po.vz * dt;
      po.vx *= 0.96; po.vy *= 0.96;
      const hitTarget = Math.hypot(po.x - DUMMY_POS.x, po.y - DUMMY_POS.y) < 9 && po.z < 22;
      if (po.z <= 1.2 || hitTarget || po.t > 1.8) {
        pollenOrbs.splice(i, 1);
        addGroundRipple('pollen', po.x, po.y, 4, 9, 2.8, fx.rippleA);
        if (Math.hypot(po.x - DUMMY_POS.x, po.y - DUMMY_POS.y) < 18) hitDummy(0.65, true);
        for (let k = 0; k < 10; k++) {
          const a = (k / 10) * TAU + Math.random() * 0.3, sp = 10 + Math.random() * 18;
          spawnParticle(po.x, po.y, Math.max(2, po.z), Math.cos(a) * sp, Math.sin(a) * sp, 8 + Math.random() * 14,
            0.48 + Math.random() * 0.25, 1.7, k % 3 === 0 ? fx.pollenC : (k % 2 ? fx.pollenA : fx.pollenB), true, 24);
        }
      }
    }
    for (let i = homingBolts.length - 1; i >= 0; i--) {
      const b = homingBolts[i]; b.t += dt;
      const u = clamp(b.t / b.dur, 0, 1), iu = 1 - u;
      b.x = iu * iu * b.sx + 2 * iu * u * b.cx + u * u * b.tx;
      b.y = iu * iu * b.sy + 2 * iu * u * b.cy + u * u * b.ty;
      b.z = iu * iu * b.sz + 2 * iu * u * b.cz + u * u * b.tz;
      spawnParticle(b.x, b.y, b.z, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, 2, 0.24, 1.7, Math.random() < 0.45 ? fx.boltCore : fx.boltMid, true, 0);
      if (u >= 1) {
        homingBolts.splice(i, 1); hitDummy(0.85, true);
        addRing(b.tx, b.ty, b.tz, 2, 11, 0.38, fx.boltMid, true);
        addRing(b.tx, b.ty, b.tz + 1, 1.5, 8.5, 0.32, fx.boltCore, true);
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.vz -= p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.z < 0.6) { p.z = 0.6; p.vz = Math.abs(p.vz) * 0.35; p.vx *= 0.7; p.vy *= 0.7; }
    }
    for (let i = groundRipples.length - 1; i >= 0; i--) { groundRipples[i].t += dt; if (groundRipples[i].t >= groundRipples[i].life) groundRipples.splice(i, 1); }
    for (let i = shockRings.length - 1; i >= 0; i--) { shockRings[i].t += dt; if (shockRings[i].t >= shockRings[i].life) shockRings.splice(i, 1); }
  }

  function drawStackRealtime(asset, x, y, zLift, ro, sc) {
    const [X, Y] = proj(x, y, zLift, sc);
    const a = ro + th, c = Math.cos(a), s = Math.sin(a), X0 = Math.round(X), Y0 = Math.round(Y);
    const isRetro = MODES[modeIdx] === 'retro', step = isRetro ? HS : Math.max(1, Math.round(HS * sc));
    const halfStep = (!isRetro && step > Math.floor(TILT * sc)) ? Math.max(1, Math.round(step * 0.5)) : 0;
    const { w, d, activeLayers, glowLayers, glowSlot, glowStrip, strip } = asset;
    const hasGlow = !!glowStrip && glowLayers.length > 0, minGlowZ = hasGlow ? glowLayers[0] : 9999;
    const eScaleX = EW / CW, eScaleY = EH / CH;
    let calls = 0;
    for (let li = 0; li < activeLayers.length; li++) {
      const z = activeLayers[li], yy = isRetro ? (Y0 - z * HS) : (Y0 - z * step), sx = z * w;
      if (halfStep) { mctx.setTransform(c * sc, TILT * s * sc, -s * sc, TILT * c * sc, X0, yy + halfStep); mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d); calls++; }
      mctx.setTransform(c * sc, TILT * s * sc, -s * sc, TILT * c * sc, X0, yy); mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d); calls++;
      if (!hasGlow || z >= minGlowZ) {
        ectx.globalCompositeOperation = 'destination-out';
        ectx.setTransform(c * sc * eScaleX, TILT * s * sc * eScaleY, -s * sc * eScaleX, TILT * c * sc * eScaleY, X0 * eScaleX, yy * eScaleY);
        ectx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      }
      if (hasGlow && glowSlot[z] >= 0) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(glowStrip, glowSlot[z] * w, 0, w, d, -w / 2, -d / 2, w, d); calls++; }
    }
    ectx.globalCompositeOperation = 'source-over';
    return calls;
  }

  let last = 0, fpsAcc = 0, fpsFrames = 0, fpsVal = 60, statTimer = 0, cpuMsSmooth = 1.0;

  function tick(ms) {
    const tCpu0 = performance.now();
    const t = ms / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
    animTime += dt; fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.4) { fpsVal = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }
    if (autoSpin && !drag) thTarget += dt * 0.55;
    if (!drag) th += (thTarget - th) * Math.min(1, dt * 8);

    updateFairyRig(dt);
    updateVFX(dt);

    const mode = MODES[modeIdx], sc = mode === 'retro' ? 1 : SCALE;
    const c = Math.cos(th), s = Math.sin(th), eScale = EW / cv.width, fx = curSkin.fx;
    let drawCalls = 0;

    const fairyParts = buildFairyPartList();
    const dummyShakeX = dummyHit > 0 ? Math.sin(animTime * 54) * dummyHit * 1.9 : 0;
    const dummyShakeY = dummyHit > 0 ? Math.cos(animTime * 46) * dummyHit * 1.3 : 0;
    const dummyObj = { id: 'dummy', m: dummyAsset, x: DUMMY_POS.x + dummyShakeX, y: DUMMY_POS.y + dummyShakeY, lift: 0, ro: 0 };

    const bSize = platform.size, halfB = bSize * 0.5;
    gbctx.setTransform(GROUND_SUPERSAMPLE, 0, 0, GROUND_SUPERSAMPLE, 0, 0);
    gbctx.globalCompositeOperation = 'source-over'; gbctx.imageSmoothingEnabled = false;
    gbctx.clearRect(0, 0, bSize, bSize); gbctx.drawImage(platform.base, 0, 0);

    gbctx.save(); gbctx.translate(halfB, halfB);
    gbctx.beginPath(); gbctx.arc(0, 0, platform.rInner, 0, TAU); gbctx.clip();

    for (const gr of groundRipples) {
      const u = clamp(gr.t / gr.life, 0, 1), fade = 1 - u;
      gbctx.save(); gbctx.translate(gr.x, gr.y);
      if (gr.type === 'ripple') {
        const rad = lerp(gr.r0, gr.r1, smoothstep(0, 1, u));
        gbctx.strokeStyle = `rgba(${gr.rgb}, ${fade * 0.85})`; gbctx.lineWidth = 2.8;
        gbctx.beginPath(); gbctx.arc(0, 0, rad, 0, TAU); gbctx.stroke();
      } else if (gr.type === 'warn') {
        gbctx.strokeStyle = `rgba(${gr.rgb}, ${0.9 * fade + 0.1})`; gbctx.lineWidth = 2.2;
        gbctx.beginPath(); gbctx.arc(0, 0, gr.r1, 0, TAU); gbctx.stroke();
        gbctx.fillStyle = `rgba(${gr.rgb}, ${0.28 * (1 - u * 0.5)})`;
        gbctx.beginPath(); gbctx.arc(0, 0, lerp(gr.r0, gr.r1, u), 0, TAU); gbctx.fill();
      } else if (gr.type === 'pollen') {
        gbctx.fillStyle = `rgba(${gr.rgb}, ${fade * 0.55})`;
        gbctx.fillRect(-gr.r0, -gr.r0 * 0.7, gr.r0 * 2, gr.r0 * 1.4);
      }
      gbctx.restore();
    }

    const lf = clamp(0.75 - rig.lift * 0.022, 0.24, 0.68);
    gbctx.fillStyle = `rgba(8, 18, 14, ${0.42 * lf})`;
    gbctx.beginPath(); gbctx.arc(rig.x + rig.lift * 0.14, rig.y - rig.lift * 0.14, 6.2 * (0.58 + 0.42 * lf), 0, TAU); gbctx.fill();

    gbctx.save(); gbctx.translate(dummyObj.x, dummyObj.y);
    gbctx.save(); gbctx.globalAlpha = 0.28; gbctx.translate(2.0, -2.0);
    gbctx.drawImage(dummyAsset.footShadow, -dummyAsset.w / 2, -dummyAsset.d / 2); gbctx.restore();
    gbctx.fillStyle = 'rgba(8, 18, 14, 0.44)';
    gbctx.beginPath(); gbctx.arc(0, 0, dummyAsset.meta.footRadius, 0, TAU); gbctx.fill();
    gbctx.restore(); gbctx.restore();

    ectx.setTransform(1, 0, 0, 1, 0, 0); ectx.globalCompositeOperation = 'source-over';
    ectx.imageSmoothingEnabled = false; ectx.clearRect(0, 0, EW, EH);
    dctx.setTransform(1, 0, 0, 1, 0, 0); dctx.globalCompositeOperation = 'source-over';
    dctx.imageSmoothingEnabled = false; dctx.drawImage(bgc, 0, 0); drawCalls++;

    dctx.setTransform(c * SCALE, TILT * s * SCALE, -s * SCALE, TILT * c * SCALE, cv.width / 2, cv.height / 2 + 18 * SCALE);
    dctx.drawImage(gbuf, -halfB, -halfB, bSize, bSize);
    dctx.setTransform(1, 0, 0, 1, 0, 0); drawCalls++;

    if (mode === 'cached') {
      const dispRatio = SCALE / BAKE_SCALE;
      const composed = composeFairyActor(fairyParts, c, s, curSkin.outline);
      drawCalls += composed.calls;
      const [sx, sy, sry] = proj(rig.x, rig.y, rig.lift, SCALE);
      const [dxP, dyP, dry] = proj(dummyObj.x, dummyObj.y, 0, SCALE);
      const dummySp = getBakedSprite(dummyAsset, 'dummy', th, curSkin.outline, useOutline, 360);
      ectx.setTransform(1, 0, 0, 1, 0, 0);

      for (const who of (sry < dry ? ['fairy', 'dummy'] : ['dummy', 'fairy'])) {
        if (who === 'fairy') {
          const dw = Math.round(ACTOR_W * dispRatio), dh = Math.round(ACTOR_H * dispRatio);
          const dx = Math.round(sx - ACTOR_AX * dispRatio), dy = Math.round(sy - ACTOR_AY * dispRatio);
          dctx.drawImage(composed.main, dx, dy, dw, dh); drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(composed.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
          if (composed.glow) { ectx.globalCompositeOperation = 'source-over'; ectx.drawImage(composed.glow, dx * eScale, dy * eScale, dw * eScale, dh * eScale); drawCalls++; }
        } else {
          const dw = Math.round(dummySp.bw * dispRatio), dh = Math.round(dummySp.bh * dispRatio);
          const dx = Math.round(dxP - dummySp.anchorX * dispRatio), dy = Math.round(dyP - dummySp.anchorY * dispRatio);
          dctx.drawImage(dummySp.main, dx, dy, dw, dh); drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(dummySp.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
        }
      }
      ectx.globalCompositeOperation = 'source-over';
    } else {
      mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'source-over';
      mctx.imageSmoothingEnabled = false; mctx.clearRect(0, 0, CW, CH);
      const allObjs = [...fairyParts.map(p => ({ ...p, lift: rig.lift + p.lift })), dummyObj];
      for (const o of allObjs) o._depth = proj(o.x, o.y, o.lift, sc)[2] + o.lift * 0.08 + (o.bias || 0);
      allObjs.sort((a, b) => a._depth - b._depth);
      for (const o of allObjs) drawCalls += drawStackRealtime(o.m, o.x, o.y, o.lift, o.ro, sc);
      const drawW = mode === 'retro' ? CW * SCALE : CW, drawH = mode === 'retro' ? CH * SCALE : CH;
      if (useOutline) {
        octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.clearRect(0, 0, CW, CH);
        octx.drawImage(mc, 0, 0); octx.globalCompositeOperation = 'source-in'; octx.fillStyle = curSkin.outline; octx.fillRect(0, 0, CW, CH);
        octx.globalCompositeOperation = 'source-over';
        const op = mode === 'retro' ? SCALE : Math.max(1, Math.round(SCALE * 0.30));
        for (const [ox, oy] of [[-op, 0], [op, 0], [0, -op], [0, op]]) dctx.drawImage(oc, ox, oy, drawW, drawH);
      }
      dctx.drawImage(mc, 0, 0, drawW, drawH);
    }

    const pSc = mode === 'retro' ? 1 : SCALE, toMain = mode === 'retro' ? SCALE : 1, toE = toMain * eScale;
    function drawVoxelBlock(wx, wy, wz, szVox, color, isGlow, shape = 'sq') {
      const [px, py] = proj(wx, wy, wz, pSc);
      const sx = Math.round(px * toMain), sy = Math.round(py * toMain), sPx = Math.max(2, Math.round(szVox * SCALE));
      dctx.fillStyle = color;
      if (shape === 'cross') {
        const arm = Math.max(2, Math.round(sPx * 0.45));
        dctx.fillRect(sx - (sPx >> 1), sy - (arm >> 1), sPx, arm);
        dctx.fillRect(sx - (arm >> 1), sy - (sPx >> 1), arm, sPx);
      } else dctx.fillRect(sx - (sPx >> 1), sy - (sPx >> 1), sPx, sPx);
      if (isGlow) {
        const es = Math.max(1, Math.round(sPx * eScale));
        ectx.fillStyle = color; ectx.fillRect(Math.round(px * toE) - (es >> 1), Math.round(py * toE) - (es >> 1), es, es);
      }
    }

    if (vineState && vineState.grow > 0.02) {
      const segCount = Math.max(2, Math.round(vineState.grow * 18)), vineBlocks = [];
      for (let v = 0; v < 3; v++) {
        const baseA = (v / 3) * TAU;
        for (let k = 0; k <= segCount; k++) {
          const u = k / 18, ang = baseA + u * Math.PI * 3.4 + Math.sin(vineState.phase + u * 4 + v) * 0.25;
          const rad = lerp(8.5, 5.2, u) + Math.sin(vineState.phase * 1.4 + k * 0.6) * 0.55;
          const vx = DUMMY_POS.x + dummyShakeX + Math.cos(ang) * rad, vy = DUMMY_POS.y + dummyShakeY + Math.sin(ang) * rad, vz = 1.5 + u * 25.5;
          const [, , ry] = proj(vx, vy, vz, pSc);
          vineBlocks.push({ x: vx, y: vy, z: vz, ry, sz: 2.35 - u * 0.5, col: (k & 1) ? fx.vineMid : fx.vineDark, glow: false });
          if (k > 1 && k % 3 === 0) vineBlocks.push({ x: vx + Math.cos(ang) * 2.2, y: vy + Math.sin(ang) * 2.2, z: vz + 0.6, ry: ry + 0.2, sz: 1.85, col: fx.vineLeaf, glow: true });
        }
      }
      vineBlocks.sort((a, b) => a.ry - b.ry);
      for (const vb of vineBlocks) drawVoxelBlock(vb.x, vb.y, vb.z, vb.sz, vb.col, vb.glow, 'sq');
    }
    if (rig.staffGlowPos) drawVoxelBlock(rig.staffGlowPos.x, rig.staffGlowPos.y, rig.staffGlowPos.z, 2.8, fx.boltCore, true, 'cross');
    for (const po of pollenOrbs) { drawVoxelBlock(po.x, po.y, po.z, 2.7, po.color, true, 'sq'); drawVoxelBlock(po.x, po.y, po.z + 0.5, 1.5, fx.pollenC, true, 'sq'); }
    for (const b of homingBolts) { drawVoxelBlock(b.x, b.y, b.z, 3.0, fx.boltOuter, false, 'sq'); drawVoxelBlock(b.x, b.y, b.z + 0.4, 2.2, fx.boltMid, true, 'sq'); drawVoxelBlock(b.x, b.y, b.z + 0.8, 1.4, fx.boltCore, true, 'sq'); }
    for (const rg of shockRings) {
      const u = clamp(rg.t / rg.life, 0, 1), rad = lerp(rg.r0, rg.r1, smoothstep(0, 1, u)), bSz = Math.max(1.2, (1 - u * 0.55) * 2.1);
      for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU + u * 1.4; drawVoxelBlock(rg.x + Math.cos(a) * rad, rg.y + Math.sin(a) * rad, rg.z + Math.sin(a * 3) * 1.2, bSz, rg.color, rg.glow, 'sq'); }
    }
    for (const p of particles) drawVoxelBlock(p.x, p.y, p.z, p.sz * (1 - (p.t / p.life) * 0.55), p.color, p.glow, p.shape);
    for (const am of ambientMotes) drawVoxelBlock(am.x + Math.sin(animTime * 1.3 + am.ph) * 6, am.y + Math.cos(animTime * 1.1 + am.ph) * 6, ((am.z + animTime * am.sp) % 40) + 3, 1.05, fx.moteColor, true, 'sq');

    ebctx.setTransform(1, 0, 0, 1, 0, 0); ebctx.clearRect(0, 0, EW, EH);
    ebctx.filter = `blur(${Math.max(1, Math.round(SCALE * 0.16))}px)`; ebctx.drawImage(ec, 0, 0); ebctx.filter = 'none';
    dctx.globalCompositeOperation = 'screen';
    dctx.imageSmoothingEnabled = true; dctx.globalAlpha = clamp(0.72 * rig.glowBoost, 0, 1); dctx.drawImage(eb, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = clamp(0.55 * rig.glowBoost, 0, 1); dctx.imageSmoothingEnabled = false; dctx.drawImage(ec, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = 1; dctx.globalCompositeOperation = 'source-over'; drawCalls += 2;

    const cpuMs = performance.now() - tCpu0;
    cpuMsSmooth = cpuMsSmooth * 0.88 + cpuMs * 0.12;
    statTimer += dt;
    if (statTimer >= 0.25) {
      statTimer = 0;
      const hitRate = (cacheHits + cacheMisses) ? Math.round(cacheHits * 100 / (cacheHits + cacheMisses)) : 100;
      $('stats').innerHTML =
        `<span>建模 <b>${buildMs}ms</b></span>` +
        (skinMs > 0 ? `<span>换色 <b>${skinMs}ms</b></span>` : '') +
        `<span>帧率 <b>${fpsVal}fps</b></span>` +
        `<span>单帧 <b>${cpuMsSmooth.toFixed(1)}ms</b></span>` +
        `<span>绘制 <b>${drawCalls}次</b></span>` +
        `<span>色表 <b>${PAL_KEYS.length}色</b></span>` +
        (mode === 'cached' ? `<span>缓存 <b>${spriteCache.size}</b> (${hitRate}%)</span>` : '');
    }
    requestAnimationFrame(tick);
  }

  const $ = id => document.getElementById(id);
  function buildBars() {
    const sb = $('skinBar'); sb.innerHTML = '';
    SKINS.forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="swatch" style="background:${sk.dot}"></span>${sk.name}`;
      btn.onclick = () => applySkin(idx, true); sb.appendChild(btn);
    });
    const kb = $('skillBar'); kb.innerHTML = '';
    SKILLS.forEach((sk, idx) => {
      const btn = document.createElement('button'); btn.className = 'skill-btn';
      btn.textContent = `${idx + 1}. ${sk.name}`; btn.onclick = () => startSkill(idx); kb.appendChild(btn);
    });
  }
  function syncUI() {
    $('skinBadge').textContent = curSkin.name;
    $('skinBar').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === skinIdx));
    $('skillBar').querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', !!(activeSkill && activeSkill.id === SKILLS[i].id)));
    $('btnHover').classList.toggle('on', !activeSkill && baseMode === 'hover');
    $('btnDart').classList.toggle('on', !activeSkill && baseMode === 'dart');
    $('btnSpin').classList.toggle('on', autoSpin);
    $('btnOutline').classList.toggle('on', useOutline);
    $('btnMode').textContent = '模式：' + MODE_LABEL[MODES[modeIdx]];
    $('btnMode').classList.toggle('on', MODES[modeIdx] === 'cached');
  }

  $('btnHover').onclick = () => { activeSkill = null; baseMode = 'hover'; syncUI(); showBanner('林间生态 · 花丛悬停轻舞', 1.1); };
  $('btnDart').onclick  = () => { activeSkill = null; baseMode = 'dart';  syncUI(); showBanner('林间生态 · 花间穿梭巡飞', 1.2); };
  $('btnSpin').onclick = () => { autoSpin = !autoSpin; syncUI(); };
  $('btnOutline').onclick = () => { useOutline = !useOutline; syncUI(); };
  $('btnMode').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; fit(); syncUI(); };
  $('btnReset').onclick = () => {
    thTarget = 0.56;
    th = thTarget + (((th - thTarget + Math.PI) % TAU + TAU) % TAU - Math.PI);
    zoom = 0; autoSpin = false; baseMode = 'hover'; activeSkill = null; fit(); syncUI();
  };
  $('btnExport').onclick = () => {
    const asset = parts.head;
    const a = document.createElement('a');
    a.download = `fairy_${curSkin.id}_head_${asset.w}x${asset.d}x${asset.h}.png`;
    a.href = asset.strip.toDataURL('image/png'); a.click();
  };

  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, th }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (drag) { th = thTarget = drag.th + (e.clientX - drag.x) * 0.01; } });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => { zoom = clamp(zoom + (e.deltaY > 0 ? -1 : 1), -2, 5); fit(); e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'q' || e.key === 'Q') thTarget -= Math.PI / 4;
    if (e.key === 'e' || e.key === 'E') thTarget += Math.PI / 4;
    if (e.key === 'c' || e.key === 'C') applySkin(skinIdx + 1, true);
    if (e.key === 's' || e.key === 'S') {
      activeSkill = null; baseMode = baseMode === 'dart' ? 'hover' : 'dart'; syncUI();
      showBanner(baseMode === 'dart' ? '林间生态 · 花间穿梭巡飞' : '林间生态 · 花丛悬停轻舞', 1.2);
    }
    if (e.key >= '1' && e.key <= '4') startSkill(Number(e.key) - 1);
  });
  window.addEventListener('resize', fit);

  window.__FAIRY_DEBUG__ = {
    getStats: () => ({
      buildMs: Number(buildMs), skinMs, skin: curSkin.id, baseMode,
      fps: fpsVal, cpuMs: Number(cpuMsSmooth.toFixed(2)),
      cacheSize: spriteCache.size, cacheHits, cacheMisses,
      th, zoom, mode: MODES[modeIdx], paletteCount: PAL_KEYS.length,
      activeSkill: activeSkill ? activeSkill.id : null
    }),
    setAngle: a => { th = thTarget = a; },
    setSkin: idOrIdx => { const idx = typeof idOrIdx === 'number' ? idOrIdx : SKINS.findIndex(s => s.id === idOrIdx); if (idx >= 0) applySkin(idx, false); },
    setBaseMode: m => { activeSkill = null; baseMode = m; syncUI(); },
    cycleSkin: () => applySkin(skinIdx + 1, true),
    getSkin: () => curSkin.id,
    triggerSkill: i => startSkill(i),
    setAutoSpin: v => { autoSpin = v; syncUI(); },
    setZoom: z => { zoom = clamp(z, -2, 5); fit(); }
  };

  buildBars(); fit(); syncUI(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
