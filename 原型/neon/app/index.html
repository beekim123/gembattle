<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code00 原型</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #101218;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game-canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    border: 1px solid #2a3142;
    background: #171a22;
    touch-action: none;
  }
</style>
</head>
<body>
  <canvas id="game-canvas" width="1920" height="1080" aria-label="code00 游戏画面"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
