<script>
// === SLIME_VOXEL_CORE_START ===
'use strict';

/*
===============================================================================
第 0 步：史莱姆弹性软体骨骼架构 & 模块化部件空间坐标预算表（正面 +Y，z=0 贴地）
===============================================================================
核心升级（v3 弹性软体 + 弹簧内核型）：
1. 【告别 8 帧定帧翻页】：拆分为 7 个轻量模块化体素部件（总建模 < 12ms），
   运行时以 120fps 连续物理驱动：
   - 外层果冻主体 bodyDome 实时按体积守恒 Squash & Stretch（sx * sy * sz ≈ 1）连续弹性变形；
   - 内部弹性亮核 coreNode、3 颗立体气泡 bubbleL/R/Back、以及皇冠金专属 miniCrown 全部由
     独立「二阶弹簧阻尼系统」驱动，滞后跟随起跳、砸地与回弹，呈现极强 Q 弹惯性！
   - 豆豆双眼 faceEyes 独立紧贴前上外表面，随呼吸轻眨并朝向跳跃目标微偏，0.6 俯视 0 遮挡。
2. 【局部缓冲 actorBuf 整体 1px 外轮廓】：
   - 所有部件按裸图（wantOutline=false）缓存于 BAKE_SCALE=2.5，每帧在 actorBuf(220×220) 内按
     「内层弹簧亮核 -> 半透果冻外壳(alpha 0.86) -> 表层气泡 -> 正面双眼 -> 头顶金冠」顺序合成，
     再做 1 次整体 1px 外轮廓，通透果冻感与锐利像素边缘兼得！
3. 【双常驻生态】：
   - 原地颤动：连续体积守恒果冻呼吸 + 偶发 Q 弹小抖动 + 弹簧内核轻晃；
   - 弹性蹦跳 (S)：真实 4 阶段物理跳跃（蓄力压扁贴地 -> 拉伸弹射离地 -> 抛物线滞空 ->
     砸地压扁二次阻尼回弹 + 黏液水渍与前景飞溅液花）。

【模块化体素部件预算表】
-------------------------------------------------------------------------------
部件名            | 盒尺寸 W×D×H | 局部锚点与防穿模约束
-------------------------------------------------------------------------------
bodyDome          | 28 × 28 × 20 | 饱满贴地底裙 + 圆润半球 + 微尖水滴顶（r≈11.6, h≈17.5）
coreNode          | 12 × 12 × 10 | 独立自亮弹性内核（r≈4.2, h≈6.8），二阶弹簧滞后浮动于果冻腔内
bubbleL / R / B   |  7 ×  7 ×  7 | 3 颗大小错落立体气泡（r=2.0/1.75/1.6），弹簧滞后漂浮
faceEyes          | 14 ×  6 ×  6 | 2×2 深色豆豆眼 + 1px 亮白反点，紧贴前表面 Y≈+10.5，0 遮挡
miniCrown         | 14 × 14 ×  8 | 皇冠金专属 4 重对称小金冠 + 四面红宝石，弹簧滞后颠于顶峰
dummy             | 16 × 16 × 28 | 立于 (0, +46) 的训练靶桩
===============================================================================
*/

  targetCream:  '#efe3c8'

const PAL_KEYS = Object.keys(PAL);
const KEY_TO_ID = Object.create(null);
const ID_TO_KEY = [null];
const ID_TO_RGBA = [null];
const GLOW_KEY_SET = new Set(['emissiveMid', 'emissiveHot', 'emissiveCore']);
const GLOW_ID_SET = new Set();
const IS_GLOW_ID = new Uint8Array(64);

for (let i = 0; i < PAL_KEYS.length; i++) {
  const k = PAL_KEYS[i];
  const id = i + 1;
  KEY_TO_ID[k] = id;
  ID_TO_KEY[id] = k;
  const n = parseInt(PAL[k].slice(1), 16);
  ID_TO_RGBA[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
  if (GLOW_KEY_SET.has(k)) { GLOW_ID_SET.add(id); IS_GLOW_ID[id] = 1; }
}

// ---------------------------------------------------------------------------
// 1b. 4 套零重建模换色皮肤（完整保留原版 4 色系 + 特效联动 + 皇冠金彩蛋）

    },

      waveDark: '#1e6e29', waveMid: '#58e838', waveHi: '#d8ff78',
      warnStroke: 'rgba(142, 245, 76, 0.92)', warnFillRGB: '96, 228, 62',
      splashRGB: '168, 248, 102',

  {
    id: 'lava', name: '熔岩红', tag: '火胶', dot: '#f04e24', outline: '#1e0b0c',
    hasCrown: false, glowAlpha: 0.92,
    pal: {
      bodyDark:     '#5c1214', bodyMid:     '#b8261e', bodyHi:       '#f06428',
      bubbleDark:   '#a63216', bubbleMid:   '#f27c24', bubbleHi:     '#ffc848',
      emissiveMid:  '#ff5218', emissiveHot: '#ffad26', emissiveCore: '#fff5b8'
    },
    fx: {
      dropDark: '#5c1214', dropMid: '#eb461c', dropHi: '#ffad26', core: '#fff5b8',
      puddleBase: '#1f1012', puddleRim: '#ff5218', puddleBubble: '#ffad26',
      waveDark: '#7a1916', waveMid: '#ff5218', waveHi: '#ffe078',

  },
  {

    hasCrown: true, glowAlpha: 0.56,
    pal: {

      emissiveMid:  '#f5b828', emissiveHot: '#ffe87a', emissiveCore: '#fffce8'
    },

function buildRgbaTable(skin) {
  const tbl = ID_TO_RGBA.slice();
  if (skin && skin.pal) {
    for (const k in skin.pal) {
      const id = KEY_TO_ID[k];
      if (!id) continue;
      const n = parseInt(skin.pal[k].slice(1), 16);
      tbl[id] = [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
    }
  }
  return tbl;
}

function recolorAsset(asset, rgbaTable) {
  const { w, d, h, grid, activeLayers, glowLayers, glowSlot, strip, glowStrip, sim, eim } = asset;
  const stripW = w * h;
  const glowW = w * glowLayers.length;
  const sData = sim.data;
  const eData = eim ? eim.data : null;

  for (let li = 0; li < activeLayers.length; li++) {
    const z = activeLayers[li];
    const gxOff = z * w;
    const gSlot = glowSlot[z];
    const zBase = z * d * w;
    for (let y = 0; y < d; y++) {
      const row = zBase + y * w;
      const sRow = y * stripW + gxOff;
      const eRow = gSlot >= 0 ? (y * glowW + gSlot * w) : -1;
      for (let x = 0; x < w; x++) {
        const id = grid[row + x];
        if (!id) continue;
        const rgba = rgbaTable[id];
        const si = (sRow + x) * 4;
        sData[si] = rgba[0]; sData[si + 1] = rgba[1]; sData[si + 2] = rgba[2]; sData[si + 3] = 255;
        if (eData && eRow >= 0 && IS_GLOW_ID[id]) {
          const ei = (eRow + x) * 4;
          eData[ei] = rgba[0]; eData[ei + 1] = rgba[1]; eData[ei + 2] = rgba[2]; eData[ei + 3] = 255;
        }
      }
    }
  }
  strip.getContext('2d').putImageData(sim, 0, 0);
  if (glowStrip && eim) glowStrip.getContext('2d').putImageData(eim, 0, 0);
}

const PART_NAMES = [
  'none',
  'body', 'bubble', 'core', 'eye',
  'crown', 'ruby',
  'dummyBase', 'dummyPost', 'dummyIron', 'dummyBoard'
];
const PART_ID = Object.create(null);
for (let i = 0; i < PART_NAMES.length; i++) PART_ID[PART_NAMES[i]] = i;

const NUM_PARTS = PART_NAMES.length;
const NO_CREASE_LUT = new Uint8Array(NUM_PARTS * NUM_PARTS);
for (const [a, b] of [
  ['eye', 'body'], ['eye', 'core'],
  ['bubble', 'body'], ['bubble', 'core'],
  ['core', 'body'], ['crown', 'ruby'],
  ['dummyPost', 'dummyIron']
]) {
  const ia = PART_ID[a], ib = PART_ID[b];
  NO_CREASE_LUT[ia * NUM_PARTS + ib] = 1;
  NO_CREASE_LUT[ib * NUM_PARTS + ia] = 1;
}

const MATERIAL_KEYS = [null, 'body', 'bubble', 'crown', 'stone', 'wood', 'iron'];
const MAT_ID = Object.create(null);
for (let i = 1; i < MATERIAL_KEYS.length; i++) MAT_ID[MATERIAL_KEYS[i]] = i;
const MAT_BASE = 128;
const mat = name => MAT_BASE + MAT_ID[name];

const RAMPS_BY_MAT = {
  [MAT_ID.body]:   [KEY_TO_ID.bodyDark,   KEY_TO_ID.bodyMid,   KEY_TO_ID.bodyHi],
  [MAT_ID.bubble]: [KEY_TO_ID.bubbleDark, KEY_TO_ID.bubbleMid, KEY_TO_ID.bubbleHi],
  [MAT_ID.crown]:  [KEY_TO_ID.crownDark,  KEY_TO_ID.crownMid,  KEY_TO_ID.crownHi],
  [MAT_ID.stone]:  [KEY_TO_ID.stoneDark,  KEY_TO_ID.stoneMid,  KEY_TO_ID.stoneHi],
  [MAT_ID.wood]:   [KEY_TO_ID.woodDark,   KEY_TO_ID.woodMid,   KEY_TO_ID.woodHi],
  [MAT_ID.iron]:   [KEY_TO_ID.ironDark,   KEY_TO_ID.ironMid,   KEY_TO_ID.ironHi]
};

// ---------------------------------------------------------------------------
// 2. 数学原语与周期噪声
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const smin = (a, b, k) => {
  const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
  return lerp(b, a, h) - k * h * (1 - h);
};
function localToWorldXY(rx, ry, yaw, lx, ly) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  return [rx + cy * lx - sy * ly, ry + sy * lx + cy * ly];
}
function hash2i(ix, iy, seed) {
  let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function periodicNoise2(x, y, periodX, periodY, cell, seed) {
  const gx = x / cell, gy = y / cell;
  const px = Math.max(1, Math.round(periodX / cell));
  const py = Math.max(1, Math.round(periodY / cell));
  const ix = Math.floor(gx), iy = Math.floor(gy);
  const fx = gx - ix, fy = gy - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const wMod = (v, m) => ((v % m) + m) % m;
  const x0 = wMod(ix, px), x1 = wMod(ix + 1, px);
  const y0 = wMod(iy, py), y1 = wMod(iy + 1, py);
  return lerp(
    lerp(hash2i(x0, y0, seed), hash2i(x1, y0, seed), ux),
    lerp(hash2i(x0, y1, seed), hash2i(x1, y1, seed), ux),
    uy
  );
}

// ---------------------------------------------------------------------------
// 3. 高性能体素网格
// ---------------------------------------------------------------------------
class VoxelModel {
  constructor(w, d, h) {
    this.w = w; this.d = d; this.h = h;
    const len = w * d * h;
    this.grid = new Uint8Array(len);
    this.parts = new Uint8Array(len);
  }
  idx(x, y, z) { return (z * this.d + y) * this.w + x; }
  inB(x, y, z) { return x >= 0 && y >= 0 && z >= 0 && x < this.w && y < this.d && z < this.h; }
  getId(x, y, z) { return this.inB(x, y, z) ? this.grid[this.idx(x, y, z)] : 0; }
  getPartId(x, y, z) { return this.inB(x, y, z) ? this.parts[this.idx(x, y, z)] : 0; }
  setRaw(x, y, z, val, partId) {
    if (!this.inB(x, y, z)) return;
    const i = this.idx(x, y, z);
    this.grid[i] = val;
    this.parts[i] = partId;
  }
  fillAABB(X0, X1, Y0, Y1, Z0, Z1, fn) {
    const hw = this.w * 0.5 - 0.5, hd = this.d * 0.5 - 0.5;
    const x0 = clamp(Math.floor(X0 + hw), 0, this.w - 1);
    const x1 = clamp(Math.ceil(X1 + hw),  0, this.w - 1);
    const y0 = clamp(Math.floor(Y0 + hd), 0, this.d - 1);
    const y1 = clamp(Math.ceil(Y1 + hd),  0, this.d - 1);
    const z0 = clamp(Math.floor(Z0),      0, this.h - 1);
    const z1 = clamp(Math.ceil(Z1),       0, this.h - 1);
    for (let z = z0; z <= z1; z++) {
      for (let y = y0; y <= y1; y++) {
        const Y = y - hd;
        for (let x = x0; x <= x1; x++) fn(x, y, z, x - hw, Y);
      }
    }
  }
  despeckle() {
    const src = this.grid.slice(), prt = this.parts;
    const { w, d, h } = this;
    const wd = w * d;
    const pEye = PART_ID.eye, pRuby = PART_ID.ruby;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          if (!src[i]) continue;
          const p = prt[i];
          if (p === pEye || p === pRuby) continue;
          if ((x + 1 < w && src[i + 1]) || (x > 0 && src[i - 1]) ||
              (y + 1 < d && src[i + w]) || (y > 0 && src[i - w]) ||
              (z + 1 < h && src[i + wd]) || (z > 0 && src[i - wd])) continue;
          this.grid[i] = 0; this.parts[i] = 0;
        }
      }
    }
  }
  applyArtShading(opts = {}) {
    const { w, d, h } = this;
    const wd = w * d;
    const src = this.grid.slice(), prt = this.parts;
    const pMinZ = new Int16Array(NUM_PARTS).fill(999);
    const pMaxZ = new Int16Array(NUM_PARTS).fill(-1);
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      for (let i = zOff, end = zOff + wd; i < end; i++) {
        const p = prt[i];
        if (p) { if (z < pMinZ[p]) pMinZ[p] = z; if (z > pMaxZ[p]) pMaxZ[p] = z; }
      }
    }
    const smoothDomeParts = opts.smoothDomeParts || new Set();
    const keepSoftBottom = !!opts.keepSoftBottom;
    for (let z = 0; z < h; z++) {
      const zOff = z * wd;
      const hasUp = z + 1 < h, hasDn = z > 0;
      for (let y = 0; y < d; y++) {
        const row = zOff + y * w;
        for (let x = 0; x < w; x++) {
          const i = row + x;
          const v = src[i];
          if (v < MAT_BASE) continue;
          const ramp = RAMPS_BY_MAT[v - MAT_BASE];
          if (!ramp) continue;
          const myP = prt[i];
          const lutOff = myP * NUM_PARTS;
          const topEmpty = !hasUp || !src[i + wd];
          const botEmpty = hasDn && !src[i - wd];

          let crease = false, np;
          if (x + 1 < w && (np = prt[i + 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (x > 0 && (np = prt[i - 1]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y + 1 < d && (np = prt[i + w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (y > 0 && (np = prt[i - w]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;
          else if (hasDn && (np = prt[i - wd]) && np !== myP && !NO_CREASE_LUT[lutOff + np]) crease = true;

          let upperOcc = 0;
          if (hasUp && !topEmpty) {
            const up = i + wd;
            for (let oy = -1; oy <= 1; oy++) {
              const yy = y + oy;
              if (yy < 0 || yy >= d) continue;
              const uRow = up + oy * w;
              for (let ox = -1; ox <= 1; ox++) {
                const xx = x + ox;
                if (xx >= 0 && xx < w && src[uRow + ox]) upperOcc++;
              }
            }
          }
          const span = Math.max(1, pMaxZ[myP] - pMinZ[myP]);
          const localZ = (z - pMinZ[myP]) / span;
          let idx = 1;
          if (smoothDomeParts.has(myP)) {
            if (botEmpty || (!keepSoftBottom && z <= 2) || localZ < 0.16) idx = 0;
            else if (z >= pMaxZ[myP] - 2 || (topEmpty && localZ >= 0.78)) idx = 2;
            else idx = 1;
          } else {
            if (botEmpty || (!keepSoftBottom && z <= 1)) idx = 0;
            else if (crease && !topEmpty) idx = 0;
            else if (upperOcc >= 8 && localZ < 0.45) idx = 0;
            else if (topEmpty) idx = (crease || upperOcc >= 8) ? 1 : 2;
            else if (span >= 14 && localZ < 0.16) idx = 0;
            else idx = 1;
          }
          this.grid[i] = ramp[clamp(idx, 0, ramp.length - 1)];
        }
      }
    }
  }
  toStripAsset(makeCanvas, meta = {}) {
    const { w, d, h } = this;
    const activeLayers = [], glowLayers = [];
    for (let z = 0; z < h; z++) {
      let hasPx = false, hasGlow = false;
      const zBase = z * d * w;
      for (let i = 0; i < d * w; i++) {
        const id = this.grid[zBase + i];
        if (!id) continue;
        hasPx = true;
        if (GLOW_ID_SET.has(id)) hasGlow = true;
      }
      if (hasPx) activeLayers.push(z);
      if (hasGlow) glowLayers.push(z);
    }

    const strip = makeCanvas(w * h, d);
    const sim = strip.getContext('2d').createImageData(w * h, d);
    const hasGlow = glowLayers.length > 0;
    const glowStrip = hasGlow ? makeCanvas(w * glowLayers.length, d) : null;
    const eim = glowStrip ? glowStrip.getContext('2d').createImageData(w * glowLayers.length, d) : null;
    const glowSlot = new Int16Array(h).fill(-1);
    for (let i = 0; i < glowLayers.length; i++) glowSlot[glowLayers[i]] = i;

    const foot = makeCanvas(w, d);
    const fg = foot.getContext('2d');
    const fim = fg.createImageData(w, d);
    for (let y = 0; y < d; y++) for (let x = 0; x < w; x++) {
      for (let z = 0; z < h; z++) {
        if (this.grid[(z * d + y) * w + x]) {
          const fi = (y * w + x) * 4;
          fim.data[fi] = 10; fim.data[fi + 1] = 16; fim.data[fi + 2] = 22; fim.data[fi + 3] = 255;
          break;
        }
      }
    }
    fg.putImageData(fim, 0, 0);

    const asset = {
      w, d, h, grid: this.grid,
      strip, glowStrip, sim, eim,
      glowSlot, activeLayers, glowLayers,
      footShadow: foot,
      meta: {
        footRadius: meta.footRadius || Math.min(w, d) * 0.36,
        headZ: meta.headZ || (activeLayers.length ? activeLayers[activeLayers.length - 1] + 1 : h),
        centerZ: meta.centerZ || Math.round(h * 0.45)
      }
    };
    recolorAsset(asset, ID_TO_RGBA);
    return asset;
  }
}

// 4.1 果冻主躯壳（28×28×20，平滑半球 + 贴地裙摆 + 微尖水滴顶 + 顶弧透亮窗）
function buildSlimeBodyPart() {
  const W = 28, D = 28, H = 20;
  const m = new VoxelModel(W, D, H);
  const mBody = mat('body'), pBody = PART_ID.body, pCore = PART_ID.core;
  const kHot = KEY_TO_ID.emissiveHot, kMid = KEY_TO_ID.emissiveMid;

  m.fillAABB(-12.5, 12.5, -12.5, 12.5, 0, 18, (x, y, z, X, Y) => {
    const dDome  = (Math.hypot(X / 11.1, Y / 11.1, (z - 1.8) / 13.4) - 1.0) * 7.8;
    const dSkirt = (Math.hypot(X / 11.9, Y / 11.9, (z - 0.8) / 4.8) - 1.0) * 4.8;
    const dPeak  = (Math.hypot(X / 4.1, (Y + 0.3) / 4.1, (z - 13.4) / 3.7) - 1.0) * 4.0;
    const dAll   = smin(smin(dDome, dSkirt, 2.3), dPeak, 2.7);
    if (dAll <= 0) {
      if (z >= 14.0 && dAll > -1.3) {
        const topR2 = X * X + (Y + 0.3) * (Y + 0.3);
        if (topR2 <= 10.5) {
          m.setRaw(x, y, z, topR2 <= 2.9 ? kHot : kMid, pCore);
          return;
        }
      }
      m.setRaw(x, y, z, mBody, pBody);
    }
  });

  m.despeckle();
  m.applyArtShading({ smoothDomeParts: new Set([PART_ID.body]) });
  return m;
}

// 4.2 独立弹簧弹性亮核（12×12×10，在半透果冻外壳内部滞后晃动！）
function buildSlimeCorePart() {
  const W = 12, D = 12, H = 10;
  const m = new VoxelModel(W, D, H);
  m.fillAABB(-5, 5, -5, 5, 0, 9, (x, y, z, X, Y) => {
    const d = Math.hypot(X / 4.2, Y / 4.2, (z - 4.4) / 3.3);
    if (d <= 1.0) {
      const col = d <= 0.56 ? KEY_TO_ID.emissiveCore : (d <= 0.82 ? KEY_TO_ID.emissiveHot : KEY_TO_ID.emissiveMid);
      m.setRaw(x, y, z, col, PART_ID.core);
    }
  });
  m.despeckle();
  return m;
}

// 4.3 独立立体小气泡（7×7×7，带顶部 1px 亮核反点）
function buildBubblePart(radius) {
  const S = 7;
  const m = new VoxelModel(S, S, S);
  const cz = 3.0;
  m.fillAABB(-3, 3, -3, 3, 0, 6, (x, y, z, X, Y) => {
    const d = Math.hypot(X, Y, z - cz);
    if (d <= radius) {
      const isGlint = d <= radius * 0.62 && (z - cz) >= 0.4;
      m.setRaw(x, y, z, isGlint ? KEY_TO_ID.emissiveCore : mat('bubble'), PART_ID.bubble);
    }
  });
  m.despeckle();
  m.applyArtShading({ keepSoftBottom: true });
  return m;
}

// 4.4 独立豆豆双眼部件（14×6×6，2×2 深色豆豆眼 + 右上 1px 亮白反点，+Y 与 0.6 俯视 0 遮挡）
function buildEyesPart() {
  const W = 14, D = 6, H = 6;
  const m = new VoxelModel(W, D, H);
  const hw = W * 0.5 - 0.5;
  const ey = 3; // 靠前表面
  const ez = 2;
  for (const side of [-1, 1]) {
    const cols = side < 0 ? [Math.round(hw - 4.0), Math.round(hw - 3.0)]
                          : [Math.round(hw + 3.0), Math.round(hw + 4.0)];
    for (let ci = 0; ci < 2; ci++) {
      const x = cols[ci];
      for (let dz = 0; dz <= 1; dz++) {
        const isGlint = (dz === 1 && ci === 1);
        const col = isGlint ? KEY_TO_ID.eyeGlint : KEY_TO_ID.eyeDark;
        // 厚 2 格（y=2,3）保证 360° 任意斜角清晰不断裂
        m.setRaw(x, ey,     ez + dz, col, PART_ID.eye);
        m.setRaw(x, ey - 1, ez + dz, KEY_TO_ID.eyeDark, PART_ID.eye);
      }
    }
  }
  return m;
}

// 4.5 皇冠金专属小金冠（14×14×8，4 重对称 symDeg=90 + 四面红宝石）
function buildMiniCrown() {
  const W = 14, D = 14, H = 8;
  const m = new VoxelModel(W, D, H);
  const hw = W * 0.5 - 0.5, hd = D * 0.5 - 0.5;
  for (let z = 0; z < H; z++) {
    for (let y = 0; y < D; y++) {
      const Y = y - hd;
      for (let x = 0; x < W; x++) {
        const X = x - hw;
        const r = Math.hypot(X, Y);
        const rOut = 3.8 + z * 0.16;
        const rIn  = 2.0 + z * 0.12;
        if (z <= 2 && r <= rOut && r >= rIn) { m.setRaw(x, y, z, mat('crown'), PART_ID.crown); continue; }
        if (z >= 3 && z <= 4 && r <= rOut && r >= rIn - 0.2) {
          const ax = Math.abs(X), ay = Math.abs(Y);
          const tw = z === 3 ? 1.85 : 1.15;
          if ((ax <= tw && ay >= 2.0) || (ay <= tw && ax >= 2.0)) m.setRaw(x, y, z, mat('crown'), PART_ID.crown);
        }
        if (z === 5) {
          const ax = Math.abs(X), ay = Math.abs(Y);
          if ((ax <= 0.9 && Math.abs(ay - 3.6) <= 0.9) || (ay <= 0.9 && Math.abs(ax - 3.6) <= 0.9)) {
            m.setRaw(x, y, z, KEY_TO_ID.crownHi, PART_ID.crown);
          }
        }
      }
    }
  }
  for (const [gx, gy] of [[0, 3.9], [0, -3.9], [3.9, 0], [-3.9, 0]]) {
    m.fillAABB(gx - 1.0, gx + 1.0, gy - 1.0, gy + 1.0, 1, 2, (x, y, z, X, Y) => {
      if (Math.hypot(X - gx, Y - gy) <= 1.0) {
        m.setRaw(x, y, z, z === 2 ? KEY_TO_ID.rubyHi : KEY_TO_ID.rubyMid, PART_ID.ruby);
      }
    });
  }
  m.despeckle();
  m.applyArtShading();
  return m;
}

// 4.6 训练靶桩 & 苔藓石砖圆台
function buildTrainingDummy() {
  const m = new VoxelModel(16, 16, 28);
  const hw = 7.5, hd = 7.5;
  for (let z = 0; z < 28; z++) for (let y = 0; y < 16; y++) {
    const Y = y - hd;
    for (let x = 0; x < 16; x++) {
      const X = x - hw, r = Math.hypot(X, Y);
      if (z < 5 && r <= (z < 2 ? 5.2 : 3.8)) { m.setRaw(x, y, z, mat('stone'), PART_ID.dummyBase); continue; }
      if ((z === 8 || z === 21) && r <= 2.45) { m.setRaw(x, y, z, mat('iron'), PART_ID.dummyIron); continue; }
      if (z >= 5 && z <= 25 && r <= 2.05) { m.setRaw(x, y, z, mat('wood'), PART_ID.dummyPost); continue; }
      if (z === 26 && r <= 1.55) { m.setRaw(x, y, z, mat('iron'), PART_ID.dummyIron); continue; }
    }
  }
  m.fillAABB(-5.5, 5.5, -4.4, -1.6, 11, 23, (x, y, z, X, Y) => {
    const rd = Math.hypot(X, z - 17);
    if (rd <= 5.0 && Y >= -4.0 && Y <= -1.8) {
      if (Y <= -3.0) {
        const col = rd <= 1.5 ? KEY_TO_ID.targetRed : (rd <= 3.2 ? KEY_TO_ID.targetCream : KEY_TO_ID.targetRed);
        m.setRaw(x, y, z, col, PART_ID.dummyBoard);
      } else m.setRaw(x, y, z, mat('wood'), PART_ID.dummyBoard);
    }
  });
  m.despeckle();
  m.applyArtShading();
  return m;
}

function buildMossStonePlatform(makeCanvas, size = 200) {
  const base = makeCanvas(size, size);
  const bg = base.getContext('2d');
  const bim = bg.createImageData(size, size);
  const half = size * 0.5;
  const rOuter = size * 0.478, rInner = size * 0.425;

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = x - half, dy = y - half;
    const dist = Math.hypot(dx, dy);
    if (dist > rOuter) continue;
    const i = (y * size + x) * 4;
    let key;
    if (dist > rInner) {
      const ang = Math.atan2(dy, dx);
      const segF = ((ang + Math.PI) / (Math.PI * 2)) * 24;
      const seg = Math.floor(segF);
      const seam = Math.abs(segF - Math.round(segF)) < 0.08;
      const mossEdge = periodicNoise2(x, y, 64, 64, 16, 73);
      if (seam || dist > rOuter - 2.2 || dist < rInner + 1.8) key = 'stoneDeep';
      else if (mossEdge > 0.72) key = 'mossDark';
      else key = (seg & 1) ? 'stoneMid' : 'stoneDark';
    } else {
      const nStone = periodicNoise2(x, y, 64, 64, 16, 19);
      const nMoss  = periodicNoise2(x + 13, y + 7, 64, 64, 16, 47);
      const nFine  = periodicNoise2(x + 3, y + 11, 32, 32, 8, 89);
      const mossField = nMoss * 0.7 + nFine * 0.3;
      const row = Math.floor(y / 14);
      const brickX = (x + (row & 1 ? 8 : 0)) % 16;
      const brickY = y % 14;
      const isSeam = (brickX === 0 || brickY === 0);
      const radialMossBias = smoothstep(26, 78, dist) * 0.24;
      if (mossField + radialMossBias > 0.66) {
        key = mossField > 0.74 ? 'mossHi' : (mossField < 0.56 ? 'mossDark' : 'mossMid');
      } else if (isSeam) {
        key = mossField + radialMossBias > 0.52 ? 'mossDark' : 'stoneDeep';
      } else {
        key = nStone > 0.65 ? 'stoneHi' : (nStone < 0.34 ? 'stoneDark' : 'stoneMid');
      }
    }
    const rgba = ID_TO_RGBA[KEY_TO_ID[key]];
    bim.data[i] = rgba[0]; bim.data[i + 1] = rgba[1]; bim.data[i + 2] = rgba[2]; bim.data[i + 3] = 255;
  }
  bg.putImageData(bim, 0, 0);
  return { size, base, rInner, rOuter };
}

// 5. 二阶弹簧阻尼求解器（驱动内部亮核、气泡、皇冠的 Q 弹滞后物理！）
// ---------------------------------------------------------------------------
function makeSpring3(x = 0, y = 0, z = 0) {
  return { x, y, z, vx: 0, vy: 0, vz: 0 };
}
function stepSpring3(sp, tx, ty, tz, dt, stiffness = 150, damping = 13) {
  const ax = (tx - sp.x) * stiffness - sp.vx * damping;
  const ay = (ty - sp.y) * stiffness - sp.vy * damping;
  const az = (tz - sp.z) * stiffness - sp.vz * damping;
  sp.vx += ax * dt; sp.vy += ay * dt; sp.vz += az * dt;
  sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.z += sp.vz * dt;
}

  const platform = buildMossStonePlatform(mk, 200);
  const buildMs = (performance.now() - tBuild0).toFixed(1);

  let skinIdx = 0;
  let curSkin = SKINS[0];
  let skinMs = 0;
  let baseMode = 'idle'; // 'idle' | 'hop'

  // 2. 定倍角度烘焙 LRU 缓存
  const spriteCache = new Map();
  const MAX_CACHE = 720;
  let cacheHits = 0, cacheMisses = 0;

  function flushSlimeCache() {
    for (const [k, entry] of spriteCache.entries()) {
      if (k.startsWith('dummy|') || k.startsWith('crown|') || k.startsWith('eyes|')) continue;
      releaseCanvas(entry.main);
      releaseCanvas(entry.glow);
      spriteCache.delete(k);
    }
  }

  function getBakedSprite(asset, assetId, angle, outlineHex, wantOutline, symDeg = 360) {
    const rawDeg = (((angle * 180 / Math.PI) % symDeg) + symDeg) % symDeg;
    const slots = Math.max(1, Math.round(symDeg / ANGLE_QUANT_DEG));
    const degSlot = Math.round(rawDeg / ANGLE_QUANT_DEG) % slots;
    const qAng = (degSlot * ANGLE_QUANT_DEG) * Math.PI / 180;
    const key = `${assetId}|${degSlot}|${wantOutline ? outlineHex : 'raw'}`;
    const hit = spriteCache.get(key);
    if (hit) {
      cacheHits++;
      spriteCache.delete(key);
      spriteCache.set(key, hit);
      return hit;
    }
    cacheMisses++;

    const { w, d, activeLayers, glowLayers, glowSlot, glowStrip, strip } = asset;
    const c = Math.cos(qAng), s = Math.sin(qAng);
    const sc = BAKE_SCALE;
    const maxZ = activeLayers.length ? activeLayers[activeLayers.length - 1] : 0;
    const op = wantOutline ? 1 : 0;
    const pad = op + 2;

    const rxSpan = Math.ceil((Math.abs(c) * w * 0.5 + Math.abs(s) * d * 0.5) * sc);
    const rySpan = Math.ceil((Math.abs(s) * w * 0.5 + Math.abs(c) * d * 0.5) * TILT * sc);
    const bw = rxSpan * 2 + pad * 2;
    const bh = rySpan * 2 + maxZ * BAKE_STEP + pad * 2 + BAKE_STEP;
    const anchorX = Math.floor(bw / 2);
    const anchorY = bh - rySpan - pad;

    if (scratchRaw.width < bw) scratchRaw.width = bw;
    if (scratchRaw.height < bh) scratchRaw.height = bh;
    srCtx.setTransform(1, 0, 0, 1, 0, 0);
    srCtx.globalCompositeOperation = 'source-over';
    srCtx.imageSmoothingEnabled = false;
    srCtx.clearRect(0, 0, bw, bh);

    const hasGlow = !!glowStrip && glowLayers.length > 0;
    const minGlowZ = hasGlow ? glowLayers[0] : 9999;
    const glowC = hasGlow ? acquireCanvas(bw, bh) : null;
    const glctx = hasGlow ? glowC.getContext('2d') : null;
    if (glctx) {
      glctx.setTransform(1, 0, 0, 1, 0, 0);
      glctx.globalCompositeOperation = 'source-over';
      glctx.imageSmoothingEnabled = false;
      glctx.clearRect(0, 0, bw, bh);
    }

    const cs = c * sc, ss = s * sc, tss = TILT * ss, tcs = TILT * cs;
    const hw = -w * 0.5, hd = -d * 0.5;

    for (let li = 0; li < activeLayers.length; li++) {
      const z = activeLayers[li];
      const yy = anchorY - z * BAKE_STEP;
      const sx = z * w;
      srCtx.setTransform(cs, tss, -ss, tcs, anchorX, yy + BAKE_HALF);
      srCtx.drawImage(strip, sx, 0, w, d, hw, hd, w, d);
      srCtx.setTransform(cs, tss, -ss, tcs, anchorX, yy);
      srCtx.drawImage(strip, sx, 0, w, d, hw, hd, w, d);

      if (hasGlow && z >= minGlowZ) {
        if (z > minGlowZ) {
          glctx.globalCompositeOperation = 'destination-out';
          glctx.setTransform(cs, tss, -ss, tcs, anchorX, yy + BAKE_HALF);
          glctx.drawImage(strip, sx, 0, w, d, hw, hd, w, d);
          glctx.setTransform(cs, tss, -ss, tcs, anchorX, yy);
          glctx.drawImage(strip, sx, 0, w, d, hw, hd, w, d);
        }
        const gSlot = glowSlot[z];
        if (gSlot >= 0) {
          glctx.globalCompositeOperation = 'source-over';
          glctx.setTransform(cs, tss, -ss, tcs, anchorX, yy);
          glctx.drawImage(glowStrip, gSlot * w, 0, w, d, hw, hd, w, d);
        }
      }
    }

    const finalC = acquireCanvas(bw, bh);
    const fctx = finalC.getContext('2d');
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.globalCompositeOperation = 'source-over';
    fctx.imageSmoothingEnabled = false;
    fctx.clearRect(0, 0, bw, bh);

    if (wantOutline) {
      if (scratchSil.width < bw) scratchSil.width = bw;
      if (scratchSil.height < bh) scratchSil.height = bh;
      ssCtx.setTransform(1, 0, 0, 1, 0, 0);
      ssCtx.globalCompositeOperation = 'source-over';
      ssCtx.clearRect(0, 0, bw, bh);
      ssCtx.drawImage(scratchRaw, 0, 0, bw, bh, 0, 0, bw, bh);
      ssCtx.globalCompositeOperation = 'source-in';
      ssCtx.fillStyle = outlineHex;
      ssCtx.fillRect(0, 0, bw, bh);
      fctx.drawImage(scratchSil, 0, 0, bw, bh, -op, 0, bw, bh);
      fctx.drawImage(scratchSil, 0, 0, bw, bh,  op, 0, bw, bh);
      fctx.drawImage(scratchSil, 0, 0, bw, bh, 0, -op, bw, bh);
      fctx.drawImage(scratchSil, 0, 0, bw, bh, 0,  op, bw, bh);
    }
    fctx.drawImage(scratchRaw, 0, 0, bw, bh, 0, 0, bw, bh);

    const entry = { main: finalC, glow: glowC, anchorX, anchorY, bw, bh };
    spriteCache.set(key, entry);
    if (spriteCache.size > MAX_CACHE) {
      const oldestKey = spriteCache.keys().next().value;
      const old = spriteCache.get(oldestKey);
      spriteCache.delete(oldestKey);
      releaseCanvas(old.main);
      releaseCanvas(old.glow);
    }
    return entry;
  }

  // 3. 弹性软体骨骼 + 二阶弹簧内核状态 + 4 阶段蹦跳巡游状态机
  const mainRig = {

  // 4 阶段弹性蹦跳巡游状态（绕场地安全轨道跳动，彻底避开靶桩与 HUD）
  const HOP_WAYPOINTS = [

    dur: 1.18,

  };

  // 4. 场景、技能与特效池
  const MODES = ['cached', 'crisp', 'retro'];
  const MODE_LABEL = { cached: '游戏缓存', crisp: '高清逐层', retro: '复古低分' };
  let modeIdx = 0;
  let CW = 0, CH = 0, EW = 0, EH = 0, DPR = 1, SCALE = 4, zoom = 0;
  let th = 0.52, thTarget = 0.52;

  let animTime = 0, shakeMag = 0, shakeX = 0, shakeY = 0;
  let dummyHit = 0, dummyTiltBack = 0;

  const SKILLS = [
    { id: 'slam',  name: '弹跳砸地',     dur: 2.35 },
    { id: 'spit',  name: '连吐液球',     dur: 2.15 },

  const particles = [];
  const groundPuddles = [];
  const splashArcs = [];    // 前景液花落地弧（画在角色之后，增强贴地弹性感！）
  const warnings = [];
  const projectiles = [];
  const waveRings = [];
  const dummySplashes = [];
  const ambientMotes = Array.from({ length: 14 }, (_, i) => ({
    x: Math.sin(i * 15.7) * 64,
    y: Math.cos(i * 11.3) * 64,
    z: 4 + (i * 7) % 28,

  }));

  function spawnParticle(x, y, z, vx, vy, vz, life, sz, role, glow = false, gravity = 44) {
    if (particles.length > 360) particles.shift();
    particles.push({ x, y, z, vx, vy, vz, t: 0, life, sz, role, glow, gravity });
  }
  function resolveRoleColor(role) {
    const fx = curSkin.fx;
    if (role === 'dark') return fx.dropDark;
    if (role === 'mid')  return fx.dropMid;
    if (role === 'hi')   return fx.dropHi;
    if (role === 'core') return fx.core;
    if (role === 'waveMid') return fx.waveMid;
    if (role === 'waveHi')  return fx.waveHi;
    return fx.dropMid;
  }
  function addPuddle(x, y, r, life, ring = false) {
    if (groundPuddles.length > 48) groundPuddles.shift();
    groundPuddles.push({ x, y, r, t: 0, life, ring, seed: Math.random() * 10 });
  }
  function addSplashArc(x, y, r0, r1, life = 0.42) {
    if (splashArcs.length > 18) splashArcs.shift();
    splashArcs.push({ x, y, r0, r1, t: 0, life });
  }
  function addWaveRing(x, y, z, r0, r1, life, thick = 1.0) {
    waveRings.push({ x, y, z, r0, r1, t: 0, life, thick });
  }
  function spawnHopSplash(wx, wy, count = 10, power = 1.0) {
    addSplashArc(wx, wy, 7 * power, 18 * power, 0.40);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU + Math.random() * 0.35;

        Math.cos(a) * sp, Math.sin(a) * sp, (10 + Math.random() * 14) * power,
        0.38 + Math.random() * 0.22, 1.5 + Math.random() * 0.7,
        i % 3 === 0 ? 'core' : (i % 2 === 0 ? 'hi' : 'mid'),
        i % 3 === 0 || curSkin.fx.sparkle, 54);
    }
  }
  function hitDummy(power = 1.0, tiltBack = 0, puddleR = 9) {
    dummyHit = Math.max(dummyHit, power);

    for (let i = 0; i < Math.round(4 * power); i++) {

  }

  let bannerTimer = 0;
  function showBanner(msg, dur = 1.5) {

  function applySkin(idx, showTip = true) {
    const t0 = performance.now();

    document.documentElement.style.setProperty('--hot', curSkin.ui.hot);

  function startSkill(idx) {
    const sk = SKILLS[idx];
    if (!sk) return;

  function renderSkyCache() {
    const fx = curSkin.fx;
    bgc.width = Math.max(1, cv.width);
    bgc.height = Math.max(1, cv.height);
    bgctx.setTransform(1, 0, 0, 1, 0, 0);
    const sky = bgctx.createLinearGradient(0, 0, 0, bgc.height);
    sky.addColorStop(0, fx.skyTop);
    sky.addColorStop(0.58, fx.skyMid);
    sky.addColorStop(1, fx.skyBot);
    bgctx.fillStyle = sky;
    bgctx.fillRect(0, 0, bgc.width, bgc.height);
    const halo = bgctx.createRadialGradient(
      bgc.width * 0.5, bgc.height * 0.44, 12,
      bgc.width * 0.5, bgc.height * 0.44, bgc.height * 0.54
    );
    halo.addColorStop(0, fx.skyHalo);
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    bgctx.fillStyle = halo;
    bgctx.fillRect(0, 0, bgc.width, bgc.height);
  }

  function fit() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const cssW = window.innerWidth, cssH = window.innerHeight;
    cv.width = Math.floor(cssW * DPR);
    cv.height = Math.floor(cssH * DPR);
    const logicalScale = Math.max(2, Math.round(cssH / 138) + zoom);
    SCALE = Math.max(2, Math.round(logicalScale * DPR));

    const mode = MODES[modeIdx];
    if (mode === 'retro') {
      CW = Math.ceil(cv.width / SCALE); CH = Math.ceil(cv.height / SCALE);
    } else {
      CW = cv.width; CH = cv.height;
    }
    if (mode === 'cached') {
      mc.width = oc.width = 1; mc.height = oc.height = 1;
    } else {
      mc.width = oc.width = CW; mc.height = oc.height = CH;
    }
    EW = Math.max(1, Math.ceil(cv.width / 4));
    EH = Math.max(1, Math.ceil(cv.height / 4));
    ec.width = eb.width = EW; ec.height = eb.height = EH;
    renderSkyCache();
  }

  function proj(x, y, z, sc) {
    const c = Math.cos(th), s = Math.sin(th);
    const rx = c * x - s * y, ry = s * x + c * y;
    const mode = MODES[modeIdx];
    const step = mode === 'retro' ? HS : (mode === 'cached' ? HS * sc : Math.max(1, Math.round(HS * sc)));
    const sx = mode === 'retro' ? shakeX / SCALE : shakeX;
    const sy = mode === 'retro' ? shakeY / SCALE : shakeY;
    return [CW / 2 + rx * sc + sx, CH / 2 + 18 * sc + ry * TILT * sc - z * step + sy, ry];
  }

  // 5. 120fps 连续果冻软体运动学 + 双生态 + 4 技能演出
  function updateSlimeEntities(dt) {
    const kSmooth = 1 - Math.exp(-dt * 12);
    const kYaw = 1 - Math.exp(-dt * 10);

    // 默认原地果冻呼吸（体积守恒 sx * sx * sz = 1 + 偶发 Q 弹小颤动 + 好奇张望）
    const breath = Math.sin(animTime * 3.4);
    const jiggleCy = animTime % 4.4;
    const jiggle = jiggleCy > 3.2 && jiggleCy < 4.0
      ? Math.sin(((jiggleCy - 3.2) / 0.8) * Math.PI * 3) * Math.exp(-(jiggleCy - 3.2) * 3.8) * 0.14
      : 0;

    let tgtX = 0, tgtY = 0, tgtLift = 0, tgtYaw = Math.sin(animTime * 0.9) * 0.16;
    let tgtSXY = 1.0 + 0.08 * breath + jiggle;
    let tgtSZ  = 1.0 / (tgtSXY * tgtSXY);
    let tgtEyeYaw = Math.sin(animTime * 1.4) * 0.12;
    let glowBoost = 1.0;

    let customEntities = null;

    if (!activeSkill) {
      if (baseMode === 'hop') {
        // =========================================================================
        // 真实 4 阶段弹性蹦跳物理：蓄力压扁 -> 拉伸弹射 -> 抛物线滞空 -> 砸地回弹！
        // =========================================================================
        hopState.phase += dt / hopState.dur;
        if (hopState.phase >= 1.0) {
          hopState.phase -= 1.0;
          hopState.sx = hopState.tx;
          hopState.sy = hopState.ty;
          hopState.wpIdx = (hopState.wpIdx + 1) % HOP_WAYPOINTS.length;
          hopState.tx = HOP_WAYPOINTS[hopState.wpIdx].x;
          hopState.ty = HOP_WAYPOINTS[hopState.wpIdx].y;
          hopState.launched = false;
          hopState.landed = false;
        }
        const p = hopState.phase;
        const dx = hopState.tx - hopState.sx;
        const dy = hopState.ty - hopState.sy;
        tgtYaw = Math.atan2(-dx, dy);
        tgtEyeYaw = 0;

        if (p < 0.26) {
          // 阶段 1：蓄力压扁贴地
          const u = smoothstep(0, 1, p / 0.26);
          tgtX = hopState.sx; tgtY = hopState.sy; tgtLift = 0;
          tgtSXY = lerp(1.0, 1.28, u);
          tgtSZ  = 1.0 / (tgtSXY * tgtSXY);
        } else if (p < 0.74) {
          // 阶段 2 & 3：拉伸弹射 + 抛物线滞空
          const u = (p - 0.26) / 0.48;
          if (!hopState.launched) {
            hopState.launched = true;
            addPuddle(hopState.sx, hopState.sy, 8.5, 3.6, false);
            spawnHopSplash(hopState.sx, hopState.sy, 7, 0.78);
          }
          tgtX = lerp(hopState.sx, hopState.tx, u);
          tgtY = lerp(hopState.sy, hopState.ty, u);
          tgtLift = Math.sin(u * Math.PI) * 20.5;
          // 起跳与下落竖直拉伸，最高点略微回圆
          const airVel = Math.abs(Math.cos(u * Math.PI));
          tgtSXY = lerp(0.98, 0.80, airVel);
          tgtSZ  = 1.0 / (tgtSXY * tgtSXY);
        } else {
          // 阶段 4：砸地压扁 + 衰减阻尼二次果冻颤动回弹
          const u = (p - 0.74) / 0.26;
          if (!hopState.landed) {
            hopState.landed = true;
            addPuddle(hopState.tx, hopState.ty, 11.5, 4.4, false);
            spawnHopSplash(hopState.tx, hopState.ty, 12, 1.05);
            // 给内部亮核与金冠一个向下的砸地速度冲量，视觉 Q 弹爆棚！
            mainRig.coreSpring.vz -= 28;
            mainRig.crownSpring.vz -= 34;
          }
          tgtX = hopState.tx; tgtY = hopState.ty; tgtLift = 0;
          const damp = Math.exp(-u * 4.2);
          const osc = Math.cos(u * Math.PI * 3.0);
          tgtSXY = 1.0 + 0.30 * damp * osc;
          tgtSZ  = clamp(1.0 / (tgtSXY * tgtSXY), 0.56, 1.38);
        }
      }
    } else {
      // 4 个技能：全程连续弹性软体与弹簧物理表演（绝不切回僵硬定帧）
      const act = activeSkill;
      act.t += dt;
      const t = act.t;
      const st = act.state;
      tgtYaw = 0; tgtEyeYaw = 0;

      if (act.id === 'slam') {
        if (t < 0.45) {
          const p = t / 0.45;
          if (!st.warned) {
            st.warned = true;
            warnings.push({ x: DUMMY_POS.x, y: DUMMY_POS.y - 6, r: 22, t: 0, dur: 0.98 });
          }
          tgtSXY = lerp(1.0, 1.35, smoothstep(0, 1, p));
          tgtSZ  = clamp(1.0 / (tgtSXY * tgtSXY), 0.54, 1.45);
          tgtX = Math.sin(t * 58) * (0.5 + p * 0.9);
        } else if (t < 0.98) {
          const p = (t - 0.45) / 0.53;
          tgtY = lerp(0, DUMMY_POS.y - 6, smoothstep(0, 1, p));
          tgtLift = Math.sin(p * Math.PI) * 46;
          const stretch = Math.sin(p * Math.PI);
          tgtSXY = lerp(1.10, 0.78, stretch);
          tgtSZ  = lerp(0.88, 1.36, stretch);
          if (Math.random() < 0.55) {
            spawnParticle(
              mainRig.x + (Math.random() - 0.5) * 6, mainRig.y + (Math.random() - 0.5) * 6,
              mainRig.lift + 6, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, -4,
              0.35, 1.6, Math.random() < 0.5 ? 'hi' : 'mid', false, 38
            );
          }
        } else if (t < 1.58) {
          const p = (t - 0.98) / 0.60;
          tgtY = DUMMY_POS.y - 6;
          if (!st.slammed) {
            st.slammed = true;
            shakeMag = 7.5;
            hitDummy(1.6, 4.5, 14);
            addPuddle(DUMMY_POS.x, DUMMY_POS.y - 6, 24, 6.5, false);
            addSplashArc(DUMMY_POS.x, DUMMY_POS.y - 6, 12, 34, 0.52);
            addWaveRing(DUMMY_POS.x, DUMMY_POS.y - 6, 2.2, 8, 42, 0.46, 1.0);
            mainRig.coreSpring.vz -= 46;
            mainRig.crownSpring.vz -= 54;
            for (let i = 0; i < 36; i++) {
              const a = (i / 36) * TAU + Math.random() * 0.18, sp = 22 + Math.random() * 40;
              spawnParticle(DUMMY_POS.x, DUMMY_POS.y - 6, 4 + Math.random() * 4,
                Math.cos(a) * sp, Math.sin(a) * sp, 16 + Math.random() * 26,
                0.48 + Math.random() * 0.38, 2.0 + Math.random() * 1.1,
                i % 3 === 0 ? 'core' : (i % 3 === 1 ? 'hi' : 'mid'),
                i % 3 === 0 || curSkin.fx.sparkle, 58);
            }
          }
          const damp = Math.exp(-p * 3.2);
          const osc = Math.cos(p * Math.PI * 3.5);
          tgtSXY = 1.0 + 0.38 * damp * osc;
          tgtSZ  = clamp(1.0 - 0.42 * damp * osc, 0.52, 1.45);
          tgtLift = Math.max(0, -osc * damp * 6.0);
        } else {
          const p = clamp((t - 1.58) / (act.dur - 1.58), 0, 1);
          const hopPhase = (p * 2) % 1;
          tgtY = lerp(DUMMY_POS.y - 6, 0, smoothstep(0, 1, p));
          tgtLift = Math.sin(hopPhase * Math.PI) * 12;
          const hStr = Math.sin(hopPhase * Math.PI);
          tgtSXY = lerp(1.10, 0.88, hStr);
          tgtSZ  = lerp(0.90, 1.16, hStr);
        }
      } else if (act.id === 'spit') {
        if (!st.shots) {
          st.shots = [
            { tFire: 0.30, tx: DUMMY_POS.x - 2.2, tz: 16, fired: false },
            { tFire: 0.72, tx: DUMMY_POS.x + 2.0, tz: 19, fired: false },
            { tFire: 1.14, tx: DUMMY_POS.x,       tz: 17, fired: false }
          ];
        }
        if (t < 1.50) {
          const beat = Math.floor(t / 0.42);
          const sub = (t % 0.42) / 0.42;
          if (sub < 0.65) {
            const u = sub / 0.65;
            tgtSXY = lerp(1.0, 1.22, u); tgtSZ = lerp(1.0, 0.82, u); tgtY = -u * 2.8;
          } else {
            const u = (sub - 0.65) / 0.35;
            tgtSXY = lerp(1.22, 0.85, Math.sin(u * Math.PI));
            tgtSZ  = lerp(0.82, 1.20, Math.sin(u * Math.PI));
            tgtY   = lerp(-2.8, 3.2, Math.sin(u * Math.PI));
          }
          glowBoost = 1.4;
          for (const sh of st.shots) {
            if (!sh.fired && t >= sh.tFire) {
              sh.fired = true;
              mainRig.coreSpring.vy += 26;
              projectiles.push({
                x: 0, y: 11, z: 11, sx: 0, sy: 11, sz: 11,
                tx: sh.tx, ty: DUMMY_POS.y - 3, tz: sh.tz,
                t: 0, dur: 0.40, arc: 12 + beat * 2
              });
              for (let k = 0; k < 6; k++) {
                spawnParticle((Math.random() - 0.5) * 4, 12, 11,
                  (Math.random() - 0.5) * 18, 22 + Math.random() * 14, 6 + Math.random() * 10,
                  0.28, 1.5, k & 1 ? 'hi' : 'mid', k === 0, 36);
              }
            }
          }
        }
      } else if (act.id === 'split') {
        if (t < 0.48) {
          const p = t / 0.48;
          tgtSXY = lerp(1.0, 1.46, smoothstep(0, 1, p));
          tgtSZ  = lerp(1.0, 0.66, smoothstep(0, 1, p));
          tgtX = Math.sin(t * 74) * (0.8 + p * 1.4);
        } else if (t < 2.12) {
          if (!st.splitBurst) {
            st.splitBurst = true; shakeMag = 3.6;
            addSplashArc(0, 0, 8, 24, 0.42);
            for (let i = 0; i < 20; i++) {
              const a = (i / 20) * TAU;
              spawnParticle(0, 0, 8, Math.cos(a) * 24, Math.sin(a) * 24, 10 + Math.random() * 14,
                0.38, 1.8, i & 1 ? 'hi' : 'mid', i % 3 === 0, 44);
            }
          }
          customEntities = [];
          for (const side of [-1, 1]) {
            let sx = 0, sy = 0, slift = 0, sXY = 0.72, sZ = 0.72, sro = 0;
            if (t < 1.24) {
              const p = (t - 0.48) / 0.76, ep = smoothstep(0, 1, p);
              sx = side * (6 + Math.sin(ep * Math.PI) * 24);
              sy = lerp(0, DUMMY_POS.y - 4, ep);
              slift = Math.sin(ep * Math.PI * 2) * 3.5 + 1.5;
              sro = -side * Math.cos(ep * Math.PI) * 0.65;
              sXY = 0.72 * 1.08; sZ = 0.72 * 0.90;
              if (Math.random() < 0.35) {
                addPuddle(sx, sy, 4.2, 2.6, false);
                spawnParticle(sx, sy, 2, -side * 6, -10, 8, 0.3, 1.4, 'hi', false, 34);
              }
            } else if (t < 1.56) {
              const p = (t - 1.24) / 0.32, hitBounce = Math.sin(p * Math.PI * 2);
              sx = side * (7.5 + Math.abs(hitBounce) * 5.5);
              sy = DUMMY_POS.y - 4;
              slift = Math.abs(hitBounce) * 5.0;
              sXY = 0.72 * (1.0 + 0.22 * (1 - Math.abs(hitBounce)));
              sZ  = 0.72 * (1.0 - 0.18 * (1 - Math.abs(hitBounce)));
              sro = -side * 1.1;
              if (!st.hit1 && p > 0.05) { st.hit1 = true; shakeMag = 5.2; hitDummy(1.2, 2.2, 10); }
              if (!st.hit2 && p > 0.55) { st.hit2 = true; shakeMag = 6.0; hitDummy(1.4, 3.0, 12); }
            } else {
              const p = (t - 1.56) / 0.56, ep = smoothstep(0, 1, p);
              sx = lerp(side * 12, 0, ep); sy = lerp(DUMMY_POS.y - 4, 0, ep);
              slift = Math.sin(ep * Math.PI) * 16;
              sXY = 0.72 * lerp(1.05, 0.92, Math.sin(ep * Math.PI));
              sZ  = 0.72 * lerp(0.95, 1.12, Math.sin(ep * Math.PI));
            }
            customEntities.push({
              x: sx, y: sy, lift: slift, yaw: sro,
              scaleXY: sXY, scaleZ: sZ, eyeYawOff: 0,
              coreOffX: 0, coreOffY: 0, coreZ: 6.2 * sZ + Math.sin(animTime * 8 + side) * 0.6,
              crownZ: 15.8 * sZ + 0.8,
              bubOff: [
                { x: -5.4 * sXY, y: -3.5 * sXY, z: 7.4 * sZ },
                { x:  6.4 * sXY, y:  0.6 * sXY, z: 6.2 * sZ },
                { x:  2.0 * sXY, y: -5.8 * sXY, z: 8.4 * sZ }
              ],
              showCrown: curSkin.hasCrown && side > 0,
              glowBoost: 1.25
            });
          }
        } else {
          const p = clamp((t - 2.12) / (act.dur - 2.12), 0, 1);
          if (!st.merged) {
            st.merged = true; shakeMag = 3.8;
            addPuddle(0, 0, 15, 4.5, false);
            addSplashArc(0, 0, 8, 24, 0.45);
            mainRig.coreSpring.vz += 26;
            mainRig.crownSpring.vz += 34;
            for (let i = 0; i < 22; i++) {
              const a = (i / 22) * TAU;
              spawnParticle(0, 0, 10, Math.cos(a) * 26, Math.sin(a) * 26, 14 + Math.random() * 14,
                0.42, 1.9, i % 3 === 0 ? 'core' : 'hi', i % 2 === 0, 48);
            }
          }
          const bounce = Math.sin(p * Math.PI * 2) * (1 - p);
          tgtSXY = 1.0 + 0.24 * bounce; tgtSZ = 1.0 - 0.22 * bounce;
          tgtLift = Math.max(0, Math.sin(p * Math.PI) * 10);
        }
      } else if (act.id === 'wave') {
        if (t < 1.10) {
          const p = t / 1.10;
          if (!st.warned) { st.warned = true; warnings.push({ x: 0, y: 0, r: 54, t: 0, dur: 1.10 }); }
          const grow = lerp(1.0, 1.44, smoothstep(0, 1, p));
          const pulse = Math.sin(t * 28) * (0.02 + p * 0.04);
          tgtSXY = grow + pulse; tgtSZ = grow - pulse * 0.8;
          tgtX = Math.sin(t * 62) * p * 1.4; tgtY = Math.cos(t * 56) * p * 1.1;
          glowBoost = 1.0 + p * 1.1;
          if (Math.random() < 0.72) {
            const a = Math.random() * TAU, r = 6 + Math.random() * 10 * grow;
            spawnParticle(Math.cos(a) * r, Math.sin(a) * r, 4 + Math.random() * 12,
              Math.cos(a) * 4, Math.sin(a) * 4, 14 + Math.random() * 12,
              0.45, 1.8 + Math.random() * 0.8, Math.random() < 0.5 ? 'core' : 'hi', true, -6);
          }
        } else if (t < 1.65) {
          const p = (t - 1.10) / 0.55;
          if (!st.burst) {
            st.burst = true; shakeMag = 8.2;
            addPuddle(0, 0, 36, 6.0, true);
            addSplashArc(0, 0, 12, 46, 0.52);
            addWaveRing(0, 0, 2.0, 10, 62, 0.58, 1.45);
            addWaveRing(0, 0, 4.2,  8, 56, 0.54, 1.20);
            addWaveRing(0, 0, 6.4,  6, 48, 0.48, 0.90);
            mainRig.coreSpring.vz -= 36;
            for (let i = 0; i < 44; i++) {
              const a = (i / 44) * TAU + Math.random() * 0.14, sp = 28 + Math.random() * 48;
              spawnParticle(Math.cos(a) * 8, Math.sin(a) * 8, 4 + Math.random() * 6,
                Math.cos(a) * sp, Math.sin(a) * sp, 16 + Math.random() * 26,
                0.52 + Math.random() * 0.35, 2.0 + Math.random() * 1.1,
                i % 3 === 0 ? 'core' : (i % 3 === 1 ? 'hi' : 'mid'),
                i % 3 === 0 || curSkin.fx.sparkle, 54);
            }
          }
          if (!st.waveHitDummy && p > 0.38) {
            st.waveHitDummy = true; hitDummy(1.7, 7.5, 13); shakeMag = Math.max(shakeMag, 5.5);
          }
          const recoil = Math.sin(p * Math.PI * 2.5) * Math.exp(-p * 2.8);
          tgtSXY = lerp(0.76, 1.0, smoothstep(0, 0.45, p)) + recoil * 0.16;
          tgtSZ  = lerp(0.76, 1.0, smoothstep(0, 0.45, p)) - recoil * 0.16;
          glowBoost = lerp(2.1, 1.0, p);
        } else {
          const p = clamp((t - 1.65) / (act.dur - 1.65), 0, 1);
          const s = Math.sin(p * Math.PI * 2) * (1 - p) * 0.08;
          tgtSXY = 1.0 + s; tgtSZ = 1.0 - s;
        }
      }
      if (act.t >= act.dur) { activeSkill = null; syncUI(); }
    }

    // 平滑更新主史莱姆骨骼与二阶弹簧内核/气泡/金冠
    const directPos = (baseMode === 'hop' && !activeSkill) || !!activeSkill;
    mainRig.x = directPos ? tgtX : lerp(mainRig.x, tgtX, kSmooth);
    mainRig.y = directPos ? tgtY : lerp(mainRig.y, tgtY, kSmooth);
    mainRig.lift = directPos ? tgtLift : lerp(mainRig.lift, tgtLift, kSmooth);
    const dYaw = (((tgtYaw - mainRig.yaw + Math.PI) % TAU) + TAU) % TAU - Math.PI;
    mainRig.yaw += dYaw * kYaw;
    mainRig.scaleXY = lerp(mainRig.scaleXY, tgtSXY, 1 - Math.exp(-dt * 18));
    mainRig.scaleZ  = lerp(mainRig.scaleZ,  tgtSZ,  1 - Math.exp(-dt * 18));
    mainRig.eyeYawOff = lerp(mainRig.eyeYawOff, tgtEyeYaw, kYaw);
    mainRig.glowBoost = glowBoost;

    // 二阶弹簧推进：内核滞后浮沉 + 惯性甩动
    const tgtCoreZ = mainRig.lift + 5.8 * mainRig.scaleZ + Math.cos(animTime * 3.4) * 0.45;
    stepSpring3(mainRig.coreSpring, mainRig.x, mainRig.y, tgtCoreZ, dt, 145, 11.5);
    // 限制内核不突破果冻外壳物理边界（零穿模保障！）
    const cOffX = clamp(mainRig.coreSpring.x - mainRig.x, -3.2 * mainRig.scaleXY, 3.2 * mainRig.scaleXY);
    const cOffY = clamp(mainRig.coreSpring.y - mainRig.y, -3.2 * mainRig.scaleXY, 3.2 * mainRig.scaleXY);
    const cLocZ = clamp(mainRig.coreSpring.z - mainRig.lift, 2.2 * mainRig.scaleZ, 8.8 * mainRig.scaleZ);

    const tgtCrownZ = mainRig.lift + 15.6 * mainRig.scaleZ;
    stepSpring3(mainRig.crownSpring, mainRig.x, mainRig.y, tgtCrownZ, dt, 175, 12.5);
    const crLocZ = clamp(mainRig.crownSpring.z - mainRig.lift, 13.0 * mainRig.scaleZ, 21.0 * mainRig.scaleZ);

    const bubTargets = [
      { lx: -6.0 * mainRig.scaleXY, ly: -3.8 * mainRig.scaleXY, lz: 7.4 * mainRig.scaleZ + Math.sin(animTime * 2.8) * 0.4 },
      { lx:  7.0 * mainRig.scaleXY, ly:  0.6 * mainRig.scaleXY, lz: 6.2 * mainRig.scaleZ + Math.cos(animTime * 3.1) * 0.4 },
      { lx:  2.2 * mainRig.scaleXY, ly: -6.2 * mainRig.scaleXY, lz: 8.6 * mainRig.scaleZ + Math.sin(animTime * 2.5 + 1.1) * 0.4 }
    ];
    const bubOff = [];
    for (let i = 0; i < 3; i++) {
      const bt = bubTargets[i];
      const [wx, wy] = localToWorldXY(mainRig.x, mainRig.y, mainRig.yaw, bt.lx, bt.ly);
      stepSpring3(mainRig.bubSprings[i], wx, wy, mainRig.lift + bt.lz, dt, 130, 12);
      bubOff.push({
        x: clamp(mainRig.bubSprings[i].x - mainRig.x, -9.2 * mainRig.scaleXY, 9.2 * mainRig.scaleXY),
        y: clamp(mainRig.bubSprings[i].y - mainRig.y, -9.2 * mainRig.scaleXY, 9.2 * mainRig.scaleXY),
        z: clamp(mainRig.bubSprings[i].z - mainRig.lift, 3.2 * mainRig.scaleZ, 12.2 * mainRig.scaleZ)
      });
    }

    if (customEntities) return customEntities;

    return [{
      x: mainRig.x, y: mainRig.y, lift: mainRig.lift, yaw: mainRig.yaw,
      scaleXY: mainRig.scaleXY, scaleZ: mainRig.scaleZ,
      eyeYawOff: mainRig.eyeYawOff,
      coreOffX: cOffX, coreOffY: cOffY, coreZ: cLocZ,
      crownZ: crLocZ,
      bubOff,
      showCrown: curSkin.hasCrown,
      glowBoost: mainRig.glowBoost
    }];
  }

  // 在局部 actorBuf(220×220) 内按透明果冻层次拼合 + 1 次整体 1px 外轮廓
  function composeSlimeActor(buf, ent, c, s, outlineHex) {
    const { raw, rCtx, sil, sCtx, out, oCtx, glow, gCtx } = buf;
    rCtx.setTransform(1, 0, 0, 1, 0, 0);
    rCtx.globalCompositeOperation = 'source-over';
    rCtx.globalAlpha = 1; rCtx.imageSmoothingEnabled = false;
    rCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

    gCtx.setTransform(1, 0, 0, 1, 0, 0);
    gCtx.globalCompositeOperation = 'source-over';
    gCtx.globalAlpha = 1; gCtx.imageSmoothingEnabled = false;
    gCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

    let calls = 0, hasAnyGlow = false;

    function drawLocalPart(asset, id, lx, ly, lz, partYaw, sx, sz, alpha, symDeg, glowMode) {
      const rx = c * lx - s * ly;
      const ry = s * lx + c * ly;
      const px = ACTOR_AX + rx * BAKE_SCALE;
      const py = ACTOR_AY + ry * TILT * BAKE_SCALE - lz * BAKE_STEP;
      const sp = getBakedSprite(asset, id, partYaw + th, outlineHex, false, symDeg);
      const dw = Math.max(1, Math.round(sp.bw * sx));
      const dh = Math.max(1, Math.round(sp.bh * sz));
      const dx = Math.round(px - sp.anchorX * sx);
      const dy = Math.round(py - sp.anchorY * sz);

      rCtx.globalAlpha = alpha;
      rCtx.drawImage(sp.main, dx, dy, dw, dh);
      calls++;

      if (glowMode === 'add' && sp.glow) {
        hasAnyGlow = true;
        gCtx.globalCompositeOperation = 'source-over';
        gCtx.globalAlpha = 1;
        gCtx.drawImage(sp.glow, dx, dy, dw, dh);
        calls++;
      } else if (glowMode === 'translucentBody') {
        // 半透果冻外壳仅柔和衰减内层亮核（保留通透发光感），再叠加顶弧透亮窗
        if (hasAnyGlow) {
          gCtx.globalCompositeOperation = 'destination-out';
          gCtx.globalAlpha = 0.28;
          gCtx.drawImage(sp.main, dx, dy, dw, dh);
        }
        if (sp.glow) {
          hasAnyGlow = true;
          gCtx.globalCompositeOperation = 'source-over';
          gCtx.globalAlpha = 0.85;
          gCtx.drawImage(sp.glow, dx, dy, dw, dh);
          calls++;
        }
      } else if (glowMode === 'occlude' && hasAnyGlow) {
        gCtx.globalCompositeOperation = 'destination-out';
        gCtx.globalAlpha = 1;
        gCtx.drawImage(sp.main, dx, dy, dw, dh);
      }
    }

    // 1) 内层弹簧亮核（最先绘制，透过半透果冻壳隐约可见！）
    drawLocalPart(parts.core, 'core', ent.coreOffX, ent.coreOffY, ent.coreZ, ent.yaw,
      ent.scaleXY * 0.96, ent.scaleZ * 0.96, 1.0, 90, 'add');

    // 2) 半透弹性果冻主躯壳（alpha=0.84 透出内部弹簧亮核）
    drawLocalPart(parts.body, 'body', 0, 0, 0, ent.yaw,
      ent.scaleXY, ent.scaleZ, 0.84, 360, 'translucentBody');

    // 3) 3 颗弹簧立体小气泡（按当前镜头深度排序）
    const bubList = [
      { id: 'bubbleL', m: parts.bubbleL, o: ent.bubOff[0] },
      { id: 'bubbleR', m: parts.bubbleR, o: ent.bubOff[1] },
      { id: 'bubbleB', m: parts.bubbleB, o: ent.bubOff[2] }
    ];
    for (const b of bubList) b._ry = s * b.o.x + c * b.o.y;
    bubList.sort((a, b) => a._ry - b._ry);
    const bScale = Math.min(1.12, (ent.scaleXY + ent.scaleZ) * 0.5);
    for (const b of bubList) {
      // 仅前侧或高处气泡画在果冻表面，背侧气泡柔和半透
      const bAlpha = b._ry >= -1.5 ? 0.92 : 0.45;
      drawLocalPart(b.m, b.id, b.o.x, b.o.y, b.o.z, ent.yaw, bScale, bScale, bAlpha, 90, 'add');
    }

    // 4) 正面豆豆双眼（严格贴合弧面 Y=8.2，侧视 0 外凸、背面自然被果冻体遮挡）
    const eyeYaw = ent.yaw + ent.eyeYawOff;
    const [ex, ey] = localToWorldXY(0, 0, eyeYaw, 0, 8.2 * ent.scaleXY);
    const eyeRy = s * ex + c * ey;
    if (eyeRy > -0.8) {
      drawLocalPart(parts.eyes, 'eyes', ex, ey, 6.2 * ent.scaleZ, eyeYaw,
        Math.min(1.15, ent.scaleXY), Math.min(1.15, ent.scaleZ), 1.0, 360, 'occlude');
    }

    // 5) 皇冠金专属弹簧小金冠（稳坐顶峰之上）
    if (ent.showCrown) {
      const crScale = Math.min(1.12, ent.scaleXY * 0.92);
      drawLocalPart(parts.crown, 'crown', 0, -0.3, ent.crownZ, ent.yaw,
        crScale, Math.min(1.12, ent.scaleZ * 0.92), 1.0, 90, 'occlude');
    }

    rCtx.globalAlpha = 1; gCtx.globalAlpha = 1; gCtx.globalCompositeOperation = 'source-over';
    if (!useOutline) return { main: raw, glow: hasAnyGlow ? glow : null, calls };

    sCtx.setTransform(1, 0, 0, 1, 0, 0);
    sCtx.globalCompositeOperation = 'source-over';
    sCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    sCtx.drawImage(raw, 0, 0);
    sCtx.globalCompositeOperation = 'source-in';
    sCtx.fillStyle = outlineHex;
    sCtx.fillRect(0, 0, ACTOR_W, ACTOR_H);

    oCtx.setTransform(1, 0, 0, 1, 0, 0);
    oCtx.globalCompositeOperation = 'source-over';
    oCtx.imageSmoothingEnabled = false;
    oCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    oCtx.drawImage(sil, -1, 0);
    oCtx.drawImage(sil,  1, 0);
    oCtx.drawImage(sil, 0, -1);
    oCtx.drawImage(sil, 0,  1);
    oCtx.drawImage(raw, 0, 0);
    return { main: out, glow: hasAnyGlow ? glow : null, calls: calls + 5 };
  }

  function updateVFX(dt) {
    if (bannerTimer > 0) {
      bannerTimer -= dt;
      if (bannerTimer <= 0) document.getElementById('banner').classList.remove('show');
    }
    shakeMag = Math.max(0, shakeMag - dt * 16);
    shakeX = shakeMag ? (Math.random() - 0.5) * shakeMag * SCALE * 0.65 : 0;
    shakeY = shakeMag ? (Math.random() - 0.5) * shakeMag * SCALE * 0.65 : 0;
    dummyHit = Math.max(0, dummyHit - dt * 2.8);
    dummyTiltBack = Math.max(0, dummyTiltBack - dt * 10.0);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.vz -= p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.z < 0.5) { p.z = 0.5; p.vz = Math.abs(p.vz) * 0.35; p.vx *= 0.68; p.vy *= 0.68; }
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i];
      pr.t += dt;
      const u = clamp(pr.t / pr.dur, 0, 1);
      pr.x = lerp(pr.sx, pr.tx, u);
      pr.y = lerp(pr.sy, pr.ty, u);
      pr.z = lerp(pr.sz, pr.tz, u) + Math.sin(u * Math.PI) * pr.arc;
      if (Math.random() < 0.78) {
        spawnParticle(pr.x, pr.y, pr.z, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 3,
          0.26, 1.6, Math.random() < 0.5 ? 'hi' : 'mid', curSkin.fx.sparkle, 22);
      }
      if (u >= 1) {
        projectiles.splice(i, 1);
        shakeMag = Math.max(shakeMag, 3.2);
        hitDummy(1.0, 2.2, 10);
      }
    }
    for (let i = groundPuddles.length - 1; i >= 0; i--) {
      const pd = groundPuddles[i];
      pd.t += dt;
      if (pd.t >= pd.life) { groundPuddles.splice(i, 1); continue; }
      if (curSkin.fx.puddleBubbles && Math.random() < 0.16) {
        const a = Math.random() * TAU, rr = Math.random() * pd.r * 0.75;
        spawnParticle(pd.x + Math.cos(a) * rr, pd.y + Math.sin(a) * rr, 1.2,
          (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, 10 + Math.random() * 8,
          0.38, 1.6, Math.random() < 0.5 ? 'core' : 'hi', true, -4);
      }
    }
    for (let i = splashArcs.length - 1; i >= 0; i--) {
      splashArcs[i].t += dt;
      if (splashArcs[i].t >= splashArcs[i].life) splashArcs.splice(i, 1);
    }
    for (let i = dummySplashes.length - 1; i >= 0; i--) {
      const ds = dummySplashes[i];
      ds.t += dt; ds.oz -= dt * 1.4;
      if (ds.t >= ds.life || ds.oz < 5) dummySplashes.splice(i, 1);
    }
    for (let i = warnings.length - 1; i >= 0; i--) {
      warnings[i].t += dt;
      if (warnings[i].t >= warnings[i].dur) warnings.splice(i, 1);
    }
    for (let i = waveRings.length - 1; i >= 0; i--) {
      waveRings[i].t += dt;
      if (waveRings[i].t >= waveRings[i].life) waveRings.splice(i, 1);
    }
  }

  function drawStackRealtime(asset, x, y, zLift, ro, sc, scaleXY = 1, scaleZ = 1, alpha = 1) {
    const effXY = sc * scaleXY, effZ = sc * scaleZ;
    const [X, Y] = proj(x, y, zLift, sc);
    const a = ro + th, c = Math.cos(a), s = Math.sin(a);
    const X0 = Math.round(X), Y0 = Math.round(Y);
    const isRetro = MODES[modeIdx] === 'retro';
    const step = isRetro ? HS * scaleZ : Math.max(1, Math.round(HS * effZ));
    const halfStep = (!isRetro && step > Math.floor(TILT * effXY)) ? Math.max(1, Math.round(step * 0.5)) : 0;
    const { w, d, activeLayers, glowLayers, glowSlot, glowStrip, strip } = asset;
    const hasGlow = !!glowStrip && glowLayers.length > 0;
    const minGlowZ = hasGlow ? glowLayers[0] : 9999;
    const eScaleX = EW / CW, eScaleY = EH / CH;
    let calls = 0;

    mctx.globalAlpha = alpha;
    for (let li = 0; li < activeLayers.length; li++) {
      const z = activeLayers[li];
      const yy = isRetro ? (Y0 - z * HS * scaleZ) : (Y0 - z * step);
      const sx = z * w;
      if (halfStep) {
        mctx.setTransform(c * effXY, TILT * s * effXY, -s * effXY, TILT * c * effXY, X0, yy + halfStep);
        mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
        calls++;
      }
      mctx.setTransform(c * effXY, TILT * s * effXY, -s * effXY, TILT * c * effXY, X0, yy);
      mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      calls++;
      if (!hasGlow || z >= minGlowZ) {
        ectx.globalCompositeOperation = 'destination-out';
        ectx.setTransform(c * effXY * eScaleX, TILT * s * effXY * eScaleY, -s * effXY * eScaleX, TILT * c * effXY * eScaleY, X0 * eScaleX, yy * eScaleY);
        ectx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      }
      if (hasGlow && glowSlot[z] >= 0) {
        ectx.globalCompositeOperation = 'source-over';
        ectx.drawImage(glowStrip, glowSlot[z] * w, 0, w, d, -w / 2, -d / 2, w, d);
        calls++;
      }
    }
    mctx.globalAlpha = 1;
    ectx.globalCompositeOperation = 'source-over';
    return calls;
  }

  // 6. 主循环
  let last = 0, fpsAcc = 0, fpsFrames = 0, fpsVal = 60, statTimer = 0, cpuMsSmooth = 1.0;

  function tick(ms) {
    const tCpu0 = performance.now();
    const t = ms / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
    animTime += dt;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.4) { fpsVal = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }

    if (autoSpin && !drag) thTarget += dt * 0.55;
    if (!drag) th += (thTarget - th) * Math.min(1, dt * 8);

    const slimes = updateSlimeEntities(dt);
    updateVFX(dt);

    const mode = MODES[modeIdx];
    const sc = mode === 'retro' ? 1 : SCALE;
    const c = Math.cos(th), s = Math.sin(th);
    const eScale = EW / cv.width;
    const fx = curSkin.fx;
    let drawCalls = 0;

    const dummyShakeX = dummyHit > 0 ? Math.sin(animTime * 56) * dummyHit * 2.0 : 0;
    const dummyShakeY = (dummyHit > 0 ? Math.cos(animTime * 48) * dummyHit * 1.4 : 0) + dummyTiltBack;
    const dummyObj = {
      id: 'dummy', m: dummyAsset,
      x: DUMMY_POS.x + dummyShakeX, y: DUMMY_POS.y + dummyShakeY, lift: 0, ro: 0, symDeg: 360
    };

    // 1. 2× 苔藓石砖圆台缓冲 gbuf
    const bSize = platform.size, halfB = bSize * 0.5;
    gbctx.setTransform(GROUND_SUPERSAMPLE, 0, 0, GROUND_SUPERSAMPLE, 0, 0);
    gbctx.globalCompositeOperation = 'source-over';
    gbctx.imageSmoothingEnabled = false;
    gbctx.clearRect(0, 0, bSize, bSize);
    gbctx.drawImage(platform.base, 0, 0);

    gbctx.save();
    gbctx.translate(halfB, halfB);
    gbctx.beginPath();
    gbctx.arc(0, 0, platform.rInner, 0, TAU);
    gbctx.clip();

    for (const pd of groundPuddles) {
      const fade = clamp(1 - pd.t / pd.life, 0, 1);
      gbctx.save();
      gbctx.translate(pd.x, pd.y);
      if (pd.ring) {
        gbctx.strokeStyle = fx.puddleBase; gbctx.globalAlpha = fade * 0.65; gbctx.lineWidth = 7;
        gbctx.beginPath(); gbctx.arc(0, 0, pd.r, 0, TAU); gbctx.stroke();
        gbctx.strokeStyle = fx.puddleRim; gbctx.globalAlpha = fade * 0.55; gbctx.lineWidth = 2.4;
        gbctx.beginPath(); gbctx.arc(0, 0, pd.r - 1.5, 0, TAU); gbctx.stroke();
      } else {
        gbctx.globalAlpha = fade * 0.68; gbctx.fillStyle = fx.puddleBase;
        gbctx.beginPath(); gbctx.arc(0, 0, pd.r, 0, TAU); gbctx.fill();
        gbctx.beginPath(); gbctx.arc(pd.r * 0.55, pd.r * 0.35, pd.r * 0.45, 0, TAU); gbctx.fill();
        gbctx.beginPath(); gbctx.arc(-pd.r * 0.5, -pd.r * 0.32, pd.r * 0.38, 0, TAU); gbctx.fill();
        gbctx.globalAlpha = fade * 0.52; gbctx.fillStyle = fx.puddleRim;
        gbctx.beginPath(); gbctx.arc(-pd.r * 0.2, -pd.r * 0.15, pd.r * 0.55, 0, TAU); gbctx.fill();
        gbctx.globalAlpha = fade * 0.72; gbctx.fillStyle = fx.puddleBubble;
        gbctx.fillRect(Math.cos(pd.seed) * pd.r * 0.35, Math.sin(pd.seed) * pd.r * 0.35, 2.4, 2.4);
      }
      gbctx.restore();
    }

    for (const w of warnings) {
      const p = clamp(w.t / w.dur, 0, 1);
      gbctx.save();
      gbctx.translate(w.x, w.y);
      gbctx.strokeStyle = fx.warnStroke; gbctx.lineWidth = 2;
      gbctx.beginPath(); gbctx.arc(0, 0, w.r, 0, TAU); gbctx.stroke();
      gbctx.fillStyle = `rgba(${fx.warnFillRGB}, ${0.12 + p * 0.28})`;
      gbctx.beginPath(); gbctx.arc(0, 0, w.r * p, 0, TAU); gbctx.fill();
      gbctx.restore();
    }

    // 双层接地投影（随弹跳高度动态缩放淡化）
    for (const sl of slimes) {
      const lf = clamp(1 - sl.lift / 58, 0.22, 1.0);
      gbctx.save();
      gbctx.translate(sl.x, sl.y);
      gbctx.save();
      gbctx.globalAlpha = 0.34 * lf;
      gbctx.translate(2.4 + sl.lift * 0.14, -2.4 - sl.lift * 0.14);
      gbctx.rotate(sl.yaw);
      const fs = sl.scaleXY * (0.84 + 0.16 * lf);
      gbctx.scale(fs, fs);
      gbctx.drawImage(parts.body.footShadow, -parts.body.w / 2, -parts.body.d / 2);
      gbctx.restore();
      gbctx.fillStyle = `rgba(6, 12, 18, ${0.52 * lf})`;
      gbctx.beginPath(); gbctx.arc(0, 0, 11.2 * sl.scaleXY * (0.65 + 0.35 * lf), 0, TAU); gbctx.fill();
      gbctx.restore();
    }
    gbctx.save();
    gbctx.translate(dummyObj.x, dummyObj.y);
    gbctx.save();
    gbctx.globalAlpha = 0.34; gbctx.translate(2.4, -2.4);
    gbctx.drawImage(dummyAsset.footShadow, -dummyAsset.w / 2, -dummyAsset.d / 2);
    gbctx.restore();
    gbctx.fillStyle = 'rgba(6, 12, 18, 0.50)';
    gbctx.beginPath(); gbctx.arc(0, 0, dummyAsset.meta.footRadius, 0, TAU); gbctx.fill();
    gbctx.restore();
    gbctx.restore();

    // 2. 清理 1/4 亮核缓冲，贴天空 + 圆台
    ectx.setTransform(1, 0, 0, 1, 0, 0);
    ectx.globalCompositeOperation = 'source-over';
    ectx.imageSmoothingEnabled = false;
    ectx.clearRect(0, 0, EW, EH);

    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(bgc, 0, 0);
    drawCalls++;

    dctx.setTransform(c * SCALE, TILT * s * SCALE, -s * SCALE, TILT * c * SCALE,
      cv.width / 2 + shakeX, cv.height / 2 + 18 * SCALE + shakeY);
    dctx.drawImage(gbuf, -halfB, -halfB, bSize, bSize);
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    drawCalls++;

    let maxGlowBoost = 1.0;
    for (const sl of slimes) if (sl.glowBoost > maxGlowBoost) maxGlowBoost = sl.glowBoost;

    // 3. 按深度绘制史莱姆（整体 actorBuf 外轮廓）与训练靶桩
    if (mode === 'cached') {
      const dispRatio = SCALE / BAKE_SCALE;
      const drawItems = [{ kind: 'dummy', obj: dummyObj, ry: proj(dummyObj.x, dummyObj.y, 0, SCALE)[2] }];
      for (let i = 0; i < slimes.length; i++) {
        const sl = slimes[i];
        const composed = composeSlimeActor(actorBufs[i % actorBufs.length], sl, c, s, curSkin.outline);
        drawCalls += composed.calls;
        drawItems.push({ kind: 'slime', sl, composed, ry: proj(sl.x, sl.y, 0, SCALE)[2] });
      }
      drawItems.sort((a, b) => a.ry - b.ry);

      ectx.setTransform(1, 0, 0, 1, 0, 0);
      for (const it of drawItems) {
        if (it.kind === 'slime') {
          const [sx, sy] = proj(it.sl.x, it.sl.y, it.sl.lift, SCALE);
          const dw = Math.round(ACTOR_W * dispRatio);
          const dh = Math.round(ACTOR_H * dispRatio);
          const dx = Math.round(sx - ACTOR_AX * dispRatio);
          const dy = Math.round(sy - ACTOR_AY * dispRatio);
          dctx.drawImage(it.composed.main, dx, dy, dw, dh);
          drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(it.composed.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
          if (it.composed.glow) {
            ectx.globalCompositeOperation = 'source-over';
            ectx.drawImage(it.composed.glow, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
            drawCalls++;
          }
        } else {
          const [dxP, dyP] = proj(dummyObj.x, dummyObj.y, 0, SCALE);
          const sp = getBakedSprite(dummyAsset, 'dummy', th, curSkin.outline, useOutline, 360);
          const dw = Math.round(sp.bw * dispRatio), dh = Math.round(sp.bh * dispRatio);
          const dx = Math.round(dxP - sp.anchorX * dispRatio), dy = Math.round(dyP - sp.anchorY * dispRatio);
          dctx.drawImage(sp.main, dx, dy, dw, dh);
          drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(sp.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
        }
      }
      ectx.globalCompositeOperation = 'source-over';
    } else {
      mctx.setTransform(1, 0, 0, 1, 0, 0);
      mctx.globalCompositeOperation = 'source-over';
      mctx.imageSmoothingEnabled = false;
      mctx.clearRect(0, 0, CW, CH);

      const rtItems = [{ kind: 'dummy', ry: proj(dummyObj.x, dummyObj.y, 0, sc)[2] }];
      for (const sl of slimes) rtItems.push({ kind: 'slime', sl, ry: proj(sl.x, sl.y, 0, sc)[2] });
      rtItems.sort((a, b) => a.ry - b.ry);

      for (const it of rtItems) {
        if (it.kind === 'dummy') {
          drawCalls += drawStackRealtime(dummyAsset, dummyObj.x, dummyObj.y, 0, 0, sc, 1, 1, 1);
        } else {
          const sl = it.sl;
          drawCalls += drawStackRealtime(parts.core, sl.x + sl.coreOffX, sl.y + sl.coreOffY, sl.lift + sl.coreZ, sl.yaw, sc, sl.scaleXY * 0.95, sl.scaleZ * 0.95, 1);
          drawCalls += drawStackRealtime(parts.body, sl.x, sl.y, sl.lift, sl.yaw, sc, sl.scaleXY, sl.scaleZ, 0.85);
          const [ex, ey] = localToWorldXY(sl.x, sl.y, sl.yaw + sl.eyeYawOff, 0, 8.2 * sl.scaleXY);
          if (s * (ex - sl.x) + c * (ey - sl.y) > -0.8) {
            drawCalls += drawStackRealtime(parts.eyes, ex, ey, sl.lift + 6.2 * sl.scaleZ, sl.yaw + sl.eyeYawOff, sc, sl.scaleXY, sl.scaleZ, 1);
          }
          if (sl.showCrown) {
            drawCalls += drawStackRealtime(parts.crown, sl.x, sl.y - 0.3, sl.lift + sl.crownZ, sl.yaw, sc, sl.scaleXY * 0.92, sl.scaleZ * 0.92, 1);
          }
        }
      }
      const drawW = mode === 'retro' ? CW * SCALE : CW;
      const drawH = mode === 'retro' ? CH * SCALE : CH;
      if (useOutline) {
        octx.setTransform(1, 0, 0, 1, 0, 0);
        octx.globalCompositeOperation = 'source-over';
        octx.clearRect(0, 0, CW, CH);
        octx.drawImage(mc, 0, 0);
        octx.globalCompositeOperation = 'source-in';
        octx.fillStyle = curSkin.outline;
        octx.fillRect(0, 0, CW, CH);
        octx.globalCompositeOperation = 'source-over';
        const op = mode === 'retro' ? SCALE : Math.max(1, Math.round(SCALE * 0.30));
        for (const [ox, oy] of [[-op, 0], [op, 0], [0, -op], [0, op]]) dctx.drawImage(oc, ox, oy, drawW, drawH);
      }
      dctx.drawImage(mc, 0, 0, drawW, drawH);
    }

    // 3b. 前景落地黏液水花弧（画在角色之后，彻底扎根于苔藓石台）
    const pSc = mode === 'retro' ? 1 : SCALE;
    const toMain = mode === 'retro' ? SCALE : 1;
    const toE = toMain * eScale;

    if (splashArcs.length) {
      dctx.save();
      dctx.setTransform(1, 0, 0, 1, 0, 0);
      for (const sa of splashArcs) {
        const u = clamp(sa.t / sa.life, 0, 1);
        const rad = lerp(sa.r0, sa.r1, smoothstep(0, 1, u));
        const [px, py] = proj(sa.x, sa.y, 0.5, pSc);
        const cx = px * toMain, cy = py * toMain;
        const rx = rad * SCALE, ry = rx * TILT;
        dctx.strokeStyle = `rgba(${fx.splashRGB}, ${(1 - u) * 0.85})`;
        dctx.lineWidth = Math.max(1.6, SCALE * 0.36 * (1 - u * 0.5));
        dctx.beginPath();
        dctx.ellipse(cx, cy, rx, ry, 0, 0.12, Math.PI - 0.12);
        dctx.stroke();
      }
      dctx.restore();
    }

    // 4. 3D 像素技能特效
    function drawVoxelBlock(wx, wy, wz, szVox, color, isGlow) {
      const [px, py] = proj(wx, wy, wz, pSc);
      const sx = Math.round(px * toMain), sy = Math.round(py * toMain);
      const sPx = Math.max(2, Math.round(szVox * SCALE));
      dctx.fillStyle = color;
      dctx.fillRect(sx - (sPx >> 1), sy - (sPx >> 1), sPx, sPx);
      if (isGlow) {
        const es = Math.max(1, Math.round(sPx * eScale));
        ectx.fillStyle = color;
        ectx.fillRect(Math.round(px * toE) - (es >> 1), Math.round(py * toE) - (es >> 1), es, es);
      }
    }

    for (const ds of dummySplashes) {
      const u = ds.t / ds.life, sz = ds.sz * (1 - u * 0.5);
      drawVoxelBlock(DUMMY_POS.x + dummyShakeX + ds.ox, DUMMY_POS.y + dummyShakeY + ds.oy, ds.oz, sz, fx.dropMid, false);
      drawVoxelBlock(DUMMY_POS.x + dummyShakeX + ds.ox, DUMMY_POS.y + dummyShakeY + ds.oy - 0.3, ds.oz + 0.4, sz * 0.55, fx.dropHi, curSkin.fx.sparkle);
    }
    for (const pr of projectiles) {
      drawVoxelBlock(pr.x, pr.y, pr.z, 3.8, fx.dropDark, false);
      drawVoxelBlock(pr.x, pr.y, pr.z + 0.4, 3.0, fx.dropMid, true);
      drawVoxelBlock(pr.x, pr.y, pr.z + 1.0, 1.5, fx.core, true);
    }
    for (const rg of waveRings) {
      const u = clamp(rg.t / rg.life, 0, 1);
      const rad = lerp(rg.r0, rg.r1, smoothstep(0, 1, u));
      const bSz = Math.max(1.4, (1 - u * 0.45) * 3.0 * rg.thick);
      for (let i = 0; i < 32; i++) {
        const a = (i / 32) * TAU + u * 0.6;
        const wx = rg.x + Math.cos(a) * rad, wy = rg.y + Math.sin(a) * rad;
        const waveH = rg.z + Math.sin(a * 6 + animTime * 12) * 0.8;
        drawVoxelBlock(wx, wy, waveH - 0.8, bSz, fx.waveDark, false);
        drawVoxelBlock(wx, wy, waveH, bSz * 0.85, fx.waveMid, true);
        if ((i & 1) === 0) drawVoxelBlock(wx, wy, waveH + 1.1, bSz * 0.52, fx.waveHi, true);
      }
    }
    for (const p of particles) {
      const u = p.t / p.life;
      drawVoxelBlock(p.x, p.y, p.z, p.sz * (1 - u * 0.62), resolveRoleColor(p.role), p.glow);
    }
    for (const mt of ambientMotes) {
      const mz = ((mt.z + animTime * mt.sp) % 34) + 2;
      const mx = mt.x + Math.sin(animTime * 1.4 + mt.ph) * 4;
      const my = mt.y + Math.cos(animTime * 1.2 + mt.ph) * 4;
      drawVoxelBlock(mx, my, mz, 1.0, fx.dropHi, true);
    }

    // 5. 真 1/4 降采样离屏模糊
    const finalGlowAlpha = clamp(curSkin.glowAlpha * maxGlowBoost, 0, 1);
    if (finalGlowAlpha > 0.02) {
      ebctx.setTransform(1, 0, 0, 1, 0, 0);
      ebctx.clearRect(0, 0, EW, EH);
      ebctx.filter = `blur(${Math.max(1, Math.round(SCALE * 0.16))}px)`;
      ebctx.drawImage(ec, 0, 0);
      ebctx.filter = 'none';

      dctx.globalCompositeOperation = 'screen';
      dctx.imageSmoothingEnabled = true;
      dctx.globalAlpha = finalGlowAlpha;
      dctx.drawImage(eb, 0, 0, cv.width, cv.height);
      dctx.globalAlpha = finalGlowAlpha * 0.52;
      dctx.imageSmoothingEnabled = false;
      dctx.drawImage(ec, 0, 0, cv.width, cv.height);
      dctx.globalAlpha = 1;
      dctx.globalCompositeOperation = 'source-over';
      drawCalls += 2;
    }

    const cpuMs = performance.now() - tCpu0;
    cpuMsSmooth = cpuMsSmooth * 0.88 + cpuMs * 0.12;

    statTimer += dt;
    if (statTimer >= 0.25) {
      statTimer = 0;
      const hitRate = (cacheHits + cacheMisses) ? Math.round(cacheHits * 100 / (cacheHits + cacheMisses)) : 100;
      $('stats').innerHTML =
        `<span>建模 <b>${buildMs}ms</b></span>` +
        (skinMs > 0 ? `<span>换色 <b>${skinMs}ms</b></span>` : '') +
        `<span>帧率 <b>${fpsVal}fps</b></span>` +
        `<span>单帧 <b>${cpuMsSmooth.toFixed(1)}ms</b></span>` +
        `<span>绘制 <b>${drawCalls}次</b></span>` +
        `<span>色表 <b>${PAL_KEYS.length}色</b></span>` +
        (mode === 'cached' ? `<span>缓存 <b>${spriteCache.size}</b> (${hitRate}%)</span>` : '');
    }

    requestAnimationFrame(tick);
  }

  // 7. HUD 绑定与交互
  const $ = id => document.getElementById(id);

  function buildBars() {
    const sb = $('skinBar');
    sb.innerHTML = '';
    SKINS.forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="swatch" style="background:${sk.dot}"></span>${sk.name}（${sk.tag}）`;
      btn.onclick = () => applySkin(idx, true);
      sb.appendChild(btn);
    });
    const kb = $('skillBar');
    kb.innerHTML = '';
    SKILLS.forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.className = 'skill-btn';
      btn.textContent = `${idx + 1}. ${sk.name}`;
      btn.onclick = () => startSkill(idx);
      kb.appendChild(btn);
    });
  }

  function syncUI() {
    $('skinBadge').textContent = `${curSkin.name} · ${curSkin.tag}`;
    $('skinBar').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === skinIdx));
    $('skillBar').querySelectorAll('button').forEach((b, i) => {
      b.classList.toggle('active', !!(activeSkill && activeSkill.id === SKILLS[i].id));
    });
    $('btnIdle').classList.toggle('on', !activeSkill && baseMode === 'idle');
    $('btnHop').classList.toggle('on', !activeSkill && baseMode === 'hop');
    $('btnSpin').classList.toggle('on', autoSpin);
    $('btnOutline').classList.toggle('on', useOutline);
    $('btnMode').textContent = '模式：' + MODE_LABEL[MODES[modeIdx]];
    $('btnMode').classList.toggle('on', MODES[modeIdx] === 'cached');
  }

  $('btnIdle').onclick = () => { activeSkill = null; baseMode = 'idle'; syncUI(); showBanner('果冻生态 · 原地颤动', 1.1); };
  $('btnHop').onclick  = () => {
    activeSkill = null; baseMode = 'hop';
    hopState.sx = mainRig.x; hopState.sy = mainRig.y; hopState.phase = 0; hopState.launched = false; hopState.landed = false;
    syncUI(); showBanner('果冻生态 · 弹性蹦跳巡游', 1.2);
  };
  $('btnSpin').onclick = () => { autoSpin = !autoSpin; syncUI(); };
  $('btnOutline').onclick = () => { useOutline = !useOutline; syncUI(); };
  $('btnMode').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; fit(); syncUI(); };
  $('btnReset').onclick = () => {
    thTarget = 0.52;
    th = thTarget + (((th - thTarget + Math.PI) % TAU + TAU) % TAU - Math.PI);
    zoom = 0; autoSpin = false; baseMode = 'idle'; activeSkill = null; fit(); syncUI();
  };
  $('btnExport').onclick = () => {
    const asset = parts.body;
    const a = document.createElement('a');
    a.download = `slime_${curSkin.id}_body_${asset.w}x${asset.d}x${asset.h}.png`;
    a.href = asset.strip.toDataURL('image/png');
    a.click();
  };

  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, th }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (drag) { th = thTarget = drag.th + (e.clientX - drag.x) * 0.01; } });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => {
    zoom = clamp(zoom + (e.deltaY > 0 ? -1 : 1), -2, 5);
    fit(); e.preventDefault();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'q' || e.key === 'Q') thTarget -= Math.PI / 4;
    if (e.key === 'e' || e.key === 'E') thTarget += Math.PI / 4;
    if (e.key === 'c' || e.key === 'C') applySkin(skinIdx + 1, true);
    if (e.key === 's' || e.key === 'S') {
      activeSkill = null;
      baseMode = baseMode === 'hop' ? 'idle' : 'hop';
      if (baseMode === 'hop') {
        hopState.sx = mainRig.x; hopState.sy = mainRig.y; hopState.phase = 0; hopState.launched = false; hopState.landed = false;
      }
      syncUI();
      showBanner(baseMode === 'hop' ? '果冻生态 · 弹性蹦跳巡游' : '果冻生态 · 原地颤动', 1.2);
    }
    if (e.key >= '1' && e.key <= '4') startSkill(Number(e.key) - 1);
  });
  window.addEventListener('resize', fit);

  window.__SLIME_DEBUG__ = {
    getStats: () => ({
      buildMs: Number(buildMs),
      skinMs, skin: curSkin.id, hasCrown: curSkin.hasCrown, baseMode,
      fps: fpsVal, cpuMs: Number(cpuMsSmooth.toFixed(2)),
      cacheSize: spriteCache.size, cacheHits, cacheMisses,
      th, zoom, mode: MODES[modeIdx], paletteCount: PAL_KEYS.length,
      activeSkill: activeSkill ? activeSkill.id : null
    }),
    setAngle: a => { th = thTarget = a; },
    setSkin: idOrIdx => {
      const idx = typeof idOrIdx === 'number' ? idOrIdx : SKINS.findIndex(s => s.id === idOrIdx);
      if (idx >= 0) applySkin(idx, false);
    },
    setBaseMode: m => { activeSkill = null; baseMode = m; syncUI(); },
    cycleSkin: () => applySkin(skinIdx + 1, true),
    getSkin: () => curSkin.id,
    triggerSkill: i => startSkill(i),
    setAutoSpin: v => { autoSpin = v; syncUI(); },
    setZoom: z => { zoom = clamp(z, -2, 5); fit(); }
  };

  buildBars(); fit(); syncUI(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
