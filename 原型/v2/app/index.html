<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>code00 v2 · 落果密林</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b110c; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; background: #000; }
  #perf { position: fixed; left: 8px; top: 8px; margin: 0; padding: 6px 10px; color: #b8ffb8; background: rgba(0,0,0,0.72); font: 13px/1.45 monospace; white-space: pre; pointer-events: none; border-radius: 4px; z-index: 9; }
  #err { position: fixed; left: 8px; bottom: 8px; color: #ff9a8a; font: 14px/1.4 sans-serif; white-space: pre-wrap; max-width: 90vw; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="err"></div>
<pre id="perf" hidden></pre>

<!-- 游戏实装美术库（美术/游戏实装美术库/）：方案 4.2 清单的 31 个资产脚本，只读引用，一个字不改。
     开发时 /art/ 由 tools/serve.js 映射到实装库目录；导出时 tools/export-web.js 把用到的抽进 art/ 并改写路径。
     加载失败或网址带 ?art=blocks 时，画面自动退回色块。 -->
<!-- 工坊内核（6） -->
<script src="../art/core/math.js"></script>
<script src="../art/core/voxel.js"></script>
<script src="../art/core/solvers.js"></script>
<script src="../art/core/behaviors.js"></script>
<script src="../art/core/renderer.js"></script>
<script src="../art/core/registry.js"></script>
<!-- 地貌色板（1） -->
<script src="../art/scenes/habitats.js"></script>
<!-- 生态摆件（11）：林地、泥泽、花甸、树冠、营火与行商 -->
<script src="../art/scenes/scene_forest_tree.js"></script>
<script src="../art/scenes/scene_t09_fallen_fruit_log.js"></script>
<script src="../art/scenes/scene_t17_swamp_cypress.js"></script>
<script src="../art/scenes/scene_flora_cluster.js"></script>
<script src="../art/scenes/scene_t10_giant_bud.js"></script>
<script src="../art/scenes/scene_t16_moss_obelisk.js"></script>
<script src="../art/scenes/scene_t11_canopy_bough.js"></script>
<script src="../art/scenes/scene_t11_epiphyte_nest.js"></script>
<script src="../art/scenes/scene_campfire.js"></script>
<script src="../art/scenes/scene_rock_hollow.js"></script>
<script src="../art/scenes/scene_crates_sign.js"></script>
<!-- 怪物（8） -->
<script src="../art/creatures/slime.js"></script>
<script src="../art/creatures/earth2_barometz.js"></script>
<script src="../art/creatures/goblin.js"></script>
<script src="../art/creatures/fairy.js"></script>
<script src="../art/creatures/earth6_long_arm.js"></script>
<script src="../art/creatures/earth3_zheng.js"></script>
<script src="../art/creatures/earth1_belly_maw.js"></script>
<script src="../art/creatures/tree3_leshy.js"></script>
<!-- 主角与行商（2） -->
<script src="../art/npc/npc_mage.js"></script>
<script src="../art/npc/npc_gear_smith.js"></script>
<!-- 建筑（3） -->
<script src="../art/buildings/building_ruin_arch.js"></script>
<script src="../art/buildings/building_camp_tent.js"></script>
<script src="../art/buildings/building_stone_gate.js"></script>

<!-- 界面与特效包（实装库 art-packs/），都挂在 window.Code00ArtPacks 上：
     UI-01 皮肤与通用控件 -> uiSkin；UI-02A 宝石与秘术牌、UI-02B 印记 / 雕琢 / 战利品图标 -> 合并挂在 cards；
     UI-03 卷轴地图与非战斗装饰 -> mapPanels；UI-04 旋转像素地面与 3D 特效 -> groundVfx。
     modules/ui/skin.js 在首帧前统一初始化前四个，世界舞台用 UI-04。
     没加载上、缺了某个函数或网址带 ?art=blocks 时，对应的画法自动退回内置色块兜底。 -->
<script src="../art/art-packs/pack_ui_skin.js"></script>
<script src="../art/art-packs/pack_cards.js"></script>
<script src="../art/art-packs/pack_icons.js"></script>
<script src="../art/art-packs/pack_map_panels.js"></script>
<script src="../art/art-packs/pack_ground_vfx.js"></script>

<script type="module" src="./main.js"></script>
</body>
</html>
