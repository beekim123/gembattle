<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>异世界生态 · 像素堆叠工坊</title>
<link rel="stylesheet" href="app/ecology.css">
</head>
<body>
<header class="eco-top">
  <a class="back-btn" href="index.html">← 回工坊</a>
  <nav class="crumb" id="crumb" aria-label="导航路径"></nav>
  <div class="spacer"></div>
  <div class="search-box">
    <input type="search" id="q" placeholder="搜编号、生物、生境…" autocomplete="off">
    <div class="search-drop" id="searchDrop"></div>
  </div>
  <div class="status-legend" id="statusLegend"></div>
  <button class="ghost-btn" id="btnRef" title="打开速查表（完整数据见 文档/生态设计-对应关系.md）">速查表</button>
</header>

<main class="eco-main" id="ecoMain">
  <!-- 视图一：世界平面地图（首页） -->
  <section class="view-panel" id="viewMap">
    <div class="map-canvas-shell">
      <div class="map-svg-box" id="mapSvgBox"></div>
      <div class="map-hover-bar" id="mapHoverBar">
        <div class="mhb-empty">将鼠标停在任意生境区域，看住在这里的生物；点击进入实时生态舞台。</div>
      </div>
      <div class="map-flow-legend" id="mapFlowLegend"></div>
      <div class="map-flow-tip" id="mapFlowTip"></div>
    </div>
  </section>

  <!-- 视图二：生境生态舞台 -->
  <section class="view-panel" id="viewHab" hidden>
    <div class="hab-bar" id="habBar"></div>
    <div class="hab-workspace" id="habWorkspace">
      <div class="stage-host" id="habStageHost">
        <!-- 唯一的共享舞台壳将被动态挂到这里 -->
        <button class="side-toggle" id="toggleHabSide" title="收起 / 展开右侧食物链栏">›</button>
      </div>
      <aside class="chain-panel" id="chainPanel"></aside>
    </div>
  </section>

  <!-- 视图三：单只生物百科（大舞台为主，右侧精简窄栏可一键收起） -->
  <section class="view-panel" id="viewBio" hidden>
    <div class="bio-workspace" id="bioWorkspace">
      <div class="stage-host bio-stage-host" id="bioStageHost">
        <a class="bio-float-back" id="bioFloatBack" href="#map">← 回生境</a>
        <a class="bio-side-nav prev" id="bioPrev" href="#map" title="上一只（←）">‹</a>
        <a class="bio-side-nav next" id="bioNext" href="#map" title="下一只（→）">›</a>
        <div class="bio-skin-float" id="bioSkinFloat"></div>
        <button class="side-toggle" id="toggleBioSide" title="收起 / 展开右侧百科栏">›</button>
      </div>
      <article class="bio-card" id="bioCard"></article>
    </div>
  </section>
</main>

<!-- 全页唯一的像素堆叠渲染器挂载壳（在生境与百科之间复用，离开即停） -->
<div class="shared-stage" id="sharedStage" hidden>
  <canvas id="stageCanvas"></canvas>
  <canvas id="stageOverlay"></canvas>
  <div class="stage-badge" id="stageBadge"></div>
  <div class="stage-perf" id="stagePerf"></div>
  <div class="stage-controls" id="stageControls">
    <button class="sc-btn on" id="scWeb" title="开关舞台上的食物链与共生箭头">关系线</button>
    <button class="sc-btn on" id="scTags" title="显示台上生物编号牌">编号牌</button>
    <span class="sc-sep"></span>
    <button class="sc-btn on" id="scPatrol" title="切换自由巡游 / 原地待机（S）">巡游</button>
    <button class="sc-btn" id="scSpin" title="自动转视角">自动转</button>
    <button class="sc-btn on" id="scOutline" title="开关整体描边">描边</button>
    <span class="sc-sep"></span>
    <button class="sc-btn" id="scZoomOut" title="缩小">－</button>
    <span class="sc-zoom" id="scZoomLbl">×4</span>
    <button class="sc-btn" id="scZoomIn" title="放大">＋</button>
    <button class="sc-btn" id="scReset" title="重置视角">回正</button>
  </div>
</div>

<!-- 不显眼的速查抽屉（完整表格已在 文档/生态设计-对应关系.md） -->
<div class="ref-scrim" id="refScrim"></div>
<aside class="ref-drawer" id="refDrawer">
  <div class="ref-head">
    <b>数据速查</b>
    <span class="muted">完整对照见 <code>文档/生态设计-对应关系.md</code></span>
    <button class="ref-close" id="refClose" title="关闭">×</button>
  </div>
  <div class="ref-tabs" id="refTabs">
    <button data-rt="niche" class="on">生态位 × 生境</button>
    <button data-rt="tpl">模板 M01~M38</button>
    <button data-rt="flows">生境连接</button>
  </div>
  <div class="ref-body" id="refBody"></div>
</aside>
