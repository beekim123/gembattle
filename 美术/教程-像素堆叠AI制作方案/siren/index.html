  function renderSkyCache() {
    const fx = curSkin.fx;
    bgc.width = Math.max(1, cv.width);
    bgc.height = Math.max(1, cv.height);
    bgctx.setTransform(1, 0, 0, 1, 0, 0);
    const sky = bgctx.createLinearGradient(0, 0, 0, bgc.height);
    sky.addColorStop(0, fx.skyTop);
    sky.addColorStop(0.55, fx.skyMid);
    sky.addColorStop(1, fx.skyBot);
    bgctx.fillStyle = sky;
    bgctx.fillRect(0, 0, bgc.width, bgc.height);
    const halo = bgctx.createRadialGradient(
      bgc.width * 0.5, bgc.height * 0.44, 14,
      bgc.width * 0.5, bgc.height * 0.44, bgc.height * 0.54
    );
    halo.addColorStop(0, fx.skyHalo);
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    bgctx.fillStyle = halo;
    bgctx.fillRect(0, 0, bgc.width, bgc.height);
  }

  function fit() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const cssW = window.innerWidth, cssH = window.innerHeight;
    cv.width = Math.floor(cssW * DPR);
    cv.height = Math.floor(cssH * DPR);
    const logicalScale = Math.max(2, Math.round(cssH / 140) + zoom);
    SCALE = Math.max(2, Math.round(logicalScale * DPR));

    const mode = MODES[modeIdx];
    if (mode === 'retro') {
      CW = Math.ceil(cv.width / SCALE); CH = Math.ceil(cv.height / SCALE);
    } else {
      CW = cv.width; CH = cv.height;
    }
    if (mode === 'cached') {
      mc.width = oc.width = 1; mc.height = oc.height = 1;
    } else {
      mc.width = oc.width = CW; mc.height = oc.height = CH;
    }
    EW = Math.max(1, Math.ceil(cv.width / 4));
    EH = Math.max(1, Math.ceil(cv.height / 4));
    ec.width = eb.width = EW; ec.height = eb.height = EH;
    renderSkyCache();
  }

  function proj(x, y, z, sc) {
    const c = Math.cos(th), s = Math.sin(th);
    const rx = c * x - s * y, ry = s * x + c * y;
    const mode = MODES[modeIdx];
    const step = mode === 'retro' ? HS : (mode === 'cached' ? HS * sc : Math.max(1, Math.round(HS * sc)));
    const sx = mode === 'retro' ? shakeX / SCALE : shakeX;
    const sy = mode === 'retro' ? shakeY / SCALE : shakeY;
    return [CW / 2 + rx * sc + sx, CH / 2 + 18 * sc + ry * TILT * sc - z * step + sy, ry];
  }

  // 5. 120fps 鱼类生物运动学驱动（真实脉冲拍尾推进 + 海豚潜浮破水 + 零穿模）
  function updateRigAndSkills(dt) {
    const fx = curSkin.fx;
    const kSlow = 1 - Math.exp(-dt * 8.5);
    const kMid  = 1 - Math.exp(-dt * 12.0);
    const kFast = 1 - Math.exp(-dt * 16.0);

    // 浅水划尾待机默认值（下半尾真实浸在浅水中划水，身体随划水反作用力柔软呼吸轻摆！）
    const treadBeat = Math.sin(animTime * 2.8);
    const treadDouble = Math.sin(animTime * 5.6);
    let tgtX = 0, tgtY = 0;
    let tgtLift = 1.2 + treadDouble * 0.75; // 贴近水面，绝不高空飘浮！
    // 鱼类平衡反扭：尾鳍往左划水时，腰胸微微往右轻摆保持重心
    let tgtYaw = -treadBeat * 0.10;
    let tgtTorsoYaw = treadBeat * 0.08;
    let tgtHeadYaw = Math.sin(animTime * 1.15) * 0.24 - treadBeat * 0.08;
    let tgtHeadZ = treadDouble * 0.35;

    const flourCy = animTime % 4.6;
    const flourish = flourCy > 3.1 && flourCy < 4.3 ? Math.sin(((flourCy - 3.1) / 1.2) * Math.PI) : 0;
    let tgtArmLYaw = Math.sin(animTime * 2.8) * 0.16 - flourish * 0.45;
    let tgtArmLZ   = Math.cos(animTime * 2.8) * 0.75 + flourish * 2.8;
    let tgtArmRYaw = -Math.sin(animTime * 2.8) * 0.10;
    let tgtArmRZ   = Math.sin(animTime * 2.8 + 0.6) * 0.65;
    let tgtTriLift = Math.sin(animTime * 2.8 + 0.9) * 0.6;
    let wantTriStyle = 'hold';
    let wantSwimPose = false;
    let tailWaveSpd = 2.8, tailWaveAmp = 1.0;

    const sState = {
      glowBoost: 1.0,
      fountainWarn: null,
      fountainCol: null,
      waveWall: null,
      bubble: null
    };
    let targetDummyLift = 0;

    if (!activeSkill) {
      if (baseMode === 'swim') {
        // =========================================================================
        // 鱼类核心运动学：俯身 48° 流线泳姿 + 脉冲拍尾加速滑行 (Burst-and-Glide) + 潜浮破水！
        // =========================================================================
        wantSwimPose = true;
        wantTriStyle = 'swim';

        // 1. 脉冲拍尾推进相位：每半个周期用力甩一次大尾鳍 -> 产生明显向前冲刺的速度脉冲，随后滑行！
        const strokeFreq = 5.4;
        swimPhase += dt * strokeFreq;
        const thrustPulse = Math.pow(Math.abs(Math.sin(swimPhase)), 2.2); // 拍尾瞬间冲力最大！
        const angularSpeed = 0.44 + thrustPulse * 0.68; // 一蹿一滑的真实鱼类游动节奏！
        swimAngle += dt * angularSpeed;

        // 2. 鱼类游动时的左右蛇行偏航（Head-to-Tail S 波，舒适绕池不撞 HUD）
        const R = 25.5 + Math.sin(swimAngle * 2.0) * 4.5;
        const baseX = Math.cos(swimAngle) * R;
        const baseY = Math.sin(swimAngle) * R - 2.5;
        const nx = Math.cos(swimAngle), ny = Math.sin(swimAngle);
        const sideSway = Math.sin(swimPhase) * 2.6;
        tgtX = baseX + nx * sideSway;
        tgtY = baseY + ny * sideSway;

        // 切线朝向 + 鱼类游动头部轻微反相摆动
        const vx = -Math.sin(swimAngle), vy = Math.cos(swimAngle);
        const tangentYaw = Math.atan2(-vx, vy);
        tgtYaw = tangentYaw + Math.cos(swimPhase) * 0.16;
        tgtTorsoYaw = -Math.cos(swimPhase) * 0.12;
        tgtHeadYaw = Math.cos(swimPhase) * 0.18;

        // 3. 海豚/人鱼波浪潜浮（Porpoising）：周期性压头半潜入水 -> 破水扬身跃出！
        //    diveWave ∈ [-1, +1]：低谷时腰尾沉入浅水下、肩背破开水花；波峰时破水跃起带出浪环！
        const diveWave = Math.sin(animTime * 2.15);
        tgtLift = -4.2 + diveWave * 4.8; // -9.0(半潜水中) ↔ +0.6(破水跃起)！
        tgtHeadZ = diveWave * 1.1;

        // 破水/入水瞬间在腰身处激发清晰破浪白环与水花！
        if ((prevDiveSign <= 0 && diveWave > 0) || (prevDiveSign > 0 && diveWave <= 0)) {
          addRipple(rig.x, rig.y, 4, 24, 0.78, 2.2);
          spawnWaterSplash(rig.x, rig.y, 10, diveWave > 0 ? 1.15 : 0.85);
        }
        prevDiveSign = diveWave;

        // 双臂贴水划动
        tgtArmLYaw = -0.15 + Math.sin(swimPhase) * 0.24;
        tgtArmLZ = Math.cos(swimPhase) * 0.8;
        tgtArmRYaw = 0.12 - Math.sin(swimPhase) * 0.14;
        tgtArmRZ = 0.4;
        tgtTriLift = 0.2;

        // 持续生成 V 形水面破浪尾迹（Kelvin Wake）与拍尾水花！
        wakeCd -= dt;
        if (wakeCd <= 0) {
          wakeCd = 0.085;
          addWake(rig.x, rig.y, tangentYaw, 7.5 + thrustPulse * 4.5, 1.05);
          if (thrustPulse > 0.78) {
            const te = tailNodes[TAIL_COUNT - 1];
            addRipple(te.x, te.y, 3, 18, 0.65, 1.7);
            spawnWaterSplash(te.x, te.y, 4, 0.75);
          }
        }
      } else {
        // 浅水划尾待机：每次大尾鳍拍过中线时，在水面激起一圈轻柔小水花！
        tailSplashCd -= dt;
        if (tailSplashCd <= 0 && Math.abs(Math.cos(animTime * 2.8)) > 0.92) {
          tailSplashCd = 0.72;
          const te = tailNodes[TAIL_COUNT - 1];
          addRipple(te.x, te.y, 3, 16, 0.75, 1.3);
          spawnWaterSplash(te.x, te.y, 3, 0.55);
        }
        if (flourish > 0.45) {
          idleSparkCd -= dt;
          if (idleSparkCd <= 0) {
            idleSparkCd = 0.16;
            const [lx, ly] = localToWorldXY(rig.x, rig.y, rig.yaw + rig.torsoYaw, -7.8, 5.2);
            spawnParticle(lx, ly, rig.lift + 23.5 + rig.armLZ,
              (Math.random() - 0.5) * 6, 3 + Math.random() * 4, 6 + Math.random() * 6,
              0.55, 1.45, Math.random() < 0.5 ? fx.core : fx.hot, true, 6);
          }
        }
      }
    } else {
      // 4 个控水技能：全骨骼连续表演（零僵死帧）
      const act = activeSkill;
      act.t += dt;
      const t = act.t;
      const st = act.state;

      if (act.id === 'songRipple') {
        tailWaveSpd = 3.8; tailWaveAmp = 1.25;
        if (t < 0.35) {
          const p = smoothstep(0, 1, t / 0.35);
          tgtLift = lerp(1.2, 4.6, p);
          tgtArmLYaw = -p * 0.62; tgtArmLZ = p * 3.4;
          tgtArmRYaw =  p * 0.46; tgtArmRZ = p * 2.2;
          tgtHeadZ = p * 1.1;
          sState.glowBoost = 1.0 + p * 0.6;
        } else if (t < 2.05) {
          const beat = Math.sin(t * 5.2);
          tgtLift = 4.6 + Math.sin(t * 6.5) * 0.85;
          tgtYaw = Math.sin(t * 3.2) * 0.18;
          tgtTorsoYaw = Math.sin(t * 4.2) * 0.15;
          tgtHeadYaw = Math.sin(t * 4.2 + 0.5) * 0.28;
          tgtHeadZ = 1.1 + beat * 0.4;
          tgtArmLYaw = -0.62 + beat * 0.22; tgtArmLZ = 3.4 + Math.cos(t * 5.2) * 0.9;
          tgtArmRYaw =  0.46 - beat * 0.18; tgtArmRZ = 2.2 + Math.sin(t * 5.2) * 0.8;
          tgtTriLift = 2.4 + beat * 0.8;
          sState.glowBoost = 1.65;
          const ringTimes = [0.38, 0.74, 1.10, 1.46];
          for (let k = 0; k < ringTimes.length; k++) {
            if (!st['r' + k] && t >= ringTimes[k]) {
              st['r' + k] = true;
              addRipple(rig.x, rig.y, 10, 72, 0.95, 2.6);
              addRing3D(rig.x, rig.y, 6 + k * 2.5, 10, 62, 0.78, k & 1 ? fx.hot : fx.mid, true);
              for (let n = 0; n < 3; n++) {
                const ang = -0.55 + n * 0.55 + (Math.random() - 0.5) * 0.2;
                notes.push({
                  sx: Math.sin(ang) * 10, sy: Math.cos(ang) * 8 + 4, sz: 22 + n * 4,
                  tx: DUMMY_POS.x + (Math.random() - 0.5) * 5, ty: DUMMY_POS.y - 2, tz: 18 + (Math.random() - 0.5) * 6,
                  t: 0, dur: 0.62 + n * 0.12, phase: Math.random() * TAU
                });
              }
            }
          }
        }
      } else if (act.id === 'waterFountain') {
        tailWaveSpd = 4.6; tailWaveAmp = 1.35;
        if (t < 0.28) {
          const p = smoothstep(0, 1, t / 0.28);
          tgtLift = lerp(1.2, 4.2, p);
          tgtYaw = -p * 0.28;
          tgtArmRYaw = -p * 0.45; tgtArmRZ = p * 3.0; tgtTriLift = p * 3.2;
          sState.glowBoost = 1.45;
        } else if (t < 0.62) {
          const p = (t - 0.28) / 0.34;
          tgtY = p * 3.8; tgtLift = 4.2;
          tgtYaw = lerp(-0.28, 0.16, smoothstep(0, 1, p));
          tgtTorsoYaw = 0.20;
          tgtArmRYaw = 0.42; tgtArmRZ = 2.6; tgtTriLift = 2.0;
          tgtArmLYaw = -0.40; tgtArmLZ = 2.2;
          wantTriStyle = 'cast';
          sState.glowBoost = 1.9;
          sState.fountainWarn = { x: DUMMY_POS.x, y: DUMMY_POS.y, p };
          if (Math.random() < 0.65) {
            const a = Math.random() * TAU;
            spawnParticle(DUMMY_POS.x + Math.cos(a) * 12, DUMMY_POS.y + Math.sin(a) * 12, 2,
              -Math.cos(a) * 14, -Math.sin(a) * 14, 10, 0.28, 1.7, fx.hot, true, 12);
          }
        } else if (t < 1.95) {
          const p = (t - 0.62) / 1.33;
          tgtY = lerp(3.8, 0, smoothstep(0.45, 1.0, p));
          tgtLift = lerp(4.6, 1.6, smoothstep(0.4, 1.0, p));
          tgtArmRYaw = lerp(0.48, 0.1, smoothstep(0.5, 1.0, p));
          tgtArmRZ = lerp(3.8, 0.8, smoothstep(0.5, 1.0, p));
          tgtTriLift = lerp(3.5, 0.8, smoothstep(0.5, 1.0, p));
          wantTriStyle = p < 0.65 ? 'cast' : 'hold';
          sState.glowBoost = 1.85 - p * 0.5;
          const rise = smoothstep(0, 0.14, p), fall = 1 - smoothstep(0.74, 1.0, p);
          const colH = 32 * rise * fall;
          sState.fountainCol = { x: DUMMY_POS.x, y: DUMMY_POS.y, h: colH, spin: animTime * 14 };
          targetDummyLift = Math.max(0, colH - 9.5);
          dummyHit = Math.max(dummyHit, 0.9 * rise * fall);
          if (!st.erupted) {
            st.erupted = true; shakeMag = 6.2;
            addRipple(DUMMY_POS.x, DUMMY_POS.y, 6, 36, 0.72, 3.0);
            addPuddle(DUMMY_POS.x, DUMMY_POS.y, 18, 6.5);
            splashDummy(1.5, false);
          }
          if (colH > 6 && Math.random() < 0.9) {
            for (let k = 0; k < 2; k++) {
              const a = Math.random() * TAU, sp = 12 + Math.random() * 24;
              spawnParticle(DUMMY_POS.x + Math.cos(a) * 4, DUMMY_POS.y + Math.sin(a) * 4, colH + 2,
                Math.cos(a) * sp, Math.sin(a) * sp, 16 + Math.random() * 18,
                0.55 + Math.random() * 0.25, 2.2, k ? fx.foam : fx.hot, true, 64);
            }
          }
        } else if (!st.landed) {
          st.landed = true; splashDummy(1.2, true); shakeMag = Math.max(shakeMag, 3.0);
        }
      } else if (act.id === 'tidalWave') {
        tailWaveSpd = 5.0; tailWaveAmp = 1.5;
        if (t < 0.55) {
          const p = smoothstep(0, 1, t / 0.55);
          tgtLift = lerp(1.2, 7.2, p);
          tgtArmLZ = p * 4.5; tgtArmLYaw = -p * 0.55;
          tgtArmRZ = p * 4.8; tgtArmRYaw = -p * 0.25;
          tgtTriLift = p * 5.5; tgtHeadZ = p * 1.2;
          sState.glowBoost = 1.2 + p * 0.9;
          sState.waveWall = { y: -44 + p * 8, h: 4 + p * 22, width: 32 + p * 24, p: 0 };
          if (Math.random() < 0.7) {
            spawnParticle((Math.random() - 0.5) * 44, -40 + Math.random() * 10, 4 + Math.random() * 14,
              0, 10, 16, 0.35, 2.2, fx.foam, true, 32);
          }
        } else if (t < 1.75) {
          const p = (t - 0.55) / 1.20, thrust = smoothstep(0, 0.22, p);
          tgtLift = lerp(7.2, 2.0, smoothstep(0.2, 1.0, p));
          tgtY = Math.sin(Math.min(1, p * 1.4) * Math.PI) * 5.0;
          tgtArmLYaw = lerp(-0.55, 0.35, thrust); tgtArmLZ = lerp(4.5, 1.0, thrust);
          tgtArmRYaw = lerp(-0.25, 0.55, thrust); tgtArmRZ = lerp(4.8, 1.2, thrust);
          tgtTriLift = lerp(5.5, 0.8, thrust);
          wantTriStyle = p < 0.65 ? 'cast' : 'hold';
          sState.glowBoost = 2.0 - p * 0.8;
          const wy = lerp(-36, 76, smoothstep(0, 1, p));
          const wh = 26 * (1 - smoothstep(0.75, 1.0, p));
          sState.waveWall = { y: wy, h: wh, width: 58, p };
          if (wy > -12 && wy < 62) {
            shakeMag = Math.max(shakeMag, 3.4);
            if (Math.random() < 0.85) {
              for (let k = 0; k < 2; k++) {
                spawnParticle((Math.random() - 0.5) * 52, wy + 5, 6 + Math.random() * (wh * 0.8),
                  (Math.random() - 0.5) * 16, 26 + Math.random() * 24, 12 + Math.random() * 18,
                  0.45, 2.3, k ? fx.foam : fx.hot, true, 54);
              }
            }
          }
          if (!st.wetMid && wy >= 4) { st.wetMid = true; addPuddle(0, 6, 24, 6.0); addRipple(0, 6, 12, 48, 0.65, 2.5); }
          if (!st.hitDummy && wy >= DUMMY_POS.y - 6) {
            st.hitDummy = true; shakeMag = 7.2; splashDummy(1.8, true); addPuddle(DUMMY_POS.x, DUMMY_POS.y, 22, 6.5);
          }
        }
      } else if (act.id === 'bubbleTrap') {
        tailWaveSpd = 3.2; tailWaveAmp = 1.15;
        if (t < 0.45) {
          const p = smoothstep(0, 1, t / 0.45);
          tgtLift = lerp(1.2, 4.0, p);
          tgtArmRYaw = Math.sin(p * Math.PI) * 0.45;
          tgtArmRZ = p * 3.0; tgtTriLift = p * 2.8;
          tgtArmLYaw = -p * 0.35; tgtArmLZ = p * 2.2;
          wantTriStyle = 'cast';
          sState.glowBoost = 1.65;
          const tip = rig.tridentTip;
          sState.bubble = { x: tip.x, y: tip.y + 2.0, z: tip.z, r: lerp(2.2, 10.5, p), wobble: 0 };
        } else if (t < 1.15) {
          const u = smoothstep(0, 1, (t - 0.45) / 0.70);
          tgtLift = 4.0; tgtArmRYaw = lerp(0.35, 0.55, u); tgtArmRZ = 2.6; wantTriStyle = 'cast';
          const sx = st.bStartX !== undefined ? st.bStartX : (st.bStartX = rig.tridentTip.x);
          const sy = st.bStartY !== undefined ? st.bStartY : (st.bStartY = rig.tridentTip.y + 2.0);
          const sz = st.bStartZ !== undefined ? st.bStartZ : (st.bStartZ = rig.tridentTip.z);
          const bx = lerp(sx, DUMMY_POS.x, u), by = lerp(sy, DUMMY_POS.y, u);
          const bz = lerp(sz, 24.5, u) + Math.sin(u * Math.PI) * 5.0;
          sState.bubble = { x: bx, y: by, z: bz, r: lerp(10.5, 13.8, u), wobble: Math.sin(t * 10) * 0.6 };
          if (Math.random() < 0.45) {
            spawnParticle(bx + (Math.random() - 0.5) * 6, by - 4, bz,
              (Math.random() - 0.5) * 6, -4, 6 + Math.random() * 6, 0.42, 1.6, fx.hot, true, -6);
          }
        } else if (t < 2.35) {
          const p = (t - 1.15) / 1.20;
          const hover = 10.5 + Math.sin(p * Math.PI * 4.5) * 2.6;
          targetDummyLift = hover; dummySway = Math.sin(p * Math.PI * 5.0) * 1.4;
          sState.bubble = {
            x: DUMMY_POS.x + dummySway * 0.6, y: DUMMY_POS.y, z: hover + 15.5,
            r: 14.5 + Math.sin(t * 12) * 0.5, wobble: Math.sin(t * 14) * 0.7
          };
          if (!st.trapped) { st.trapped = true; addRipple(DUMMY_POS.x, DUMMY_POS.y, 4, 24, 0.65, 2.2); }
        } else {
          if (!st.popped) {
            st.popped = true; shakeMag = 6.5; flashAlpha = 0.24;
            addPuddle(DUMMY_POS.x, DUMMY_POS.y, 24, 7.0);
            addRipple(DUMMY_POS.x, DUMMY_POS.y, 8, 46, 0.72, 2.8);
            addRing3D(DUMMY_POS.x, DUMMY_POS.y, 22, 12, 36, 0.42, fx.foam, true);
            splashDummy(1.8, false);
            for (let i = 0; i < 42; i++) {
              const a = Math.random() * TAU, el = (Math.random() - 0.25) * 1.3, sp = 22 + Math.random() * 44;
              spawnParticle(DUMMY_POS.x, DUMMY_POS.y, 22 + (Math.random() - 0.5) * 8,
                Math.cos(a) * Math.cos(el) * sp, Math.sin(a) * Math.cos(el) * sp, Math.sin(el) * sp + 18,
                0.55 + Math.random() * 0.45, 2.0 + Math.random() * 1.4,
                i % 3 === 0 ? fx.core : (i % 3 === 1 ? fx.hot : fx.mid), i % 2 === 0, 58);
            }
          }
          targetDummyLift = 0;
        }
      }
      if (act.t >= act.dur) { activeSkill = null; syncUI(); }
    }

    // 连续平滑插值骨骼主参数
    rig.x = lerp(rig.x, tgtX, kSlow);
    rig.y = lerp(rig.y, tgtY, kSlow);
    rig.lift = lerp(rig.lift, tgtLift, kMid);
    const dYaw = (((tgtYaw - rig.yaw + Math.PI) % TAU) + TAU) % TAU - Math.PI;
    rig.yaw += dYaw * kMid;
    rig.torsoYaw = lerp(rig.torsoYaw, tgtTorsoYaw, kMid);
    rig.headYaw  = lerp(rig.headYaw,  tgtHeadYaw,  kMid);
    rig.headZOff = lerp(rig.headZOff, tgtHeadZ,    kMid);
    rig.armLYaw  = lerp(rig.armLYaw,  tgtArmLYaw,  kFast);
    rig.armLZ    = lerp(rig.armLZ,    tgtArmLZ,    kFast);
    rig.armRYaw  = lerp(rig.armRYaw,  tgtArmRYaw,  kFast);
    rig.armRZ    = lerp(rig.armRZ,    tgtArmRZ,    kFast);
    rig.tridentLift = lerp(rig.tridentLift, tgtTriLift, kFast);
    rig.tridentStyle = wantTriStyle;
    rig.swimPose = wantSwimPose;

    // 实时求解 10 节人鱼尾链（高腰零穿模！）
    const hipZ = rig.lift + 12.8;
    if (wantSwimPose) {
      // 俯身游动：鱼尾从腰后 (-2.2) 水平流线向后拖展，做真实宽幅鱼类左右推进波 + 滞后海豚潜浮弧！
      const [h0x, h0y] = localToWorldXY(rig.x, rig.y, rig.yaw, 0, -1.6);
      tailNodes[0].x = h0x; tailNodes[0].y = h0y; tailNodes[0].z = hipZ - 0.6;
      for (let i = 1; i < TAIL_COUNT; i++) {
        const u = i / (TAIL_COUNT - 1);
        const sideWave = Math.sin(swimPhase - i * 0.68) * (0.45 + Math.pow(u, 1.35) * 2.2);
        const [wx, wy] = localToWorldXY(tailNodes[i - 1].x, tailNodes[i - 1].y, rig.yaw, sideWave, -TAIL_SEG_LEN * 0.94);
        // 鱼尾跟随身体波浪潜浮，并略带后滞相位（头潜下时尾拱出水面拍水！）
        const delayedDive = Math.sin(animTime * 2.15 - i * 0.24);
        const tz = lerp(hipZ - 1.2, 2.2, Math.pow(u, 0.7)) + delayedDive * (1.8 + u * 3.8);
        const ks = 1 - Math.exp(-dt * 15);
        tailNodes[i].x = lerp(tailNodes[i].x, wx, ks);
        tailNodes[i].y = lerp(tailNodes[i].y, wy, ks);
        tailNodes[i].z = lerp(tailNodes[i].z, tz, ks);
      }
      relaxChain(tailNodes, TAIL_SEG_LEN);
    } else {
      evalTreadWaterTail(tailTarget, rig.x, rig.y, hipZ, rig.yaw, animTime, tailWaveSpd, tailWaveAmp);
      const kt = 1 - Math.exp(-dt * 11);
      for (let i = 0; i < TAIL_COUNT; i++) {
        tailNodes[i].x = lerp(tailNodes[i].x, tailTarget[i].x, kt);
        tailNodes[i].y = lerp(tailNodes[i].y, tailTarget[i].y, kt);
        tailNodes[i].z = lerp(tailNodes[i].z, tailTarget[i].z, kt);
      }
    }
    for (let i = 0; i < TAIL_COUNT; i++) {
      const prev = i > 0 ? tailNodes[i - 1] : tailNodes[0];
      const next = i < TAIL_COUNT - 1 ? tailNodes[i + 1] : tailNodes[TAIL_COUNT - 1];
      const dx = prev.x - next.x, dy = prev.y - next.y;
      if (Math.hypot(dx, dy) > 0.05) tailNodes[i].yaw = Math.atan2(-dx, dy);
    }

    // 实时求解 3 束飘动长发链（游动时随水流向正后方拉长飘舞！）
    const bodyYaw = rig.yaw + rig.torsoYaw;
    const headAbsYaw = bodyYaw + rig.headYaw;
    const headFwdY = wantSwimPose ? 9.0 : 0.0;
    const headBaseZ = rig.lift + (wantSwimPose ? 20.6 : 26.8) + rig.headZOff;
    const [hAncX, hAncY] = localToWorldXY(rig.x, rig.y, bodyYaw, 0, headFwdY);

    for (let cIdx = 0; cIdx < hairChains.length; cIdx++) {
      const hc = hairChains[cIdx];
      const [ax, ay] = localToWorldXY(hAncX, hAncY, headAbsYaw, hc.offX, hc.offY);
      hc.nodes[0].x = ax; hc.nodes[0].y = ay; hc.nodes[0].z = headBaseZ + hc.offZ;
      for (let j = 1; j < hc.nodes.length; j++) {
        const u = j / (hc.nodes.length - 1);
        const wSide = Math.sin(animTime * (wantSwimPose ? 5.2 : 2.5) - j * 0.8 + cIdx * 0.9) * (1.2 + u * 2.2);
        const backPull = wantSwimPose ? (4.8 + u * 5.4) : (2.2 + u * 2.8);
        const [tx, ty] = localToWorldXY(ax, ay, headAbsYaw, hc.offX * 0.3 + wSide, -backPull * (j / 2.0));
        const tz = headBaseZ + hc.offZ - j * (wantSwimPose ? 1.6 : 3.6) + Math.cos(animTime * 2.5 - j * 0.7) * 0.7;
        const kh = 1 - Math.exp(-dt * (13 - j * 2.2));
        hc.nodes[j].x = lerp(hc.nodes[j].x, tx, kh);
        hc.nodes[j].y = lerp(hc.nodes[j].y, ty, kh);
        hc.nodes[j].z = lerp(hc.nodes[j].z, tz, kh);
      }
      relaxChain(hc.nodes, hc.segLen);
    }

    // 记录三叉戟实时尖端世界坐标
    const rArmAbsYaw = bodyYaw + rig.armRYaw;
    const shFwdY = wantSwimPose ? 5.3 : 0.0;
    const [rShX, rShY] = localToWorldXY(rig.x, rig.y, bodyYaw, 3.6, shFwdY);
    const [rHdX, rHdY] = localToWorldXY(rShX, rShY, rArmAbsYaw, wantSwimPose ? 4.4 : 5.2, wantSwimPose ? 2.8 : 4.8);
    const triBaseZ = rig.lift + (wantSwimPose ? 14.8 : 20.6) + rig.armRZ + rig.tridentLift - 12.0;
    const [tipX, tipY] = localToWorldXY(rHdX, rHdY, rArmAbsYaw, 0, rig.tridentStyle === 'cast' ? 11.2 : 1.5);
    rig.tridentTip.x = tipX;
    rig.tridentTip.y = tipY;
    rig.tridentTip.z = triBaseZ + (rig.tridentStyle === 'cast' ? 31.5 : 35.0);

    dummyLift += (targetDummyLift - dummyLift) * Math.min(1, dt * 14);
    return sState;
  }

  // 收集全部海妖骨骼部件（含精确 layerBias 保证高腰水裙 100% 罩住尾根、零穿模 + 真实入水深浅透视！）
  function buildSirenPartList() {
    const list = [];
    const bodyYaw = rig.yaw + rig.torsoYaw;
    const isSwim = rig.swimPose;
    const hipZ = rig.lift + 12.8;

    // 1. 10 节人鱼长尾（潜入浅水时柔和透明浸水，绝不做生硬水平一刀切！）
    for (let i = 0; i < TAIL_COUNT; i++) {
      const n = tailNodes[i];
      if (n.z < -3.8) continue;
      let id;
      if (i <= 2) id = 'tailThick';
      else if (i <= 5) id = 'tailMid';
      else if (i <= 7) id = 'tailSlim';
      else id = 'tailTip';
      // 尾根第 0~1 节 layerBias = -1.4 确保始终顺服地藏在高腰水裙内部下方，永不从裙瓣穿出！
      const bias = i <= 1 ? -1.4 : 0;
      const submerge = clamp((2.6 - n.z) / 5.2, 0, 1);
      list.push({ id, m: parts[id], x: n.x, y: n.y, lift: n.z - 3.0, ro: n.yaw, symDeg: 360, bias, submerge });
    }

    // 2. 宽大双叶扇形尾鳍（枢轴精准锁在尾尖关节上，大幅甩尾也 0 挤捏缝隙！）
    const tip = tailNodes[TAIL_COUNT - 1];
    if (tip.z >= -3.6) {
      const whipAng = isSwim
        ? Math.sin(swimPhase - TAIL_COUNT * 0.68 - 0.6) * 0.56
        : Math.sin(animTime * 2.8 - TAIL_COUNT * 0.62 - 0.55) * 0.42;
      const finYaw = tip.yaw + whipAng;
      const [finX, finY] = localToWorldXY(tip.x, tip.y, finYaw, 0, -2.6);
      const submerge = clamp((2.8 - tip.z) / 5.4, 0, 1);
      list.push({ id: 'tailFin', m: parts.tailFin, x: finX, y: finY, lift: tip.z - 3.4, ro: finYaw, symDeg: 360, bias: 0, submerge });
    }

    // 3. 高腰贴身贝壳水裙（底沿高于下方鱼尾 + bias=+0.8 稳稳包住腰尾交界，100% 零穿模！）
    const skId = isSwim ? 'hipSkirtSwim' : 'hipSkirt';
    const skZ = isSwim ? (hipZ - 1.2) : (hipZ - 1.4);
    list.push({ id: skId, m: parts[skId], x: rig.x, y: rig.y, lift: skZ, ro: bodyYaw + Math.sin(animTime * 2.4) * 0.05, symDeg: 360, bias: 0.8, submerge: clamp((1.5 - (skZ + 4.5)) / 5.0, 0, 1) });

    // 4. 人形躯干（常规优雅竖姿 / 巡游前倾 56° 流线泳姿）
    const tId = isSwim ? 'torsoSwim' : 'torso';
    const tZ  = isSwim ? (hipZ + 0.6) : (hipZ + 2.4);
    list.push({ id: tId, m: parts[tId], x: rig.x, y: rig.y, lift: tZ, ro: bodyYaw, symDeg: 360, bias: 0.4, submerge: clamp((1.0 - (tZ + 5.0)) / 5.0, 0, 1) });

    // 5. 独立头部 + 3 束飘动长发链（与 56° 前倾颈口精准严丝合缝）
    const headAbsYaw = bodyYaw + rig.headYaw;
    const headFwdY = isSwim ? 9.0 : 0.0;
    const [hX, hY] = localToWorldXY(rig.x, rig.y, bodyYaw, 0, headFwdY);
    const hZ = rig.lift + (isSwim ? 19.4 : 26.2) + rig.headZOff;
    const hId = isSwim ? 'headSwim' : 'head';
    list.push({ id: hId, m: parts[hId], x: hX, y: hY, lift: hZ, ro: headAbsYaw, symDeg: 360, bias: 0.5, submerge: 0 });

    for (let cIdx = 0; cIdx < hairChains.length; cIdx++) {
      const hc = hairChains[cIdx];
      for (let j = 1; j < hc.nodes.length; j++) {
        const hn = hc.nodes[j];
        if (hn.z < -3.0) continue;
        const hid = (cIdx === 0 && j === 1) ? 'hairL' : (j === hc.nodes.length - 1 ? 'hairS' : 'hairM');
        list.push({ id: hid, m: parts[hid], x: hn.x, y: hn.y, lift: hn.z - 2.6, ro: headAbsYaw, symDeg: 90, bias: 0, submerge: clamp((2.0 - hn.z) / 5.0, 0, 1) });
      }
    }

    // 6. 独立左右臂 + 珊瑚三叉戟（与 56° 前倾肩位精准对齐）
    const shFwdY = isSwim ? 5.3 : 0.0;
    const [lShX, lShY] = localToWorldXY(rig.x, rig.y, bodyYaw, -3.5, shFwdY);
    const [rShX, rShY] = localToWorldXY(rig.x, rig.y, bodyYaw,  3.5, shFwdY);
    const lArmYaw = bodyYaw + rig.armLYaw;
    const rArmYaw = bodyYaw + rig.armRYaw;
    const armBaseZ = rig.lift + (isSwim ? 14.4 : 19.8);

    list.push({ id: isSwim ? 'armLSwim' : 'armL', m: parts[isSwim ? 'armLSwim' : 'armL'], x: lShX, y: lShY, lift: armBaseZ + rig.armLZ, ro: lArmYaw, symDeg: 360, bias: 0.2, submerge: clamp((1.5 - (armBaseZ + 4.5)) / 5.0, 0, 1) });
    list.push({ id: isSwim ? 'armRSwim' : 'armR', m: parts[isSwim ? 'armRSwim' : 'armR'], x: rShX, y: rShY, lift: armBaseZ + rig.armRZ, ro: rArmYaw, symDeg: 360, bias: 0.2, submerge: clamp((1.5 - (armBaseZ + 4.5)) / 5.0, 0, 1) });

    const [rHdX, rHdY] = localToWorldXY(rShX, rShY, rArmYaw, isSwim ? 4.4 : 5.2, isSwim ? 2.8 : 4.8);
    const tid = rig.tridentStyle === 'swim' ? 'tridentSwim' : (rig.tridentStyle === 'cast' ? 'tridentCast' : 'tridentHold');
    const triZ = rig.lift + (isSwim ? 12.2 : 20.6) + rig.armRZ + rig.tridentLift - (isSwim ? 7.0 : 12.0);
    list.push({ id: tid, m: parts[tid], x: rHdX, y: rHdY, lift: triZ, ro: rArmYaw, symDeg: 360, bias: 0.25, submerge: 0 });

    return list;
  }

  // 在局部缓冲 actorBuf(240×246) 中按 3D 深度无缝拼合海妖骨骼部件 + 清澈浅水柔隐 + 1 次整体外轮廓！
  function composeSirenActor(partList, c, s, outlineHex) {
    arCtx.setTransform(1, 0, 0, 1, 0, 0);
    arCtx.globalCompositeOperation = 'source-over';
    arCtx.globalAlpha = 1;
    arCtx.imageSmoothingEnabled = false;
    arCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

    agCtx.setTransform(1, 0, 0, 1, 0, 0);
    agCtx.globalCompositeOperation = 'source-over';
    agCtx.globalAlpha = 1;
    agCtx.imageSmoothingEnabled = false;
    agCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);

    let calls = 0;
    let hasAnyGlow = false;

    for (let i = 0; i < partList.length; i++) {
      const p = partList[i];
      const dxW = p.x - rig.x;
      const dyW = p.y - rig.y;
      const rx = c * dxW - s * dyW;
      const ry = s * dxW + c * dyW;
      p._lx = ACTOR_AX + rx * BAKE_SCALE;
      p._ly = ACTOR_AY + ry * TILT * BAKE_SCALE - p.lift * BAKE_STEP;
      p._depth = ry + p.lift * 0.08 + p.bias;
    }
    partList.sort((a, b) => a._depth - b._depth);

    for (let i = 0; i < partList.length; i++) {
      const p = partList[i];
      const sp = getBakedSprite(p.m, p.id, p.ro + th, outlineHex, false, p.symDeg);
      const dx = Math.round(p._lx - sp.anchorX);
      const dy = Math.round(p._ly - sp.anchorY);
      const alpha = p.submerge > 0 ? (1 - p.submerge * 0.42) : 1;

      arCtx.globalAlpha = alpha;
      arCtx.drawImage(sp.main, dx, dy);
      calls++;

      if (hasAnyGlow) {
        agCtx.globalCompositeOperation = 'destination-out';
        agCtx.globalAlpha = 1;
        agCtx.drawImage(sp.main, dx, dy);
      }
      if (sp.glow) {
        hasAnyGlow = true;
        agCtx.globalCompositeOperation = 'source-over';
        agCtx.globalAlpha = alpha;
        agCtx.drawImage(sp.glow, dx, dy);
        calls++;
      }
    }
    arCtx.globalAlpha = 1;
    agCtx.globalAlpha = 1;
    agCtx.globalCompositeOperation = 'source-over';

    if (!useOutline) return { main: actorRaw, glow: hasAnyGlow ? actorGlow : null, calls };

    asCtx.setTransform(1, 0, 0, 1, 0, 0);
    asCtx.globalCompositeOperation = 'source-over';
    asCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    asCtx.drawImage(actorRaw, 0, 0);
    asCtx.globalCompositeOperation = 'source-in';
    asCtx.fillStyle = outlineHex;
    asCtx.fillRect(0, 0, ACTOR_W, ACTOR_H);

    aoCtx.setTransform(1, 0, 0, 1, 0, 0);
    aoCtx.globalCompositeOperation = 'source-over';
    aoCtx.imageSmoothingEnabled = false;
    aoCtx.clearRect(0, 0, ACTOR_W, ACTOR_H);
    aoCtx.drawImage(actorSil, -1, 0);
    aoCtx.drawImage(actorSil,  1, 0);
    aoCtx.drawImage(actorSil, 0, -1);
    aoCtx.drawImage(actorSil, 0,  1);
    aoCtx.drawImage(actorRaw, 0, 0);
    return { main: actorOut, glow: hasAnyGlow ? actorGlow : null, calls: calls + 5 };
  }

  function updateVFX(dt) {
    if (bannerTimer > 0) {
      bannerTimer -= dt;
      if (bannerTimer <= 0) document.getElementById('banner').classList.remove('show');
    }
    shakeMag = Math.max(0, shakeMag - dt * 16);
    shakeX = shakeMag ? (Math.random() - 0.5) * shakeMag * SCALE * 0.65 : 0;
    shakeY = shakeMag ? (Math.random() - 0.5) * shakeMag * SCALE * 0.65 : 0;
    flashAlpha = Math.max(0, flashAlpha - dt * 3.2);
    dummyHit = Math.max(0, dummyHit - dt * 2.6);
    dummySway *= Math.max(0, 1 - dt * 4.5);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.vz -= p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.z < 0.5) { p.z = 0.5; p.vz = Math.abs(p.vz) * 0.35; p.vx *= 0.68; p.vy *= 0.68; }
    }
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i];
      n.t += dt;
      if (n.t >= n.dur) {
        notes.splice(i, 1);
        dummySway = (Math.random() < 0.5 ? -1 : 1) * 2.4;
        splashDummy(0.55, false);
      }
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].t += dt;
      if (ripples[i].t >= ripples[i].life) ripples.splice(i, 1);
    }
    for (let i = wakes.length - 1; i >= 0; i--) {
      wakes[i].t += dt;
      if (wakes[i].t >= wakes[i].life) wakes.splice(i, 1);
    }
    for (let i = puddles.length - 1; i >= 0; i--) {
      puddles[i].t += dt;
      if (puddles[i].t >= puddles[i].life) puddles.splice(i, 1);
    }
    for (let i = shockRings.length - 1; i >= 0; i--) {
      shockRings[i].t += dt;
      if (shockRings[i].t >= shockRings[i].life) shockRings.splice(i, 1);
    }
  }

  function drawStackRealtime(asset, x, y, zLift, ro, sc, submerge = 0) {
    const [X, Y] = proj(x, y, zLift, sc);
    const a = ro + th, c = Math.cos(a), s = Math.sin(a);
    const X0 = Math.round(X), Y0 = Math.round(Y);
    const isRetro = MODES[modeIdx] === 'retro';
    const step = isRetro ? HS : Math.max(1, Math.round(HS * sc));
    const halfStep = (!isRetro && step > Math.floor(TILT * sc)) ? Math.max(1, Math.round(step * 0.5)) : 0;
    const { w, d, activeLayers, glowLayers, glowSlot, glowStrip, strip } = asset;
    const hasGlow = !!glowStrip && glowLayers.length > 0;
    const minGlowZ = hasGlow ? glowLayers[0] : 9999;
    const eScaleX = EW / CW, eScaleY = EH / CH;
    let calls = 0;

    mctx.globalAlpha = submerge > 0 ? (1 - submerge * 0.42) : 1;
    for (let li = 0; li < activeLayers.length; li++) {
      const z = activeLayers[li];
      const yy = isRetro ? (Y0 - z * HS) : (Y0 - z * step);
      const sx = z * w;
      if (halfStep) {
        mctx.setTransform(c * sc, TILT * s * sc, -s * sc, TILT * c * sc, X0, yy + halfStep);
        mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
        calls++;
      }
      mctx.setTransform(c * sc, TILT * s * sc, -s * sc, TILT * c * sc, X0, yy);
      mctx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      calls++;
      if (!hasGlow || z >= minGlowZ) {
        ectx.globalCompositeOperation = 'destination-out';
        ectx.setTransform(c * sc * eScaleX, TILT * s * sc * eScaleY, -s * sc * eScaleX, TILT * c * sc * eScaleY, X0 * eScaleX, yy * eScaleY);
        ectx.drawImage(strip, sx, 0, w, d, -w / 2, -d / 2, w, d);
      }
      if (hasGlow && glowSlot[z] >= 0) {
        ectx.globalCompositeOperation = 'source-over';
        ectx.drawImage(glowStrip, glowSlot[z] * w, 0, w, d, -w / 2, -d / 2, w, d);
        calls++;
      }
    }
    mctx.globalAlpha = 1;
    ectx.globalCompositeOperation = 'source-over';
    return calls;
  }

  // 6. 主循环
  let last = 0, fpsAcc = 0, fpsFrames = 0, fpsVal = 60, statTimer = 0, cpuMsSmooth = 1.0;

  function tick(ms) {
    const tCpu0 = performance.now();
    const t = ms / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
    animTime += dt;
    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.4) { fpsVal = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }

    if (autoSpin && !drag) thTarget += dt * 0.55;
    if (!drag) th += (thTarget - th) * Math.min(1, dt * 8);

    const sState = updateRigAndSkills(dt);
    updateVFX(dt);

    const mode = MODES[modeIdx];
    const sc = mode === 'retro' ? 1 : SCALE;
    const c = Math.cos(th), s = Math.sin(th);
    const eScale = EW / cv.width;
    const fx = curSkin.fx;
    let drawCalls = 0;

    const sirenParts = buildSirenPartList();
    const dummyShakeX = (dummyHit > 0 ? Math.sin(animTime * 52) * dummyHit * 1.9 : 0) + dummySway;
    const dummyShakeY = dummyHit > 0 ? Math.cos(animTime * 46) * dummyHit * 1.3 : 0;
    const dummyObj = {
      id: 'dummy', m: dummyAsset,
      x: DUMMY_POS.x + dummyShakeX, y: DUMMY_POS.y + dummyShakeY,
      lift: dummyLift, ro: dummySway * 0.08, symDeg: 360
    };

    // 1. 2× 浅海环礁水池地表缓冲 gbuf（水下折射人鱼潜影 + V 形尾浪 + 破水白环 + 水渍）
    const bSize = platform.size;
    const halfB = bSize * 0.5;
    gbctx.setTransform(GROUND_SUPERSAMPLE, 0, 0, GROUND_SUPERSAMPLE, 0, 0);
    gbctx.globalCompositeOperation = 'source-over';
    gbctx.imageSmoothingEnabled = false;
    gbctx.clearRect(0, 0, bSize, bSize);
    gbctx.drawImage(platform.base, 0, 0);

    gbctx.save();
    gbctx.translate(halfB, halfB);
    gbctx.beginPath();
    gbctx.arc(0, 0, platform.rPool, 0, TAU);
    gbctx.clip();

    // 浅海水面柔和短波光弧（自然流动感，不画死板通长直线）
    gbctx.strokeStyle = `rgba(${fx.foamRGB}, 0.16)`;
    gbctx.lineWidth = 1.0;
    for (let w = 0; w < 9; w++) {
      const angW = w * 0.72 + animTime * 0.12;
      const radW = 24 + (w % 3) * 18;
      const wx0 = Math.cos(angW) * radW;
      const wy0 = Math.sin(angW) * radW;
      gbctx.beginPath();
      gbctx.arc(wx0, wy0, 8 + Math.sin(animTime * 1.5 + w) * 2.0, -0.5, 0.7);
      gbctx.stroke();
    }

    // 水下折射人鱼体影（清晰勾勒出在浅水下摆动的鱼尾和半潜身躯，水生感直接拉满！）
    for (let i = 0; i < TAIL_COUNT; i++) {
      const n = tailNodes[i];
      const submerged = n.z < 1.5;
      const rad = lerp(4.4, 2.2, i / (TAIL_COUNT - 1));
      gbctx.fillStyle = submerged ? 'rgba(5, 28, 44, 0.54)' : 'rgba(5, 20, 34, 0.34)';
      gbctx.beginPath();
      gbctx.arc(n.x + 1.2, n.y - 1.2, rad, 0, TAU);
      gbctx.fill();
    }
    const tip = tailNodes[TAIL_COUNT - 1];
    gbctx.fillStyle = tip.z < 1.5 ? 'rgba(5, 30, 48, 0.52)' : 'rgba(5, 20, 34, 0.32)';
    gbctx.beginPath(); gbctx.arc(tip.x + 1.2, tip.y - 1.2, 5.8, 0, TAU); gbctx.fill();
    gbctx.fillStyle = rig.lift < 0 ? 'rgba(5, 30, 48, 0.58)' : 'rgba(5, 20, 34, 0.38)';
    gbctx.beginPath(); gbctx.arc(rig.x + 1.4, rig.y - 1.4, 7.2, 0, TAU); gbctx.fill();

    // 鱼类游动清晰双线 V 形破浪尾迹（Kelvin Wake + 尾流白沫）
    for (const wk of wakes) {
      const u = clamp(wk.t / wk.life, 0, 1);
      const fade = (1 - u) * (1 - u);
      const spread = wk.width * (0.65 + u * 2.8);
      const back = 5.0 + u * 15.0;
      const [lx, ly] = localToWorldXY(wk.x, wk.y, wk.yaw, -spread, -back);
      const [rx, ry] = localToWorldXY(wk.x, wk.y, wk.yaw,  spread, -back);
      const [cx, cy] = localToWorldXY(wk.x, wk.y, wk.yaw, 0, 2.5);
      gbctx.strokeStyle = `rgba(${fx.ringRGB}, ${fade * 0.65})`;
      gbctx.lineWidth = Math.max(1.2, (1 - u) * 3.4);
      gbctx.beginPath();
      gbctx.moveTo(lx, ly); gbctx.lineTo(cx, cy); gbctx.lineTo(rx, ry);
      gbctx.stroke();
      gbctx.strokeStyle = `rgba(${fx.foamRGB}, ${fade * 0.90})`;
      gbctx.lineWidth = Math.max(0.8, (1 - u) * 1.9);
      gbctx.beginPath();
      gbctx.moveTo(lx, ly); gbctx.lineTo(cx, cy); gbctx.lineTo(rx, ry);
      gbctx.stroke();
    }

    // 紧贴人鱼身周的实时破水白沫环（彻底把人鱼“嵌入”水中，绝不像悬空物体！）
    const surfR = rig.swimPose ? 9.5 : 10.5;
    gbctx.strokeStyle = `rgba(${fx.foamRGB}, 0.65)`;
    gbctx.lineWidth = 1.6;
    gbctx.beginPath();
    gbctx.ellipse(rig.x, rig.y, surfR + Math.sin(animTime * 4) * 1.1, surfR * 0.85, rig.yaw, 0, TAU);
    gbctx.stroke();

    // 常驻慢扩细水纹
    for (let k = 0; k < 2; k++) {
      const rp = (animTime * 0.48 + k * 0.5) % 1;
      const rr = lerp(9, 28, rp);
      gbctx.strokeStyle = `rgba(${fx.ringRGB}, ${(1 - rp) * 0.58})`;
      gbctx.lineWidth = 1.4;
      gbctx.beginPath(); gbctx.arc(rig.x, rig.y, rr, 0, TAU); gbctx.stroke();
    }

    for (const pd of puddles) {
      const fade = clamp(1 - pd.t / pd.life, 0, 1);
      gbctx.fillStyle = `rgba(${fx.puddleRGB}, ${fade * 0.42})`;
      gbctx.beginPath(); gbctx.arc(pd.x, pd.y, pd.r, 0, TAU); gbctx.fill();
      gbctx.strokeStyle = `rgba(${fx.foamRGB}, ${fade * 0.36})`;
      gbctx.lineWidth = 1.2;
      gbctx.beginPath(); gbctx.arc(pd.x, pd.y, pd.r * 0.72, 0, TAU); gbctx.stroke();
    }

    for (const rp of ripples) {
      const u = clamp(rp.t / rp.life, 0, 1);
      const rr = lerp(rp.r0, rp.r1, smoothstep(0, 1, u));
      gbctx.strokeStyle = `rgba(${fx.ringRGB}, ${(1 - u) * 0.88})`;
      gbctx.lineWidth = rp.width;
      gbctx.beginPath(); gbctx.arc(rp.x, rp.y, rr, 0, TAU); gbctx.stroke();
      gbctx.strokeStyle = `rgba(${fx.foamRGB}, ${(1 - u) * 0.62})`;
      gbctx.lineWidth = 1.0;
      gbctx.beginPath(); gbctx.arc(rp.x, rp.y, Math.max(2, rr - 2.5), 0, TAU); gbctx.stroke();
    }

    if (sState.fountainWarn) {
      const fw = sState.fountainWarn;
      gbctx.save();
      gbctx.translate(fw.x, fw.y);
      gbctx.rotate(animTime * 16);
      gbctx.strokeStyle = `rgba(${fx.warnRGB}, 0.95)`;
      gbctx.lineWidth = 2.4;
      gbctx.beginPath(); gbctx.arc(0, 0, 15, 0, TAU); gbctx.stroke();
      gbctx.fillStyle = `rgba(${fx.warnRGB}, ${0.18 + fw.p * 0.34})`;
      gbctx.beginPath(); gbctx.arc(0, 0, 15 * fw.p, 0, TAU); gbctx.fill();
      for (let k = 0; k < 4; k++) {
        const a0 = (k / 4) * TAU;
        gbctx.strokeStyle = `rgba(${fx.foamRGB}, 0.92)`;
        gbctx.lineWidth = 2.0;
        gbctx.beginPath(); gbctx.arc(0, 0, 11, a0, a0 + 0.8); gbctx.stroke();
      }
      gbctx.restore();
    }

    // 靶桩投影
    const dLf = clamp(1 - dummyObj.lift / 56, 0.25, 1.0);
    gbctx.save();
    gbctx.translate(dummyObj.x, dummyObj.y);
    gbctx.save();
    gbctx.globalAlpha = 0.30 * dLf;
    gbctx.translate(2.2 + dummyObj.lift * 0.12, -2.2 - dummyObj.lift * 0.12);
    gbctx.rotate(dummyObj.ro);
    gbctx.drawImage(dummyAsset.footShadow, -dummyAsset.w / 2, -dummyAsset.d / 2);
    gbctx.restore();
    gbctx.fillStyle = `rgba(6, 16, 28, ${0.48 * dLf})`;
    gbctx.beginPath(); gbctx.arc(0, 0, dummyAsset.meta.footRadius * (0.68 + 0.32 * dLf), 0, TAU); gbctx.fill();
    gbctx.restore();
    gbctx.restore();

    // 2. 清理 1/4 亮核缓冲，贴天空 + 浅海水池
    ectx.setTransform(1, 0, 0, 1, 0, 0);
    ectx.globalCompositeOperation = 'source-over';
    ectx.imageSmoothingEnabled = false;
    ectx.clearRect(0, 0, EW, EH);

    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.globalCompositeOperation = 'source-over';
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(bgc, 0, 0);
    drawCalls++;

    dctx.setTransform(c * SCALE, TILT * s * SCALE, -s * SCALE, TILT * c * SCALE,
      cv.width / 2 + shakeX, cv.height / 2 + 18 * SCALE + shakeY);
    dctx.drawImage(gbuf, -halfB, -halfB, bSize, bSize);
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    drawCalls++;

    const pSc = mode === 'retro' ? 1 : SCALE;
    const toMain = mode === 'retro' ? SCALE : 1;
    const toE = toMain * eScale;

    function drawVoxelBlock(wx, wy, wz, szVox, color, isGlow) {
      const [px, py] = proj(wx, wy, wz, pSc);
      const sx = Math.round(px * toMain), sy = Math.round(py * toMain);
      const sPx = Math.max(2, Math.round(szVox * SCALE));
      dctx.fillStyle = color;
      dctx.fillRect(sx - (sPx >> 1), sy - (sPx >> 1), sPx, sPx);
      if (isGlow) {
        const es = Math.max(1, Math.round(sPx * eScale));
        ectx.fillStyle = color;
        ectx.fillRect(Math.round(px * toE) - (es >> 1), Math.round(py * toE) - (es >> 1), es, es);
      }
    }

    if (sState.fountainCol && sState.fountainCol.h >= 1.5) {
      const fc = sState.fountainCol;
      const layers = Math.max(4, Math.floor(fc.h / 2.2));
      for (let l = 0; l <= layers; l++) {
        const u = l / layers, zz = u * fc.h;
        const rad = lerp(8.2, 5.2, u) + Math.sin(u * 10 - animTime * 16) * 0.8;
        for (let k = 0; k < 12; k++) {
          const ang = (k / 12) * TAU + fc.spin + u * 2.8;
          const col = (k % 3 === 0 || u > 0.85) ? fx.foam : (k & 1 ? fx.hot : fx.mid);
          drawVoxelBlock(fc.x + Math.cos(ang) * rad, fc.y + Math.sin(ang) * rad, zz, 2.6, col, k % 2 === 0);
        }
        drawVoxelBlock(fc.x, fc.y, zz, 4.8, u > 0.82 ? fx.core : fx.deep, u > 0.7);
      }
    }

    // 3. 绘制海妖整体骨骼精灵 & 靶桩
    if (mode === 'cached') {
      const dispRatio = SCALE / BAKE_SCALE;
      const composed = composeSirenActor(sirenParts, c, s, curSkin.outline);
      drawCalls += composed.calls;

      // 参考锚点锚定在水面 z = 0 (rig.x, rig.y, 0)，与 composeSirenActor 严格同步！
      const [sx, sy, sry] = proj(rig.x, rig.y, 0, SCALE);
      const [dxP, dyP, dry] = proj(dummyObj.x, dummyObj.y, dummyObj.lift, SCALE);
      const dummySp = getBakedSprite(dummyObj.m, 'dummy', dummyObj.ro + th, curSkin.outline, useOutline, 360);

      const drawOrder = sry < dry ? ['siren', 'dummy'] : ['dummy', 'siren'];
      ectx.setTransform(1, 0, 0, 1, 0, 0);

      for (const who of drawOrder) {
        if (who === 'siren') {
          const dw = Math.round(ACTOR_W * dispRatio);
          const dh = Math.round(ACTOR_H * dispRatio);
          const dx = Math.round(sx - ACTOR_AX * dispRatio);
          const dy = Math.round(sy - ACTOR_AY * dispRatio);
          dctx.drawImage(composed.main, dx, dy, dw, dh);
          drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(composed.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
          if (composed.glow) {
            ectx.globalCompositeOperation = 'source-over';
            ectx.drawImage(composed.glow, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
            drawCalls++;
          }
        } else {
          const dw = Math.round(dummySp.bw * dispRatio);
          const dh = Math.round(dummySp.bh * dispRatio);
          const dx = Math.round(dxP - dummySp.anchorX * dispRatio);
          const dy = Math.round(dyP - dummySp.anchorY * dispRatio);
          dctx.drawImage(dummySp.main, dx, dy, dw, dh);
          drawCalls++;
          ectx.globalCompositeOperation = 'destination-out';
          ectx.drawImage(dummySp.main, dx * eScale, dy * eScale, dw * eScale, dh * eScale);
        }
      }
      ectx.globalCompositeOperation = 'source-over';
    } else {
      mctx.setTransform(1, 0, 0, 1, 0, 0);
      mctx.globalCompositeOperation = 'source-over';
      mctx.imageSmoothingEnabled = false;
      mctx.clearRect(0, 0, CW, CH);

      const allObjs = [...sirenParts, dummyObj];
      for (const o of allObjs) o._depth = proj(o.x, o.y, o.lift, sc)[2] + o.lift * 0.08 + (o.bias || 0);
      allObjs.sort((a, b) => a._depth - b._depth);
      for (const o of allObjs) drawCalls += drawStackRealtime(o.m, o.x, o.y, o.lift, o.ro, sc, o.submerge || 0);

      const drawW = mode === 'retro' ? CW * SCALE : CW;
      const drawH = mode === 'retro' ? CH * SCALE : CH;
      if (useOutline) {
        octx.setTransform(1, 0, 0, 1, 0, 0);
        octx.globalCompositeOperation = 'source-over';
        octx.clearRect(0, 0, CW, CH);
        octx.drawImage(mc, 0, 0);
        octx.globalCompositeOperation = 'source-in';
        octx.fillStyle = curSkin.outline;
        octx.fillRect(0, 0, CW, CH);
        octx.globalCompositeOperation = 'source-over';
        const op = mode === 'retro' ? SCALE : Math.max(1, Math.round(SCALE * 0.30));
        for (const [ox, oy] of [[-op, 0], [op, 0], [0, -op], [0, op]]) dctx.drawImage(oc, ox, oy, drawW, drawH);
      }
      dctx.drawImage(mc, 0, 0, drawW, drawH);
    }

    // 3b. 前景水面覆盖层（画在海妖身前的破水白浪前弧 + 浸水半透碧水波，彻底消除“浮空贴图”感！）
    {
      dctx.save();
      dctx.setTransform(1, 0, 0, 1, 0, 0);
      // 1) 浸水鱼尾段与尾鳍的前景漫水波纹与白沫弧
      for (let i = 3; i < TAIL_COUNT; i += 2) {
        const tn = tailNodes[i];
        if (tn.z > 4.2) continue;
        const wet = clamp((4.2 - tn.z) / 4.2, 0.25, 1.0);
        const [txP, tyP] = proj(tn.x, tn.y, 0.6, pSc);
        const cx = txP * toMain, cy = tyP * toMain;
        const radX = (i >= 8 ? 8.2 : 5.4) * SCALE;
        const radY = radX * TILT;
        // 浸水碧蓝半透水罩（让下尾真实没在浅水表层之下！）
        dctx.fillStyle = `rgba(18, 122, 158, ${0.26 * wet})`;
        dctx.beginPath();
        dctx.ellipse(cx, cy, radX * 0.92, radY * 0.85, 0, 0, Math.PI);
        dctx.fill();
        // 前沿白沫浪弧
        dctx.strokeStyle = `rgba(${fx.foamRGB}, ${0.78 * wet})`;
        dctx.lineWidth = Math.max(1.5, SCALE * 0.32);
        dctx.beginPath();
        dctx.ellipse(cx, cy, radX, radY, 0, 0.12, Math.PI - 0.12);
        dctx.stroke();
      }
      // 2) 潜浮巡游或浅水腰身入水时，在身前画一条清晰破水前弧浪环（牢牢把海妖“嵌进”水里！）
      const waistWet = rig.swimPose ? clamp((2.5 - rig.lift) / 9.5, 0.42, 1.0) : 0.48;
      const [wxP, wyP] = proj(rig.x, rig.y, rig.swimPose ? 1.2 : 0.8, pSc);
      const wcx = wxP * toMain, wcy = wyP * toMain;
      const wrX = (rig.swimPose ? 10.6 : 9.4) * SCALE;
      const wrY = wrX * TILT;
      if (rig.swimPose && rig.lift < -1.0) {
        dctx.fillStyle = `rgba(18, 118, 156, ${0.28 * waistWet})`;
        dctx.beginPath();
        dctx.ellipse(wcx, wcy, wrX * 0.95, wrY * 0.9, 0, 0, Math.PI);
        dctx.fill();
      }
      dctx.strokeStyle = `rgba(${fx.foamRGB}, ${0.82 * waistWet})`;
      dctx.lineWidth = Math.max(1.8, SCALE * 0.38);
      dctx.beginPath();
      dctx.ellipse(wcx, wcy, wrX, wrY, 0, 0.08, Math.PI - 0.08);
      dctx.stroke();
      dctx.strokeStyle = `rgba(${fx.ringRGB}, ${0.58 * waistWet})`;
      dctx.lineWidth = Math.max(1.2, SCALE * 0.24);
      dctx.beginPath();
      dctx.ellipse(wcx, wcy + SCALE * 0.9, wrX * 1.22, wrY * 1.18, 0, 0.2, Math.PI - 0.2);
      dctx.stroke();
      dctx.restore();
    }

    // 4. 3D 像素技能特效
    if (sState.waveWall && sState.waveWall.h > 1.5) {
      const ww = sState.waveWall;
      for (let r = 0; r < 7; r++) {
        const vr = r / 6, curlY = Math.sin(vr * Math.PI * 0.85) * 9.5, zz = vr * ww.h;
        for (let ci = 0; ci < 17; ci++) {
          const u = (ci / 16) * 2 - 1, arch = 1 - u * u * 0.38;
          const col = vr > 0.78 ? fx.foam : (vr > 0.45 ? fx.hot : (vr > 0.2 ? fx.mid : fx.deep));
          drawVoxelBlock(u * ww.width * 0.5, ww.y - u * u * 11.5 + curlY,
            Math.max(1, zz * arch + Math.sin(animTime * 14 + ci * 0.8) * 1.1),
            3.4 + (1 - vr) * 1.2, col, vr > 0.62);
        }
      }
    }

    if (sState.bubble) {
      const bb = sState.bubble;
      const [bx, by] = proj(bb.x, bb.y, bb.z, pSc);
      const cx = Math.round(bx * toMain), cy = Math.round(by * toMain);
      const radPx = Math.max(6, Math.round(bb.r * SCALE));
      dctx.save();
      dctx.fillStyle = fx.bubbleFill;
      dctx.beginPath();
      dctx.ellipse(cx, cy, radPx, radPx * (0.94 + bb.wobble * 0.04), 0, 0, TAU);
      dctx.fill();
      dctx.strokeStyle = fx.bubbleStroke;
      dctx.lineWidth = Math.max(2, Math.round(SCALE * 0.45));
      dctx.stroke();
      const spSz = Math.max(3, Math.round(radPx * 0.24));
      dctx.fillStyle = fx.bubbleSpec;
      dctx.fillRect(cx - Math.round(radPx * 0.46), cy - Math.round(radPx * 0.48), spSz, spSz);
      dctx.fillRect(cx - Math.round(radPx * 0.22), cy - Math.round(radPx * 0.60), Math.max(2, spSz >> 1), Math.max(2, spSz >> 1));
      dctx.fillRect(cx + Math.round(radPx * 0.30), cy + Math.round(radPx * 0.34), Math.max(2, spSz >> 1), Math.max(2, spSz >> 1));
      dctx.restore();
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * TAU + animTime * 4.5;
        drawVoxelBlock(bb.x + Math.cos(a) * (bb.r + 1.5), bb.y + Math.sin(a) * (bb.r + 1.5),
          bb.z + Math.sin(a * 2) * 2.5, 1.7, k & 1 ? fx.core : fx.hot, true);
      }
    }

    for (const n of notes) {
      const u = clamp(n.t / n.dur, 0, 1);
      const nx = lerp(n.sx, n.tx, u) + Math.sin(u * Math.PI * 3 + n.phase) * 4.2;
      const ny = lerp(n.sy, n.ty, u);
      const nz = lerp(n.sz, n.tz, u) + Math.sin(u * Math.PI) * 9.5 + Math.cos(u * 14 + n.phase) * 1.6;
      const [px, py] = proj(nx, ny, nz, pSc);
      const sx = Math.round(px * toMain), sy = Math.round(py * toMain);
      const unit = Math.max(2, Math.round(SCALE * 0.72));
      dctx.fillStyle = fx.noteColor;
      dctx.fillRect(sx - unit, sy, unit * 2, unit * 2);
      dctx.fillRect(sx + unit, sy - unit * 3, unit, unit * 4);
      dctx.fillRect(sx + unit, sy - unit * 3, unit * 2, unit);
      dctx.fillStyle = fx.noteCore;
      dctx.fillRect(sx - unit + 1, sy + 1, Math.max(1, unit), Math.max(1, unit));
      const es = Math.max(1, Math.round(unit * 2 * eScale));
      ectx.fillStyle = fx.noteColor;
      ectx.fillRect(Math.round(px * toE) - (es >> 1), Math.round(py * toE) - (es >> 1), es, es);
    }

    for (const rg of shockRings) {
      const u = clamp(rg.t / rg.life, 0, 1);
      const rad = lerp(rg.r0, rg.r1, smoothstep(0, 1, u));
      const bSz = Math.max(1.2, (1 - u * 0.55) * 2.2);
      for (let i = 0; i < 26; i++) {
        const a = (i / 26) * TAU;
        drawVoxelBlock(rg.x + Math.cos(a) * rad, rg.y + Math.sin(a) * rad, rg.z, bSz, rg.color, rg.glow);
      }
    }

    for (const p of particles) {
      const u = p.t / p.life;
      drawVoxelBlock(p.x, p.y, p.z, p.sz * (1 - u * 0.55), p.color, p.glow);
    }
    for (const dr of ambientDrops) {
      const dz = ((dr.z + animTime * dr.sp) % 34) + 3;
      const dx = dr.x + Math.sin(animTime * 1.4 + dr.ph) * 4.5;
      const dy = dr.y + Math.cos(animTime * 1.2 + dr.ph) * 4.5;
      drawVoxelBlock(dx, dy, dz, 1.05, fx.hot, true);
    }

    // 5. 真 1/4 降采样离屏模糊
    ebctx.setTransform(1, 0, 0, 1, 0, 0);
    ebctx.clearRect(0, 0, EW, EH);
    ebctx.filter = `blur(${Math.max(1, Math.round(SCALE * 0.16))}px)`;
    ebctx.drawImage(ec, 0, 0);
    ebctx.filter = 'none';

    dctx.globalCompositeOperation = 'screen';
    dctx.imageSmoothingEnabled = true;
    dctx.globalAlpha = clamp(0.72 * sState.glowBoost, 0, 1);
    dctx.drawImage(eb, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = clamp(0.52 * sState.glowBoost, 0, 1);
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(ec, 0, 0, cv.width, cv.height);
    dctx.globalAlpha = 1;
    dctx.globalCompositeOperation = 'source-over';
    drawCalls += 2;

    if (flashAlpha > 0.01) {
      dctx.fillStyle = `rgba(${fx.flashRGB}, ${flashAlpha})`;
      dctx.fillRect(0, 0, cv.width, cv.height);
    }

    const cpuMs = performance.now() - tCpu0;
    cpuMsSmooth = cpuMsSmooth * 0.88 + cpuMs * 0.12;

    statTimer += dt;
    if (statTimer >= 0.25) {
      statTimer = 0;
      const hitRate = (cacheHits + cacheMisses) ? Math.round(cacheHits * 100 / (cacheHits + cacheMisses)) : 100;
      $('stats').innerHTML =
        `<span>建模 <b>${buildMs}ms</b></span>` +
        (skinMs > 0 ? `<span>换色 <b>${skinMs}ms</b></span>` : '') +
        `<span>帧率 <b>${fpsVal}fps</b></span>` +
        `<span>单帧 <b>${cpuMsSmooth.toFixed(1)}ms</b></span>` +
        `<span>绘制 <b>${drawCalls}次</b></span>` +
        `<span>色表 <b>${PAL_KEYS.length}色</b></span>` +
        (mode === 'cached' ? `<span>缓存 <b>${spriteCache.size}</b> (${hitRate}%)</span>` : '');
    }

    requestAnimationFrame(tick);
  }

  // 7. HUD 绑定与交互
  const $ = id => document.getElementById(id);

  function buildBars() {
    const sb = $('skinBar');
    sb.innerHTML = '';
    SKINS.forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="swatch" style="background:${sk.dot}"></span>${sk.name}`;
      btn.onclick = () => applySkin(idx, true);
      sb.appendChild(btn);
    });
    const kb = $('skillBar');
    kb.innerHTML = '';
    SKILLS.forEach((sk, idx) => {
      const btn = document.createElement('button');
      btn.className = 'skill-btn';
      btn.textContent = `${idx + 1}. ${sk.name}`;
      btn.onclick = () => startSkill(idx);
      kb.appendChild(btn);
    });
  }

  function syncUI() {
    $('skinBadge').textContent = `${curSkin.name} · ${curSkin.tag}`;
    $('skinBar').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === skinIdx));
    $('skillBar').querySelectorAll('button').forEach((b, i) => {
      b.classList.toggle('active', !!(activeSkill && activeSkill.id === SKILLS[i].id));
    });
    $('btnFloat').classList.toggle('on', !activeSkill && baseMode === 'float');
    $('btnSwim').classList.toggle('on', !activeSkill && baseMode === 'swim');
    $('btnSpin').classList.toggle('on', autoSpin);
    $('btnOutline').classList.toggle('on', useOutline);
    $('btnMode').textContent = '模式：' + MODE_LABEL[MODES[modeIdx]];
    $('btnMode').classList.toggle('on', MODES[modeIdx] === 'cached');
  }

  $('btnFloat').onclick = () => { activeSkill = null; baseMode = 'float'; syncUI(); showBanner('水中生态 · 浅水划尾', 1.1); };
  $('btnSwim').onclick  = () => { activeSkill = null; baseMode = 'swim';  syncUI(); showBanner('水中生态 · 潜浮巡游（脉冲摆尾）', 1.3); };
  $('btnSpin').onclick  = () => { autoSpin = !autoSpin; syncUI(); };
  $('btnOutline').onclick = () => { useOutline = !useOutline; syncUI(); };
  $('btnMode').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; fit(); syncUI(); };
  $('btnReset').onclick = () => {
    thTarget = 0.56;
    th = thTarget + (((th - thTarget + Math.PI) % TAU + TAU) % TAU - Math.PI);
    zoom = 0; autoSpin = false; baseMode = 'float'; activeSkill = null; fit(); syncUI();
  };
  $('btnExport').onclick = () => {
    const asset = parts.head;
    const a = document.createElement('a');
    a.download = `siren_${curSkin.id}_head_${asset.w}x${asset.d}x${asset.h}.png`;
    a.href = asset.strip.toDataURL('image/png');
    a.click();
  };

  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, th }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (drag) { th = thTarget = drag.th + (e.clientX - drag.x) * 0.01; } });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => {
    zoom = clamp(zoom + (e.deltaY > 0 ? -1 : 1), -2, 5);
    fit(); e.preventDefault();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'q' || e.key === 'Q') thTarget -= Math.PI / 4;
    if (e.key === 'e' || e.key === 'E') thTarget += Math.PI / 4;
    if (e.key === 'c' || e.key === 'C') applySkin(skinIdx + 1, true);
    if (e.key === 's' || e.key === 'S') {
      activeSkill = null;
      baseMode = baseMode === 'swim' ? 'float' : 'swim';
      syncUI();
      showBanner(baseMode === 'swim' ? '水中生态 · 潜浮巡游' : '水中生态 · 浅水划尾', 1.2);
    }
    if (e.key >= '1' && e.key <= '4') startSkill(Number(e.key) - 1);
  });
  window.addEventListener('resize', fit);

  window.__SIREN_DEBUG__ = {
    getStats: () => ({
      buildMs: Number(buildMs),
      skinMs, skin: curSkin.id, baseMode,
      fps: fpsVal, cpuMs: Number(cpuMsSmooth.toFixed(2)),
      cacheSize: spriteCache.size, cacheHits, cacheMisses,
      th, zoom, mode: MODES[modeIdx], paletteCount: PAL_KEYS.length,
      activeSkill: activeSkill ? activeSkill.id : null
    }),
    setAngle: a => { th = thTarget = a; },
    setSkin: idx => applySkin(idx, false),
    setBaseMode: m => { activeSkill = null; baseMode = m; syncUI(); },
    triggerSkill: i => startSkill(i),
    setAutoSpin: v => { autoSpin = v; syncUI(); },
    setZoom: z => { zoom = clamp(z, -2, 5); fit(); }
  };

  buildBars(); fit(); syncUI(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
