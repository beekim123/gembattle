<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code00 · 战斗布局候选</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #07080c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 16:9 等比缩放，窗口比例不一样就上下或左右留黑边 */
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; }
</style>
</head>
<body>
<canvas id="stage" width="960" height="540"></canvas>
<script type="module">
  // 用法：?layout=1|2|3&scene=chain|pack|gate
  import { createRenderer } from '../../render/index.js';
  import { LAYOUTS } from './layouts.js';
  import { SCENES } from './scenes.js';

  const q = new URLSearchParams(location.search);
  const layout = LAYOUTS[q.get('layout') || '3'];
  const scene = SCENES[q.get('scene') || 'chain'];
  const canvas = document.getElementById('stage');
  const renderer = createRenderer(canvas, { width: 960, height: 540, dpr: Math.min(window.devicePixelRatio || 1, 2) });
  const draw = () => layout.draw(renderer, scene);
  draw();
  if (document.fonts?.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
